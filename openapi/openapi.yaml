  /v2/organizations/{organizationId}/memberships:
    get:
      description: |
        Who belongs to this organization, with the role and display identity of
        each principal. The optional `publicationId` query filter narrows the
        page to the memberships that reach one publication, which is what makes
        a publication-scoped `organization.members.view` grant usable: an
        unfiltered call from such a caller is refused with AUTHORIZATION_DENIED
        rather than quietly widened to the whole member list, because the whole
        member list is not what that grant covers (LOCAL-41 (2)). A caller whose
        grant is organization-scoped may send the filter or omit it.
      operationId: getOrganizationsByOrganizationIdMemberships
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - description: Restrict the page to principals who hold a membership in this organization that grants them access to this publication. Without the filter the read is organization-wide, so a caller whose `organization.members.view` grant is scoped to a single publication is refused; with it, that caller is answered for exactly the publication it is entitled to (LOCAL-41 (2)).
          example: 018f0000-0000-7000-8000-000000000001
          in: query
          name: publicationId
          required: false
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
