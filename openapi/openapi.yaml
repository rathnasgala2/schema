  /v2/organizations/{organizationId}/publications/{publicationId}/destination:
    get:
      description: |
        The publication's chosen deployment destination (LOCAL-63). The
        sub-resource exists for every publication whether or not it has been
        set: `state: UNSET` with `version: 0` is the honest representation of
        "no destination chosen yet", so `PUT` can use the required `If-Match`
        header uniformly ("0" means create) with no `If-None-Match` special
        case and no separate create operation. `state: SET` means the author
        has chosen a destination that has not yet been fixed by a publish;
        `state: LOCKED` means the first accepted publish fixed it permanently
        (a new destination requires a new publication). `adapterId`,
        `environment` and `providerBinding` are present exactly when `state`
        is `SET` or `LOCKED`. For `github-pages`, `providerBinding` is derived
        from the live repository binding and is absent when the publication is
        currently unbound. For `do-spaces`, `providerBinding` carries the
        complete DEC-097 provider binding, including the two pre-authorized
        control-plane digests the workload deployment intent must reproduce.
        For `local-directory`, `providerBinding` is absent (nothing to
        configure). `admittedRegions` is the exact accepted DigitalOcean Spaces
        region catalog, present regardless of the chosen adapter, so a client
        never hard-codes provider facts.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdDestination
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
        - example: 018f0000-0000-7000-8000-000000000001
