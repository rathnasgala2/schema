        admittedRegions:
          description: The exact accepted DigitalOcean Spaces region catalog (server-owned `spacesRegionCatalog`), so a client never hard-codes provider facts (LOCAL-63c). ASCII-sorted, present regardless of the chosen adapter so a Spaces picker can render before the author selects it.
          items:
            $ref: "#/components/schemas/PortableDeploymentIntentSpacesRegion"
          maxItems: 64
          minItems: 1
          type: array
          uniqueItems: true
        callerCapabilities:
          description: Capability keys the calling principal holds on this resource, so that a client can enable or hide controls without guessing (LOCAL-34 G15/G16). Absent means the server did not compute it; it is never an authorization decision by itself.
          items:
            maxLength: 160
            minLength: 1
            type: string
          maxItems: 200
          type: array
          uniqueItems: true
        environment:
          description: Equals `adapterId`; present exactly when `adapterId` is present.
          enum:
            - github-pages
            - do-spaces
            - local-directory
          type: string
        lockedAt:
          $ref: "#/components/schemas/PortableDeploymentIntentRfc3339"
          description: "Present exactly when `state` is `LOCKED`: the instant the accepting publish transaction fixed the destination."
        lockedByOperationId:
          $ref: "#/components/schemas/PortableDeploymentIntentStableId"
          description: "Present exactly when `state` is `LOCKED`: the operation id of the publish that fixed the destination."
        providerBinding:
          additionalProperties: false
          properties:
            basePath:
              default: /
              maxLength: 512
              minLength: 1
              pattern: ^/$|^/(?:[A-Za-z0-9._-]+/)+$
              type: string
            controlPlaneBindingDigest:
              $ref: "#/components/schemas/PortableDeploymentIntentDigest"
            mutationKeyDigest:
              $ref: "#/components/schemas/PortableDeploymentIntentDigest"
            owner:
              maxLength: 39
              minLength: 1
              pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
              type: string
            region:
              $ref: "#/components/schemas/PortableDeploymentIntentSpacesRegion"
            regionCatalogDigest:
              $ref: "#/components/schemas/PortableDeploymentIntentDigest"
            repository:
              maxLength: 100
              minLength: 1
              pattern: ^(?!\.{1,2}$)[A-Za-z0-9._-]{1,100}$
              type: string
            repositoryId:
              $ref: "#/components/schemas/PortableDeploymentIntentGithubPositiveDecimal"
            servedApiOrigin:
              allOf:
                - $ref: "#/components/schemas/PortableDeploymentIntentUrlHttps"
              maxLength: 2048
              type: string
            servedBucket:
              $ref: "#/components/schemas/PortableDeploymentIntentSpacesBucket"
            stagingApiOrigin:
              allOf:
                - $ref: "#/components/schemas/PortableDeploymentIntentUrlHttps"
              maxLength: 2048
              type: string
            stagingBucket:
              $ref: "#/components/schemas/PortableDeploymentIntentSpacesBucket"
            targetDigest:
              $ref: "#/components/schemas/PortableDeploymentIntentDigest"
            websiteConfigurationDigest:
              $ref: "#/components/schemas/PortableDeploymentIntentDigest"
            websiteOrigin:
              allOf:
                - $ref: "#/components/schemas/PortableDeploymentIntentUrlHttps"
              maxLength: 2048
              type: string
          required: []
          type: object
        publicationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        state:
          enum:
            - UNSET
            - SET
            - LOCKED
          type: string
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - publicationId
        - version
        - state
      type: object
    ReceiptExchangeCapabilityIssuedResponse:
      additionalProperties: false
      properties:
        capabilityGeneration:
          maximum: 20
          minimum: 1
          type: integer
        kind:
          description: |
            The outer discriminator of the receipt-exchange response union.
            Optional, so a 2.7.x-era body still validates; a server that speaks
            2.8.0 always sends it.
          pattern: ^deployment-receipt-capability-issued$
          type: string
          x-gala-const: deployment-receipt-capability-issued
        purpose:
          pattern: ^deployment-receipt$
          type: string
          x-gala-const: deployment-receipt
        reportingCapability:
          maxLength: 43
          minLength: 43
          pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
          type: string
        reportingCapabilityExpiresAt:
          $ref: "#/components/schemas/PortableProblemRfc3339"
        state:
          pattern: ^capability-issued$
          type: string
          x-gala-const: capability-issued
      required:
        - purpose
        - state
        - capabilityGeneration
        - reportingCapability
        - reportingCapabilityExpiresAt
      type: object
    ReceiptExchangeDeploymentIntentRequest:
      additionalProperties: false
      allOf:
        - if:
            properties:
              adapter:
                properties:
                  adapterId:
                    pattern: ^github-pages$
                    type: string
                    x-gala-const: github-pages
                required:
                  - adapterId
            required:
              - adapter
          then:
            not:
              required:
                - spacesStagePrefix
        - if:
            properties:
              adapter:
                properties:
                  adapterId:
                    pattern: ^do-spaces$
                    type: string
                    x-gala-const: do-spaces
                required:
                  - adapterId
            required:
              - adapter
          then:
            not:
              required:
                - pagesBuildVersion
        - if:
            properties:
              adapter:
                properties:
                  adapterId:
                    pattern: ^local-directory$
                    type: string
                    x-gala-const: local-directory
                required:
                  - adapterId
            required:
              - adapter
          then:
            not:
              anyOf:
                - required:
                    - pagesBuildVersion
                - required:
                    - spacesStagePrefix
      description: |
        What the workflow holds. `pagesBuildVersion` and `spacesStagePrefix` are
        optional here (LOCAL-57): the API derives the same two values
        deterministically from identifiers it mints, so a workflow that cannot
        compute them simply omits them, and one that can may send them. A sent
        value that does not equal the derived one is refused with `422
        VALIDATION_FAILED` -- it is a disagreement about what is being deployed,
        not a formatting error. They were required in 2.7.x, and each is still
        confined to the adapter it belongs to. The retained deployment-intent
        document carries both as required, server-derived members.

        SCHEMA-2.9.0 (LOCAL-60, DEC-097 section 7) extends the same rule to the
        members the workflow has no honest source for: `destination` is the
        request-side `ReceiptExchangeIntentRequestDestination` (its
        `environment` and `targetDigest` are api-derived), `rebuildRecord` is
        the request-side `ReceiptExchangeIntentRequestRebuildRecord` (its four
        Gala-owned members are api-derived) and `capabilityDecisionDigest` is
        api-derived. Each is optional on the request; a present value that
        disagrees with the api's derivation is refused with `422
        VALIDATION_FAILED`. `provenanceDigest` and `sbomDigest` stay required:
        they digest records the workflow itself authors. The retained
        deployment-intent document is unchanged and carries every member as
        required. Every 2.8.x request body that names the retained members with
        the values the api derives is still valid.
      properties:
        adapter:
          $ref: "#/components/schemas/PortableDeploymentIntentAdapterIdentity"
        artifactByteCount:
          format: int64
          minimum: 1
          type: integer
        artifactDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        artifactFileCount:
          format: int64
          minimum: 1
          type: integer
        artifactId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        capabilityDecisionDigest:
          description: |
            The digest of the closed `capabilityDecision` record (DEC-097
            section 8), when the workflow knows it. Optional (SCHEMA-2.9.0,
            LOCAL-60): the decision is server-owned, so the API constructs the
            record, derives this digest and refuses a disagreement with `422
            VALIDATION_FAILED`. Required in 2.8.x; required and server-derived
            in the retained deployment-intent document.
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        destination:
          $ref: "#/components/schemas/ReceiptExchangeIntentRequestDestination"
        effectiveArtifactExpiresAt:
          $ref: "#/components/schemas/PortableDeploymentIntentRfc3339"
        frozenEnvelopeByteCount:
          format: int64
          minimum: 1
          type: integer
        frozenEnvelopeDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        frozenHandoffArtifactId:
          pattern: ^[1-9][0-9]{0,19}$
          type: string
        frozenHandoffName:
          $ref: "#/components/schemas/PortableDeploymentIntentPlainLabel"
        lockDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        manifestDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        pagesBuildVersion:
          description: |
            The Pages build version this deployment addresses, when the
            workflow knows it. Optional: the API derives the same value and
            refuses a disagreement (LOCAL-57). Admitted only for
            `github-pages`.
          pattern: ^[0-9a-f]{40}$
          type: string
        provenanceDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        publisher:
          $ref: "#/components/schemas/PortableDeploymentIntentPackageIdentity"
        purpose:
          pattern: ^deployment-intent$
          type: string
          x-gala-const: deployment-intent
        rebuildRecord:
          $ref: "#/components/schemas/ReceiptExchangeIntentRequestRebuildRecord"
        requestedArtifactRetentionDays:
          maximum: 7
          minimum: 1
          type: integer
        sbomDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        sourceCommit:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        spacesStagePrefix:
          description: |
            The Spaces staging prefix this deployment stages under, when the
            workflow knows it. Optional: the API derives the same value and
            refuses a disagreement (LOCAL-57). Admitted only for `do-spaces`.
          maxLength: 512
          minLength: 1
          type: string
        verificationSubmission:
          description: |
            Whether the complete verification plan fits one request. The two
            arms are named components with an explicit `state` discriminator, so
            a generator emits two bound subtypes instead of one anonymous union
            with no members (API 2.7.1 consumer report).
          discriminator:
            mapping:
              fit: "#/components/schemas/VerificationSubmissionFit"
              unfit: "#/components/schemas/VerificationSubmissionUnfit"
            propertyName: state
          oneOf:
            - $ref: "#/components/schemas/VerificationSubmissionFit"
            - $ref: "#/components/schemas/VerificationSubmissionUnfit"
        workflowTriggerCommit:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
      required:
        - purpose
        - sourceCommit
        - workflowTriggerCommit
        - artifactId
        - artifactDigest
        - manifestDigest
        - provenanceDigest
        - sbomDigest
        - frozenHandoffArtifactId
        - frozenHandoffName
        - frozenEnvelopeDigest
        - frozenEnvelopeByteCount
        - artifactByteCount
        - artifactFileCount
        - requestedArtifactRetentionDays
        - effectiveArtifactExpiresAt
        - verificationSubmission
        - lockDigest
        - rebuildRecord
        - publisher
        - adapter
        - destination
      type: object
    ReceiptExchangeDeploymentIntentResponse:
      additionalProperties: false
      properties:
        deploymentIntent:
          $ref: "#/components/schemas/PortableDeploymentIntentDocument"
        kind:
          description: |
            The outer discriminator of the receipt-exchange response union.
            Optional, so a 2.7.x-era body still validates; a server that speaks
            2.8.0 always sends it.
          pattern: ^deployment-intent$
          type: string
          x-gala-const: deployment-intent
        purpose:
          pattern: ^deployment-intent$
          type: string
          x-gala-const: deployment-intent
        reportChallengeExpiresAt:
          $ref: "#/components/schemas/PortableProblemRfc3339"
        reportChallengeId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
      required:
        - purpose
        - deploymentIntent
        - reportChallengeId
        - reportChallengeExpiresAt
      type: object
    ReceiptExchangeDeploymentReceiptRequest:
      additionalProperties: false
      properties:
        attemptId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        intentDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        operationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        purpose:
          pattern: ^deployment-receipt$
          type: string
          x-gala-const: deployment-receipt
        reportChallengeId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
      required:
        - purpose
        - operationId
        - attemptId
        - intentDigest
        - reportChallengeId
      type: object
    ReceiptExchangeIntentRequestDestination:
      additionalProperties: false
      allOf:
        - if:
            properties:
              adapterId:
                pattern: ^github-pages$
                type: string
                x-gala-const: github-pages
            required:
              - adapterId
          then:
            properties:
              environment:
                pattern: ^github-pages$
                type: string
                x-gala-const: github-pages
              providerBinding:
                properties:
                  mutationSurfaceDigest: false
                  rootIdentityDigest: false
                required:
                  - owner
                  - repository
        - if:
            properties:
              adapterId:
                pattern: ^do-spaces$
                type: string
                x-gala-const: do-spaces
            required:
              - adapterId
          then:
            not:
              required:
                - providerBinding
            properties:
              environment:
                pattern: ^do-spaces$
                type: string
                x-gala-const: do-spaces
        - if:
            properties:
              adapterId:
                pattern: ^local-directory$
                type: string
                x-gala-const: local-directory
            required:
              - adapterId
          then:
            properties:
              environment:
                pattern: ^local-directory$
                type: string
                x-gala-const: local-directory
              providerBinding:
                properties:
                  owner: false
                  repository: false
                required:
                  - mutationSurfaceDigest
                  - rootIdentityDigest
      description: |
        The destination as the workflow holds it (SCHEMA-2.9.0, LOCAL-60,
        DEC-097 section 7). `adapterId`, `adapterVersion` and `baseUrl` are
        required: the adapter is lock-derived and the base URL is the
        publication's canonical base, both workflow-verifiable. `environment`
        and `targetDigest` are optional: the API derives `environment` as the
        adapter's constant (LOCAL-60a) and `targetDigest` as the digest of its
        own retained provider binding, and refuses a present value that
        disagrees with `422 VALIDATION_FAILED`. `providerBinding` is admitted
        per adapter: for `github-pages` it names the repository the runner is
        bound to (`owner`, `repository`, checked against the API's repository
        binding); for `local-directory` it supplies the two evidence digests the
        API has no other source for (`rootIdentityDigest`,
        `mutationSurfaceDigest`, DEC-097 section 7); for `do-spaces` it is
        forbidden on the request until the publication destination record
        exists (C2) -- the buckets and region are bound to the author
        destination, never proposed by a deploy job. The retained
        deployment-intent `destinationIdentity` is unchanged.
      properties:
        adapterId:
          description: |
            The lock-selected adapter, one of the three MVP adapters
            (SCHEMA-2.9.0 review): the per-adapter `providerBinding` and
            `environment` rules above key on it, so an identity outside the
            vocabulary is refused here rather than falling through every
            branch. The retained `destinationIdentity.adapterId` stays a
            `plainLabel` (fixture adapters).
          enum:
            - github-pages
            - do-spaces
            - local-directory
          type: string
        adapterVersion:
          $ref: "#/components/schemas/PortableDeploymentIntentSemver"
        baseUrl:
          allOf:
            - $ref: "#/components/schemas/PortableDeploymentIntentUrlHttps"
          maxLength: 2048
          type: string
          x-gala-utf8ByteLength:
            maximum: 2048
        environment:
          description: |
            Optional (SCHEMA-2.9.0): the API derives the adapter's constant
            (`github-pages`, `do-spaces` or `local-directory`, LOCAL-60a) and
            refuses a disagreement with `422 VALIDATION_FAILED`. Required in
            the retained document.
          enum:
            - github-pages
            - do-spaces
            - local-directory
          type: string
        providerBinding:
          $ref: "#/components/schemas/ReceiptExchangeIntentRequestProviderBinding"
        targetDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
          description: |
            Optional (SCHEMA-2.9.0): the API derives the digest of its retained
            provider binding (`GALA-DESTINATION-PROVIDER-BINDING-V2`) and
            refuses a disagreement with `422 VALIDATION_FAILED`. Required in
            the retained document.
      required:
        - adapterId
        - adapterVersion
        - baseUrl
      type: object
    ReceiptExchangeIntentRequestProviderBinding:
      additionalProperties: false
      description: |
        Request-side provider binding material (SCHEMA-2.9.0). Which members are
        admitted is fixed by the owning destination's `adapterId`: `owner` and
        `repository` for `github-pages` (the same spellings as the retained
        `destinationProviderCoordinates`), `rootIdentityDigest` and
        `mutationSurfaceDigest` for `local-directory` (DEC-097 section 7 local
        binding), nothing for `do-spaces`.
      properties:
        mutationSurfaceDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
          description: |
            `local-directory` only: the descriptor-proved, path-insensitive
            physical mutation surface digest (`GALA-LOCAL-MUTATION-SURFACE-V2`).
        owner:
          description: GitHub owner login, for `github-pages` destinations.
          maxLength: 39
          minLength: 1
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
          type: string
          x-gala-asciiByteLength:
            maximum: 39
            minimum: 1
        repository:
          description: GitHub repository name, for `github-pages` destinations.
          maxLength: 100
          minLength: 1
          pattern: ^(?!\.{1,2}$)[A-Za-z0-9._-]{1,100}$
          type: string
          x-gala-asciiByteLength:
            maximum: 100
            minimum: 1
        rootIdentityDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
          description: |
            `local-directory` only: the path-sensitive root identity digest
            (`GALA-LOCAL-ROOT-IDENTITY-V2`).
      type: object
    ReceiptExchangeIntentRequestRebuildRecord:
      additionalProperties: false
      description: |
        The request-side reproducible build record (SCHEMA-2.9.0, LOCAL-60).
        It carries exactly the members of the retained
        `reproducibleBuildRecord` (DEC-097 section 5), by the same definitions,
        with the four Gala-owned members optional: `policyReleaseId` and
        `buildPolicyDecisionDigest` equal the accepted policy decisions,
        `packageReleaseCatalogDigest` equals the server-selected catalog and
        `destinationCapabilityDigest` equals the owning validated destination
        record. The API derives each of the four, writes it into the retained
        record before retention and refuses a present value that disagrees with
        `422 VALIDATION_FAILED`. The retained record is unchanged: one
        byte-identical closed object in build provenance, the deployment intent,
        the authorization request and the durable operation record, with every
        member required.
      properties:
        basePath:
          $ref: "#/components/schemas/PortableDeploymentIntentCanonicalRoute"
        baseUrl:
          $ref: "#/components/schemas/PortableDeploymentIntentUrlHttps"
        buildEpoch:
          $ref: "#/components/schemas/PortableDeploymentIntentRfc3339"
        buildInputDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
        buildPolicyDecisionDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
          description: |
            Optional (SCHEMA-2.9.0): the API derives the accepted build-policy
            decision digest and refuses a disagreement with `422
            VALIDATION_FAILED`. Required in the retained record.
        builder:
          allOf:
            - $ref: "#/components/schemas/PortableDeploymentIntentPackageIdentity"
            - properties:
                package:
                  pattern: ^@rathnasgala2/publish-action$
                  type: string
                  x-gala-const: "@rathnasgala2/publish-action"
        contractVersion:
          pattern: ^2\.0\.0$
          type: string
          x-gala-const: 2.0.0
        dependencyLockDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
        destinationCapabilityDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
          description: |
            Optional (SCHEMA-2.9.0): the API derives it from the owning
            validated destination record and refuses a disagreement with `422
            VALIDATION_FAILED`. Required in the retained record.
        packageReleaseCatalogDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
          description: |
            Optional (SCHEMA-2.9.0): the API derives the server-selected
            package release catalog digest and refuses a disagreement with
            `422 VALIDATION_FAILED`. Required in the retained record.
        policyReleaseId:
          $ref: "#/components/schemas/PortableDeploymentIntentStableId"
          description: |
            Optional (SCHEMA-2.9.0): the API derives the accepted immutable
            policy release identity and refuses a disagreement with `422
            VALIDATION_FAILED`. Required in the retained record.
        renderPolicy:
          $ref: "#/components/schemas/PortableDeploymentIntentRenderPolicyIdentity"
        repositoryId:
          $ref: "#/components/schemas/PortableDeploymentIntentGithubPositiveDecimal"
        repositoryRootDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
        schemas:
          allOf:
            - $ref: "#/components/schemas/PortableDeploymentIntentPackageIdentity"
            - properties:
                package:
                  pattern: ^@rathnasgala2/schemas$
                  type: string
                  x-gala-const: "@rathnasgala2/schemas"
        sourceCommit:
          $ref: "#/components/schemas/PortableDeploymentIntentGitObjectId"
        sourceTree:
          $ref: "#/components/schemas/PortableDeploymentIntentGitObjectId"
        stylingContractDigest:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
        template:
          allOf:
            - $ref: "#/components/schemas/PortableDeploymentIntentPackageIdentity"
            - properties:
                package:
                  pattern: ^@rathnasgala2/template$
                  type: string
                  x-gala-const: "@rathnasgala2/template"
        theme:
          allOf:
            - $ref: "#/components/schemas/PortableDeploymentIntentPackageIdentity"
            - properties:
                package:
                  enum:
                    - "@rathnasgala2/theme-default"
                    - "@rathnasgala2/theme-amaze"
                    - "@rathnasgala2/theme-flashy"
                    - "@rathnasgala2/theme-minimal"
                    - "@rathnasgala2/theme-zebra"
        workflowIdentity:
          $ref: "#/components/schemas/PortableDeploymentIntentDigest"
      required:
        - repositoryId
        - sourceCommit
        - sourceTree
        - repositoryRootDigest
        - buildEpoch
        - contractVersion
        - builder
        - schemas
        - template
        - theme
        - dependencyLockDigest
        - buildInputDigest
        - baseUrl
        - basePath
        - stylingContractDigest
        - renderPolicy
        - workflowIdentity
      type: object
    ReceiptExchangeSubmissionRecordedResponse:
      additionalProperties: false
      properties:
        kind:
          description: |
            The outer discriminator of the receipt-exchange response union.
            Optional, so a 2.7.x-era body still validates; a server that speaks
            2.8.0 always sends it.
          pattern: ^deployment-receipt-submission-recorded$
          type: string
          x-gala-const: deployment-receipt-submission-recorded
        operationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        purpose:
          pattern: ^deployment-receipt$
          type: string
          x-gala-const: deployment-receipt
        state:
          pattern: ^submission-recorded$
          type: string
          x-gala-const: submission-recorded
        statusUrl:
          description: Exactly `/v2/organizations/{organizationId}/operations/{operationId}`. Clients navigate to this URL verbatim and never construct the path themselves (LOCAL-36 G-14). It is an API path under `/v2/...` rather than a client route, so a browser client resolves it through its own routing table (the App maps `/v2/organizations/{organizationId}/operations/{operationId}` onto `/organizations/{organizationId}/operations/{operationId}`) rather than treating it as a link to follow directly.
          minLength: 1
          pattern: ^/(?!/)(?!.*//)(?!.*[?#]).*$
          type: string
      required:
        - purpose
        - state
        - operationId
        - statusUrl
      type: object
    RepositoryBindingState:
      enum:
        - PENDING
        - ACTIVE
        - AUTHORITY_LOST
        - TRANSFERRING
        - REVOKED
      type: string
    RepositoryChangeState:
      enum:
        - REQUESTED
        - PLANNED
        - AWAITING_CONFIRMATION
        - COMMIT_REQUESTED
        - COMMITTING
        - COMMITTED
        - UNKNOWN_RECONCILING
        - FAILED_NO_CHANGE
        - CANCELLED
      type: string
    RetirementConsequence:
      additionalProperties: false
      properties:
        code:
          description: Closed, machine-readable consequence identifier the client renders through its own copy deck.
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:[-.][a-z0-9]+)*$
          type: string
        detail:
          description: Plain, non-sensitive summary of this consequence.
          maxLength: 320
          minLength: 1
          type: string
        reversible:
          type: boolean
      required:
        - code
        - detail
        - reversible
      type: object
    ReviewState:
      enum:
        - REQUESTED
        - APPROVED
        - REJECTED
        - INVALIDATED
      type: string
    ReviewSummary:
      additionalProperties: false
      description: |
        One review of an exact source revision. It is the same body the single
        review read returns, so a list row and a read of that row never
        disagree.
      properties:
        findingsDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        reviewId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        sourceRevision:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        state:
          $ref: "#/components/schemas/ReviewState"
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - reviewId
        - version
        - state
        - sourceRevision
      type: object
    RoleScope:
      enum:
        - ORGANIZATION
        - PUBLICATION
        - ORGANIZATION_OR_PUBLICATION
      type: string
    RoleSummary:
      additionalProperties: false
      properties:
        capabilityKeys:
          items:
            maxLength: 160
            minLength: 1
            type: string
          maxItems: 200
          type: array
          uniqueItems: true
        description:
          maxLength: 320
          minLength: 1
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        roleId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        scope:
          $ref: "#/components/schemas/RoleScope"
        stableKey:
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          type: string
      required:
        - roleId
        - stableKey
        - scope
        - name
        - description
        - capabilityKeys
      type: object
    SessionFamilyState:
      enum:
        - ACTIVE
        - ROTATED
        - REVOKED
        - EXPIRED
        - COMPROMISED
      type: string
    SessionSummary:
      additionalProperties: false
      properties:
        authenticatedAt:
          $ref: "#/components/schemas/PortableProblemRfc3339"
        current:
          type: boolean
        lastSeenAt:
          $ref: "#/components/schemas/PortableProblemRfc3339"
        sessionFamilyId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        state:
          $ref: "#/components/schemas/SessionFamilyState"
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - sessionFamilyId
        - version
        - state
        - authenticatedAt
        - lastSeenAt
        - current
      type: object
    VerificationPlanEntry:
      additionalProperties: false
      properties:
        byteLength:
          format: int64
          minimum: 0
          type: integer
        expectedCandidateDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        expectedContentType:
          maxLength: 128
          minLength: 3
          pattern: ^[a-z0-9][a-z0-9!#$&^_.+-]{0,62}/[a-z0-9][a-z0-9!#$&^_.+-]{0,62}(?:; charset=utf-8)?$
          type: string
        path:
          $ref: "#/components/schemas/PortableDeploymentReceiptRepoRelativePath"
        publicRoute:
          $ref: "#/components/schemas/PortableDeploymentReceiptCanonicalRoute"
        routeClass:
          enum:
            - html
            - feed
            - sitemap
            - asset
            - error
          type: string
      required:
        - path
        - publicRoute
        - routeClass
        - expectedContentType
        - byteLength
        - expectedCandidateDigest
      type: object
    VerificationSubmissionFit:
      additionalProperties: false
      description: The complete verification plan fits one request, and the request carries every entry.
      properties:
        state:
          pattern: ^fit$
          type: string
          x-gala-const: fit
        verificationEntries:
          items:
            $ref: "#/components/schemas/VerificationPlanEntry"
          maxItems: 900
          minItems: 1
          type: array
      required:
        - state
        - verificationEntries
      type: object
    VerificationSubmissionUnfit:
      additionalProperties: false
      description: The complete verification plan does not fit one request, so the request states why and by how much instead of carrying a truncated plan.
      properties:
        canonicalFitRequestByteCount:
          format: int64
          minimum: 1
          type: integer
        reason:
          enum:
            - entry-count-exceeded
            - encoded-request-limit-exceeded
          type: string
        requiredVerificationEntryCount:
          maximum: 200000
          minimum: 1
          type: integer
        state:
          pattern: ^unfit$
          type: string
          x-gala-const: unfit
      required:
        - state
        - reason
        - requiredVerificationEntryCount
        - canonicalFitRequestByteCount
      type: object
