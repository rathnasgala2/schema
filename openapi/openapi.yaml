          minimum: 400
          type: integer
        title:
          $ref: "#/components/schemas/PortableProblemPlainText"
          x-gala-graphemeLength:
            maximum: 120
            minimum: 1
        type:
          $ref: "#/components/schemas/PortableProblemProblemType"
      required:
        - schemaId
        - schemaVersion
        - type
        - title
        - status
        - code
        - detail
        - correlationId
