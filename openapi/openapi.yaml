    post:
      description: |
        Acceptance is possession-based. The token is the whole credential: the
        principal who presents it joins the organization with the invited role,
        whoever they are. The `recipient` recorded on the invitation is a label
        for the inviter's benefit and is never compared with the accepting
        principal's verified identity (LOCAL-34 G6). The token is single-use and
        non-enumerating; recipient binding is revisited when verified email
        exists.
      operationId: postMembershipInvitationsByTokenAccept
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
        - example: examplexxxxxxxxxxxxxxxxxxxxxxxxx
          in: path
          name: token
