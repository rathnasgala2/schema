                type: string
            required:
              - nextCursor
      properties:
        hasMore:
          type: boolean
        items:
          items:
            $ref: "#/components/schemas/GithubInstallationSummary"
          maxItems: 100
          type: array
        nextCursor:
          description: Opaque cursor for the next page. Present and non-null exactly when `hasMore` is true; absent or null when `hasMore` is false. The length bounds constrain the string branch only.
          maxLength: 2048
