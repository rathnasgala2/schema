  /v2/organizations/{organizationId}/membership-invitations:
    get:
      description: |
        The Members screen has to show the invitations that are outstanding
        right now, not only the one a person happens to have just created in
        this session, and the single-invitation read cannot supply that because
        it needs an id the client does not have. This is the keyset list behind
        it, newest-relevant first, defaulting to `state=PENDING`. It reuses the
        exact shape of the single-invitation read, so a row and a detail view
        never disagree, and like that read it is governed by
        `organization.members.view` (LOCAL-34 G3).
      operationId: getOrganizationsByOrganizationIdMembershipInvitations
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - description: Which invitation lifecycle state to list. Defaults to `PENDING`, because the outstanding invitations are what a Members screen has to show; a client asks for a settled state explicitly.
          example: PENDING
          in: query
          name: state
          required: false
          schema:
            default: PENDING
            enum:
              - PENDING
              - ACCEPTED
