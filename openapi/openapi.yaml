components:
  headers:
    CacheControlNoStore:
      required: true
      schema:
        pattern: ^no-store$
        type: string
        x-gala-const: no-store
    ETag:
      required: true
      schema:
        pattern: ^"[0-9]+"$
        type: string
    Location:
      required: true
      schema:
        minLength: 1
        pattern: ^/(?!/)(?!.*//)(?!.*[?#]).*$
        type: string
    RetryAfter:
      required: true
      schema:
        maximum: 86400
        minimum: 1
        type: integer
    XCorrelationId:
      required: true
      schema:
        format: uuid
        type: string
  parameters:
    Cursor:
      example: example
      in: query
      name: cursor
      required: false
      schema:
        maxLength: 2048
        minLength: 1
        type: string
    IdempotencyKey:
      example: 018f0000-0000-7000-8000-000000000001
      in: header
      name: Idempotency-Key
      required: true
      schema:
        format: uuid
        type: string
    IfMatch:
      example: '"0"'
      in: header
      name: If-Match
      required: true
      schema:
        pattern: ^"[0-9]+"$
        type: string
    Limit:
      example: 1
      in: query
      name: limit
      required: false
      schema:
        default: 25
        maximum: 100
        minimum: 1
        type: integer
    XCorrelationId:
      example: 018f0000-0000-7000-8000-000000000001
      in: header
      name: X-Correlation-Id
      required: false
      schema:
        format: uuid
        type: string
    XCsrfToken:
      example: examplexxxxxxxxxxxxxxxxxxxxxxxxx
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        maxLength: 512
        minLength: 32
        type: string
  responses:
    RequestTooLarge:
      content:
        application/problem+json:
          examples:
            VALIDATION_FAILED:
              summary: VALIDATION_FAILED
              value:
                code: VALIDATION_FAILED
                correlationId: 018f0000-0000-7000-8000-000000000001
                detail: See the operation contract.
                errors: []
                retryable: false
                schemaId: urn:gala:schema:problem:2.0.0
                schemaVersion: 2.0.0
                status: 413
                title: VALIDATION_FAILED
                type: urn:gala:problem:validation-failed
          schema:
            $ref: "#/components/schemas/Problem"
      description: VALIDATION_FAILED
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      x-gala-problem-codes:
        - VALIDATION_FAILED
    UnsupportedMediaType:
      content:
        application/problem+json:
          examples:
            VALIDATION_FAILED:
              summary: VALIDATION_FAILED
              value:
                code: VALIDATION_FAILED
                correlationId: 018f0000-0000-7000-8000-000000000001
                detail: See the operation contract.
                errors: []
                retryable: false
                schemaId: urn:gala:schema:problem:2.0.0
                schemaVersion: 2.0.0
                status: 415
                title: VALIDATION_FAILED
                type: urn:gala:problem:validation-failed
          schema:
            $ref: "#/components/schemas/Problem"
      description: VALIDATION_FAILED
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      x-gala-problem-codes:
        - VALIDATION_FAILED
    ValidationFailed:
      content:
        application/problem+json:
          examples:
            VALIDATION_FAILED:
              summary: VALIDATION_FAILED
              value:
                code: VALIDATION_FAILED
                correlationId: 018f0000-0000-7000-8000-000000000001
                detail: See the operation contract.
                errors: []
                retryable: false
                schemaId: urn:gala:schema:problem:2.0.0
                schemaVersion: 2.0.0
                status: 400
                title: VALIDATION_FAILED
                type: urn:gala:problem:validation-failed
          schema:
            $ref: "#/components/schemas/Problem"
      description: VALIDATION_FAILED
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControlNoStore"
        X-Correlation-Id:
          $ref: "#/components/headers/XCorrelationId"
      x-gala-problem-codes:
        - VALIDATION_FAILED
  schemas:
    ActivationDetectionEvidenceResponse:
      additionalProperties: false
      properties:
        activationDetectionObservation:
          $ref: "#/components/schemas/PortableDeploymentReceiptActivationDetectionObservation"
        activationDetectionPlanDigest:
          $ref: "#/components/schemas/PortableDeploymentReceiptDigest"
        operationId:
          $ref: "#/components/schemas/PortableDeploymentReceiptStableId"
        organizationId:
          $ref: "#/components/schemas/PortableDeploymentReceiptStableId"
      required:
        - organizationId
        - operationId
        - activationDetectionPlanDigest
        - activationDetectionObservation
      type: object
    AuthenticatorState:
      enum:
        - ACTIVE
        - AVAILABLE
        - COMPROMISED
        - CONSUMED
        - REVOKED
        - UNLINKED
      type: string
    AuthenticatorSummary:
      additionalProperties: false
      properties:
        authenticatorId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        createdAt:
          description: |-
            When this authenticator was registered. Optional and nullable, because a row migrated from before the column existed carries no registration instant, and a client shows nothing rather than guessing one.

            Canonical Gala instant: the UTC millisecond subset of RFC 3339, exactly `YYYY-MM-DDThh:mm:ss.sssZ`. Stated here rather than as a `pattern` because a generated `OffsetDateTime` cannot carry one (LOCAL-56).
          format: date-time
          type:
            - string
            - "null"
        kind:
          enum:
            - GITHUB
            - PASSKEY
            - RECOVERY_CODES
          type: string
        label:
          maxLength: 80
          minLength: 1
          type: string
        lastUsedAt:
          description: |-
            When this authenticator last completed an authentication. Optional and nullable, because an authenticator that has never been used, or whose use predates this field, carries no instant.

            Canonical Gala instant: the UTC millisecond subset of RFC 3339, exactly `YYYY-MM-DDThh:mm:ss.sssZ`. Stated here rather than as a `pattern` because a generated `OffsetDateTime` cannot carry one (LOCAL-56).
          format: date-time
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/AuthenticatorState"
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - authenticatorId
        - version
        - state
        - kind
        - label
      type: object
    DeleteOrganizationsByOrganizationIdPublicationsByPublicationIdRequest:
      additionalProperties: false
      properties:
        consequenceDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        consequencePreviewId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        exportWindowAcknowledged:
          not:
            enum:
              - false
          type: boolean
          x-gala-const: true
        irreversibleFenceAcknowledged:
          not:
            enum:
              - false
          type: boolean
          x-gala-const: true
      required:
        - consequencePreviewId
        - consequenceDigest
        - exportWindowAcknowledged
        - irreversibleFenceAcknowledged
      type: object
    DeleteOrganizationsByOrganizationIdPublicationsByPublicationIdResponse:
      $ref: "#/components/schemas/OperationResponse"
    DeploymentActivationEvidence:
      additionalProperties: false
      description: |
        What Galascribe knows about this generation becoming the served one.
        Absent when the server has recorded nothing; present with `state` alone
        while nothing has been detected yet. `detectedAt` and `method` are the
        `activationBasis` DEC-097 section 6 installs exactly once, so they are
        present together or not at all.
      properties:
        detectedAt:
          $ref: "#/components/schemas/PortableProblemRfc3339"
        method:
          $ref: "#/components/schemas/DeploymentActivationMethod"
        state:
          $ref: "#/components/schemas/DeploymentActivationState"
      required:
        - state
      type: object
    DeploymentActivationMethod:
      description: |
        Which of DEC-097 section 6's two `activationBasis` sources proved
        activation: the adapter's own provider observation, or Galascribe's
        credential-free public generation-marker watch.
      enum:
        - KERNEL_PROVIDER_OBSERVATION
        - GALA_PUBLIC_MARKER_DETECTION
      type: string
    DeploymentActivationState:
      description: |
        Where this generation stands against the deployment generation machine's
        activation edge. `NOT_DETECTED` is CANDIDATE or STAGED with no basis
        installed; `DETECTED` is a basis installed, which is what admits
        ACTIVE_VERIFYING and every later state; `ABANDONED` is the machine's
        `CANDIDATE | STAGED -> ABANDONED` arrow, taken only with proof of no
        activation.
      enum:
        - NOT_DETECTED
        - DETECTED
        - ABANDONED
      type: string
    DeploymentGenerationState:
      enum:
        - CANDIDATE
        - STAGED
        - ACTIVE_VERIFYING
        - ACTIVE_VERIFIED
        - PROPAGATION_DEGRADED
        - ABANDONED
        - UNKNOWN_RECONCILING
        - SUPERSEDED
      type: string
    DeploymentSummary:
      additionalProperties: false
      properties:
        activation:
          $ref: "#/components/schemas/DeploymentActivationEvidence"
        artifactDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        generationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        sourceCommit:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        state:
          $ref: "#/components/schemas/DeploymentGenerationState"
        verification:
          $ref: "#/components/schemas/DeploymentVerificationEvidence"
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - generationId
        - version
        - state
        - artifactDigest
        - sourceCommit
      type: object
    DeploymentVerificationEvidence:
      additionalProperties: false
      description: |
        What Galascribe's public verification has established for this
        generation. Absent when the server has recorded nothing. `verifiedAt` is
        present only in the `VERIFIED` state; `publicVerificationUrl` is the
        public address the verification actually fetched, so a reader can see
        for themselves what Galascribe saw.
      properties:
        publicVerificationUrl:
          description: Absolute `https` URL the public verification fetched. Clients navigate to it verbatim and never construct it (LOCAL-36 G-05).
          maxLength: 2048
          minLength: 1
          pattern: ^https://[^\s?#]+$
          type: string
        state:
          $ref: "#/components/schemas/DeploymentVerificationState"
        verifiedAt:
          $ref: "#/components/schemas/PortableProblemRfc3339"
      required:
        - state
      type: object
    DeploymentVerificationState:
      description: |
        Where this generation stands against the deployment generation machine's
        verification arc, one member per reachable outcome: `NOT_STARTED` is
        CANDIDATE or STAGED, `IN_PROGRESS` is ACTIVE_VERIFYING, `VERIFIED` is
        ACTIVE_VERIFIED, `DEGRADED` is PROPAGATION_DEGRADED, `RECONCILING` is
        UNKNOWN_RECONCILING, and `INCONCLUSIVE` is DEC-097 section 6's
        `verification-inconclusive` finalization -- the deadline passed with at
        least one required stream unread. A SUPERSEDED generation keeps the
        state it last reached.
      enum:
        - NOT_STARTED
        - IN_PROGRESS
        - VERIFIED
        - DEGRADED
        - RECONCILING
        - INCONCLUSIVE
      type: string
    GetGithubAppResponse:
      additionalProperties: false
      description: Public identity of the Galascribe GitHub App, so that a client can send an owner to GitHub's installation flow without ever asking a person for a numeric identifier (LOCAL-36 G-05).
      properties:
        installUrl:
          description: Absolute GitHub URL that starts the installation flow for this App. Clients navigate to it verbatim and never construct it.
          maxLength: 2048
          minLength: 1
          pattern: ^https://github\.com/apps/[A-Za-z0-9][A-Za-z0-9-]{0,98}/installations/new$
          type: string
        slug:
          description: GitHub App slug, as GitHub publishes it.
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,98}$
          type: string
      required:
