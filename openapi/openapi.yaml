    post:
      description: |
        The invitation is bound to a scope, a role and an authorization epoch.
        It is NOT bound to the person named in `recipient`: acceptance is
        possession-based, so whoever presents the one-time token joins with the
        invited role. `recipient` is a label that helps the inviter recognize
        the invitation, never a verified identity and never an authorization
        input. Hand the link only to the person it is meant for, and revoke and
        re-invite if it goes astray (LOCAL-34 G6).
      operationId: postOrganizationsByOrganizationIdMembershipInvitations
      parameters:
        - $ref: "#/components/parameters/XCorrelationId"
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
