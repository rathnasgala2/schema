  /v2/public/publications/{publicationId}/contents/{contentId}/comments:
    get:
      description:
        'Without `parentId`: 20 roots per page, newest first, each with its
        descendants inline oldest first (at most 50 per root; `moreReplies` is
        true beyond that). With `parentId`: the children of that comment, oldest
        first, 50 per page. Removed and deleted comments appear as tombstones
        only when they have visible descendants.'
      operationId: getPublicPublicationsByPublicationIdContentsByContentIdComments
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: contentId
          required: true
          schema:
            format: uuid
