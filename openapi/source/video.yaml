  /v2/organizations/{organizationId}/publications/{publicationId}/video-policy:
    get:
      description:
        "Whether Video is available to this publication (`enabled`), whether the
        plan includes it (`plan.allowed`: the plan must be `PRO`, sold as Basic,
        or above), how many videos are left this period (the UTC week starting
        Monday), whether the platform's optional monthly spend cap still has
        room, and how many days a finished video is kept (`retentionDays`).
        `enabled: false` means the feature is off."
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdVideoPolicy
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
