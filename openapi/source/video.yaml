            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    budget:
                      available: true
                    enabled: true
                    plan:
                      allowed: true
                      requiredTier: PRO
                    quota:
                      limit: 2
                      period: 2026-11-16
                      remaining: 1
                      renewsAt: 2026-11-23T00:00:00Z
                      used: 1
                    retentionDays: 30
              schema:
                $ref: '#/components/schemas/GetOrganizationsByOrganizationIdPublicationsByPublicationIdVideoPolicyResponse'
