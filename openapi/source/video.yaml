    post:
      description:
        "Starts a video of one live post (`contentId`): reserves one unit of the
        organization's weekly allowance (2 on Basic, 5 on Pro by default), then
        the script is written and the video is made. The answer is the new video
        in `SCRIPTING`. The plan must be `PRO` (sold as Basic) or above: `409
        PLAN_REQUIRED` below it. `429 QUOTA_EXHAUSTED` with `Retry-After` when
        no unit is left this period. `409 VIDEO_POST_NOT_LIVE` when the post is
        not live. `409 VIDEO_ALREADY_RUNNING` when the post already has a video
        being made. `503 BUDGET_EXHAUSTED` when the platform's optional monthly
        spend cap is reached; `503 CAPABILITY_UNAVAILABLE` when Video is off.
        `201`."
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdVideos
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
