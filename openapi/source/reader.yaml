paths:
  /v2/reader/authorizations:
    post:
      description:
        The App route `/reader/connect` calls this after the person chooses to
        continue. `returnUrl` must be https and start with the publication's
        live public base URL (the local runtime profile also accepts localhost).
        The `Location` header carries the publication's public read path; the
        browser navigates to `redirectUrl`, whose fragment carries the one-time
        code (60 seconds) and the state.
      operationId: postReaderAuthorizations
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  codeChallenge: DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD
                  codeChallengeMethod: S256
                  publicationId: 018f0000-0000-7000-8000-000000000001
                  returnUrl: https://blog.example.com/post/#comments
                  state: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
            schema:
              $ref: '#/components/schemas/PostReaderAuthorizationsRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    publication:
                      name: Example Blog
                      origin: https://blog.example.com
                    redirectUrl: https://blog.example.com/post/#gala-reader-code=FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF&gala-reader-state=EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
              schema:
                $ref: '#/components/schemas/PostReaderAuthorizationsResponse'
          description:
            authorize a visiting reader for one publication and return the
            redirect succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          content:
            application/problem+json:
              examples:
                REQUEST_FIELD_UNKNOWN:
                  summary: REQUEST_FIELD_UNKNOWN
                  value:
                    code: REQUEST_FIELD_UNKNOWN
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: REQUEST_FIELD_UNKNOWN
                    type: urn:gala:problem:request-field-unknown
                RETURN_URL_NOT_ALLOWED:
                  summary: RETURN_URL_NOT_ALLOWED
                  value:
                    code: RETURN_URL_NOT_ALLOWED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: RETURN_URL_NOT_ALLOWED
                    type: urn:gala:problem:return-url-not-allowed
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    code: VALIDATION_FAILED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: VALIDATION_FAILED
                    type: urn:gala:problem:validation-failed
              schema:
                $ref: '#/components/schemas/Problem'
          description:
            REQUEST_FIELD_UNKNOWN, RETURN_URL_NOT_ALLOWED, VALIDATION_FAILED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - REQUEST_FIELD_UNKNOWN
            - RETURN_URL_NOT_ALLOWED
            - VALIDATION_FAILED
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
        '404':
          content:
            application/problem+json:
              examples:
                INTERACTIONS_DISABLED:
                  summary: INTERACTIONS_DISABLED
                  value:
                    code: INTERACTIONS_DISABLED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 404
                    title: INTERACTIONS_DISABLED
                    type: urn:gala:problem:interactions-disabled
                PUBLICATION_NOT_LIVE:
                  summary: PUBLICATION_NOT_LIVE
                  value:
                    code: PUBLICATION_NOT_LIVE
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 404
                    title: PUBLICATION_NOT_LIVE
                    type: urn:gala:problem:publication-not-live
              schema:
                $ref: '#/components/schemas/Problem'
          description: INTERACTIONS_DISABLED, PUBLICATION_NOT_LIVE
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - INTERACTIONS_DISABLED
            - PUBLICATION_NOT_LIVE
      security:
        - browserSession: []
      summary:
        authorize a visiting reader for one publication and return the redirect
      tags:
        - reader
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: single-use-capability
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose:
        authorize a visiting reader for one publication and return the redirect
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - INTERACTIONS_DISABLED
        - PUBLICATION_NOT_LIVE
        - REQUEST_FIELD_UNKNOWN
        - RETURN_URL_NOT_ALLOWED
        - VALIDATION_FAILED
      x-gala-replay-identity: single-use-code
      x-gala-state-guards:
        - NONE
      x-gala-success-category: create
      x-gala-tenant-scope: NONE
  /v2/reader/tokens:
    post:
      description:
        OAuth 2.0 authorization code with PKCE (RFC 7636). The token is opaque,
        valid 30 days and scoped to one publication.
      operationId: postReaderTokens
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  code: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  codeVerifier: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
                  publicationId: 018f0000-0000-7000-8000-000000000001
            schema:
              $ref: '#/components/schemas/PostReaderTokensRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    accessToken: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
                    expiresAt: 2026-10-08T12:00:00.000Z
                    reader:
                      displayName: Ada Reader
                      initials: AR
                    tokenType: Bearer
              schema:
                $ref: '#/components/schemas/PostReaderTokensResponse'
          description:
            exchange a one-time authorization code for a publication-scoped
            reader token succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          content:
            application/problem+json:
              examples:
                INVALID_GRANT:
                  summary: INVALID_GRANT
                  value:
                    code: INVALID_GRANT
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: INVALID_GRANT
                    type: urn:gala:problem:invalid-grant
                REQUEST_FIELD_UNKNOWN:
                  summary: REQUEST_FIELD_UNKNOWN
                  value:
                    code: REQUEST_FIELD_UNKNOWN
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: REQUEST_FIELD_UNKNOWN
                    type: urn:gala:problem:request-field-unknown
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    code: VALIDATION_FAILED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: VALIDATION_FAILED
                    type: urn:gala:problem:validation-failed
              schema:
                $ref: '#/components/schemas/Problem'
          description: INVALID_GRANT, REQUEST_FIELD_UNKNOWN, VALIDATION_FAILED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - INVALID_GRANT
            - REQUEST_FIELD_UNKNOWN
            - VALIDATION_FAILED
      security: []
      summary:
        exchange a one-time authorization code for a publication-scoped reader
        token
      tags:
        - reader
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: single-use-capability
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose:
        exchange a one-time authorization code for a publication-scoped reader
        token
      x-gala-reachable-problems:
        - INVALID_GRANT
        - REQUEST_FIELD_UNKNOWN
        - VALIDATION_FAILED
      x-gala-replay-identity: single-use-code
      x-gala-state-guards:
        - NONE
      x-gala-success-category: protocol
      x-gala-tenant-scope: NONE
  /v2/reader/tokens/current:
    delete:
      operationId: deleteReaderTokensCurrent
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '204':
          description: revoke the reader token that made the request succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          content:
            application/problem+json:
              examples:
                READER_AUTHENTICATION_REQUIRED:
                  summary: READER_AUTHENTICATION_REQUIRED
                  value:
                    code: READER_AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: READER_AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:reader-authentication-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: READER_AUTHENTICATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - READER_AUTHENTICATION_REQUIRED
      security:
        - readerBearer: []
      summary: revoke the reader token that made the request
      tags:
        - reader
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: none
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: revoke the reader token that made the request
      x-gala-reachable-problems:
        - READER_AUTHENTICATION_REQUIRED
        - VALIDATION_FAILED
      x-gala-replay-identity: natural-idempotent-state
      x-gala-state-guards:
        - NONE
      x-gala-success-category: delete
      x-gala-tenant-scope: NONE
