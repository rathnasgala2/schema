  /v2/authentication/recovery-code:
    post:
      description: |
        Signs in with one recovery code. The server normalises case, hyphens and
        Crockford look-alikes (`i`/`l` read as `1`, `o` as `0`). Any unknown,
        used or revoked code answers `401 INVALID_RECOVERY_CODE` without saying
        which (non-enumerating); attempts are rate limited (`429 RATE_LIMITED`).
        On success the code is consumed, the session cookie is set, the
        session's assurance is recent authentication, and the body is the same
        session snapshot the passkey assertion returns (SCHEMA-3.3.0 shape: no
        authentication transaction is needed).
      operationId: postAuthenticationRecoveryCode
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  code: abcd-efgh-jk00
            schema:
              $ref: '#/components/schemas/PostAuthenticationRecoveryCodeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    assurance: RECENT_AUTHENTICATION
                    authenticatedAt: 2026-10-09T12:00:00.000Z
                    authorizationEpoch: 0
                    capabilities: []
                    credentialEpoch: 0
                    identityEpoch: 0
                    organizations: []
                    principalId: 018f0000-0000-7000-8000-000000000001
              schema:
                $ref: '#/components/schemas/PostAuthenticationRecoveryCodeResponse'
          description: sign in with a recovery code succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          content:
            application/problem+json:
              examples:
                REQUEST_FIELD_UNKNOWN:
                  summary: REQUEST_FIELD_UNKNOWN
                  value:
                    code: REQUEST_FIELD_UNKNOWN
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: REQUEST_FIELD_UNKNOWN
                    type: urn:gala:problem:request-field-unknown
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    code: VALIDATION_FAILED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: VALIDATION_FAILED
                    type: urn:gala:problem:validation-failed
              schema:
                $ref: '#/components/schemas/Problem'
          description: REQUEST_FIELD_UNKNOWN, VALIDATION_FAILED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - REQUEST_FIELD_UNKNOWN
            - VALIDATION_FAILED
        '401':
          content:
            application/problem+json:
              examples:
                INVALID_RECOVERY_CODE:
                  summary: INVALID_RECOVERY_CODE
                  value:
                    code: INVALID_RECOVERY_CODE
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: INVALID_RECOVERY_CODE
                    type: urn:gala:problem:invalid-recovery-code
              schema:
                $ref: '#/components/schemas/Problem'
          description: INVALID_RECOVERY_CODE
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
