  /v2/organizations/{organizationId}/publications/{publicationId}/syndication-deliveries/{deliveryId}:retry:
    post:
      description:
        Queues a `FAILED` or `SKIPPED` delivery for another attempt and answers
        `202` with it as `PENDING`. `409 SYNDICATION_DELIVERY_NOT_RETRYABLE`
        when the delivery is in any other status; `409
        SYNDICATION_CONNECTION_NOT_ACTIVE` when its connection is paused or
        needs attention; `404 SYNDICATION_CONNECTION_NOT_FOUND` when its
        connection was removed. Needs `publication.settings.manage`.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdSyndicationDeliveriesByDeliveryIdRetry
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: deliveryId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCsrfToken'
