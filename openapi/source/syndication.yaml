    post:
      description:
        Connects a platform. Galascribe checks the credential with the platform
        first and saves it sealed only when the platform accepts it; the answer
        carries the account name the platform reported, never the credential.
        Needs `publication.settings.manage`. `422
        SYNDICATION_CREDENTIAL_REJECTED` carries the platform's own message in
        `platformMessage`; `503 SYNDICATION_PLATFORM_UNAVAILABLE` when the
        platform could not be reached; `409 SYNDICATION_CONNECTION_LIMIT` at 12
        connections; `429 RATE_LIMITED` after too many checks.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdSyndicationConnections
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  credential:
                    kind: bluesky
                    handle: example.bsky.social
                    appPassword: abcd-efgh-ijkl-mnop
                  kind: bluesky
                  options: {}
            schema:
              $ref: '#/components/schemas/PostOrganizationsByOrganizationIdPublicationsByPublicationIdSyndicationConnectionsRequest'
        required: true
      responses:
        '201':
          description: connect a syndication platform succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
