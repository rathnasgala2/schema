  /v2/organizations/{organizationId}/publications/{publicationId}/syndication-connections/x:authorize:
    post:
      description:
        "SCHEMA-3.41.0. Starts connecting X. Galascribe's own X app posts on the
        author's behalf: the author never handles keys, X bills Galascribe, and
        the organization's plan sets a weekly allowance of X posts (2 on Basic,
        5 on Pro by default; none on Free). The answer carries the address on
        x.com to send the person to; X brings the browser back to `GET
        /v2/callbacks/x/oauth` within 10 minutes, which saves the connection and
        lands on the Syndication settings page. Needs
        `publication.settings.manage`. `409 PLAN_REQUIRED` when the plan allows
        no X posts, `409 SYNDICATION_CONNECTION_LIMIT` at 12 connections, `503
        SYNDICATION_X_NOT_CONFIGURED` when the platform operator has not
        configured the X app, `429 RATE_LIMITED` after too many attempts."
