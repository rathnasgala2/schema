            type: string
      responses:
        '200':
          description: list syndication connections succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    connections:
                      - accountLabel: '@example.bsky.social'
                        createdAt: 2026-11-05T12:00:00.000Z
                        id: 018f0000-0000-7000-8000-000000000001
                        kind: bluesky
                        lastDelivery:
                          at: 2026-11-05T12:00:00.000Z
                          deliveryId: 018f0000-0000-7000-8000-000000000002
                          status: SENT
                        options: {}
                        status: ACTIVE
