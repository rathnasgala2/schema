            type: string
        - description: Only generations of this article.
          example: content/my-post.md
          in: query
          name: contentPath
          required: false
          schema:
            maxLength: 512
            minLength: 1
            pattern: ^(?!/)(?!.*(?:^|/)\.)(?!gala(?:/|$))(?!gala\.lock\.json$)[^\x00-\x1f\x7f\\]+$
