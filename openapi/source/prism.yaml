        Whether Prism can generate editions for this publication and how many
        units are left this period (UTC month). `enabled: false` means
        generation is off; the editor says so and stays usable.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdGenerationPolicy
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
