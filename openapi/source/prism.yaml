    post:
      description: |
        Starts generating one edition of the article at `contentPath` as it is
        at `sourceRevision` (`sourceDigest` is that article body's digest). Uses
        one unit of the organization's monthly allowance. `503
        CAPABILITY_UNAVAILABLE` when Prism is off; `429 QUOTA_EXHAUSTED` with
        `Retry-After` when no unit is left this period. `202`; poll `GET
        .../prism-generations/{generationId}`.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdPrismGenerations
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
