            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    editionKinds:
                      - QUICK_READ
                      - STANDARD
                      - DEEP_DIVE
                    enabled: true
                    periodEndsAt: 2026-11-01T00:00:00.000Z
                    unitsPerPeriod: 20
                    unitsRemaining: 12
                    unitsUsed: 8
