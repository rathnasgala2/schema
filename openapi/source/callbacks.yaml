paths:
  /v2/callbacks/github/app:
    post:
      operationId: postCallbacksGithubApp
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: header
          name: X-GitHub-Delivery
          required: true
          schema:
            format: uuid
            type: string
        - example: push
          in: header
          name: X-GitHub-Event
          required: true
          schema:
            enum:
              - installation
              - installation_repositories
              - push
              - workflow_run
            type: string
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value: {}
            schema:
              $ref: '#/components/schemas/PostCallbacksGithubAppRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    accepted: true
              schema:
                $ref: '#/components/schemas/PostCallbacksGithubAppResponse'
          description:
            accept authenticated GitHub App installation and repository
            observations succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
        '409':
          content:
            application/problem+json:
              examples:
                INVALID_SOURCE_STATE:
                  summary: INVALID_SOURCE_STATE
                  value:
                    code: INVALID_SOURCE_STATE
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 409
                    title: INVALID_SOURCE_STATE
                    type: urn:gala:problem:invalid-source-state
              schema:
                $ref: '#/components/schemas/Problem'
          description: INVALID_SOURCE_STATE
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - INVALID_SOURCE_STATE
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    code: VALIDATION_FAILED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 422
                    title: VALIDATION_FAILED
                    type: urn:gala:problem:validation-failed
              schema:
                $ref: '#/components/schemas/Problem'
          description: VALIDATION_FAILED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - VALIDATION_FAILED
      security:
        - githubWebhookSignature: []
      summary:
        accept authenticated GitHub App installation and repository observations
      tags:
        - callbacks
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: provider-observation-ordering-and-installation-epoch
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose:
        accept authenticated GitHub App installation and repository observations
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - INVALID_SOURCE_STATE
        - VALIDATION_FAILED
      x-gala-replay-identity: github-delivery-id-and-payload-digest
      x-gala-state-guards:
        - RepositoryBinding:ACTIVE -> AUTHORITY_LOST
        - RepositoryBinding:AUTHORITY_LOST|TRANSFERRING -> ACTIVE
        - RepositoryBinding:ACTIVE|AUTHORITY_LOST -> TRANSFERRING
      x-gala-success-category: provider-callback
      x-gala-tenant-scope: NONE
