      description:
        The server writes the `newsletter` member of `gala/publication.json` as
        a repository change, the way `interaction-settings` writes
        `gala/modules/interactions.json`; mode `off` removes the member.
        Publishing the change uses the normal publish flow. `change` has the
        shape the theme-selection write returns. Turning on `galascribe` needs
        the site owner's postal address (`422 POSTAL_ADDRESS_REQUIRED` pointed
