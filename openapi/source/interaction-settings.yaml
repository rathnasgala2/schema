  /v2/organizations/{organizationId}/publications/{publicationId}/interaction-settings:
    get:
      description:
        Reads `gala/modules/interactions.json` at the linked repository's
        current main branch head. `settings` is null when the file is absent,
        which means reader interactions are off. `settings.follows.enabled`
        (SCHEMA-3.23.0) is the Follow button switch; absent means off. `setUp`
        matches `GET .../repository/setup`'s `state`; `openChange` names an
        existing not-yet-published change of this publication that touches the
        file, or is null.
