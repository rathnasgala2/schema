    put:
      description:
        The server writes the `contactForm` member of `gala/publication.json`
        and `gala/theme-pages/contact.md` as one repository change, the way
        `policy-settings` writes the Terms and Privacy pages; a null `intro`
        removes the intro file so the template default shows. Publishing the
        change uses the normal publish flow. `change` has the shape the
        theme-selection write returns. Turning `enabled` on while the plan does
        not include the contact form is `409 PLAN_REQUIRED` pointed at
        `/enabled`. Turning `enabled` on while one of the site's own content
        documents already routes to `/contact/` is `409 CONTACT_ROUTE_IN_USE`
        pointed at `/enabled`, so the form never takes over a page the author
        wrote; the author moves or renames that document first. Saving it off,
        or unchanged, is always allowed.
