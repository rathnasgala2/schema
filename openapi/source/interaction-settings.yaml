paths:
  /v2/organizations/{organizationId}/publications/{publicationId}/analytics-settings:
    get:
      description:
        Reads `gala/modules/analytics.json` at the linked repository's current
        main branch head. When the file is absent analytics is off, so `enabled`
        is false and `measurementId` is null. `provider` and `consentPolicy` are
        the only values this release admits. `setUp` matches `GET
        .../repository/setup`'s `state`; `openChange` names an existing
        not-yet-published change of this publication that touches the file, or
        is null.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdAnalyticsSettings
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    consentPolicy: opt-in
                    enabled: false
                    measurementId: null
                    openChange: null
                    provider: google-analytics-4
                    setUp: true
              schema:
                $ref: '#/components/schemas/GetOrganizationsByOrganizationIdPublicationsByPublicationIdAnalyticsSettingsResponse'
          description:
            read this publication's analytics settings at the main branch head
            succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
