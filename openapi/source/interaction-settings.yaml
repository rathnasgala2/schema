    put:
      description:
        The server writes `gala/modules/interactions.json` as a repository
        change, the way a theme selection writes `gala/appearance.json`.
        Publishing the change uses the normal publish flow. `change` has the
        shape the theme-selection write returns.
      operationId: putOrganizationsByOrganizationIdPublicationsByPublicationIdInteractionSettings
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
