paths:
  /v2/organizations/{organizationId}/publications/{publicationId}/interaction-settings:
    get:
      description:
        Reads `gala/modules/interactions.json` at the linked repository's
        current main branch head. `settings` is null when the file is absent,
        which means reader interactions are off. `setUp` matches `GET
        .../repository/setup`'s `state`; `openChange` names an existing
        not-yet-published change of this publication that touches the file, or
        is null.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdInteractionSettings
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    openChange: null
                    setUp: true
                    settings: null
              schema:
                $ref: '#/components/schemas/GetOrganizationsByOrganizationIdPublicationsByPublicationIdInteractionSettingsResponse'
          description:
            read this publication's reader interaction settings at the main
            branch head succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          content:
            application/problem+json:
              examples:
