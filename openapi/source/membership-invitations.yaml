paths:
  /v2/membership-invitations/{token}:
    get:
      description: |
        Lets the page an invitation link opens show what it offers before the
        person signs in to accept it: the organization, the role, the
        publication for a publication-scoped invitation, who sent it and when it
        expires. No session is needed; the token is the capability. Any unknown,
        expired, accepted or revoked token answers `404 RESOURCE_NOT_FOUND`
        (non-enumerating). Accepting stays `POST
        /v2/membership-invitations/{token}:accept` after sign-in.
      operationId: getMembershipInvitationsByToken
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: examplexxxxxxxxxxxxxxxxxxxxxxxxx
          in: path
          name: token
          required: true
          schema:
            maxLength: 256
            minLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    expiresAt: 2026-10-16T12:00:00.000Z
                    invitedBy:
                      displayName: Dev
                    organizationName: Northwind Press
                    publicationName: Maya's blog
                    roleName: Editor
                    scope: PUBLICATION
                    state: PENDING
              schema:
                $ref: '#/components/schemas/GetMembershipInvitationsByTokenResponse'
          description: read what an invitation link offers succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    code: VALIDATION_FAILED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: VALIDATION_FAILED
                    type: urn:gala:problem:validation-failed
              schema:
                $ref: '#/components/schemas/Problem'
          description: VALIDATION_FAILED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - VALIDATION_FAILED
        '404':
          content:
            application/problem+json:
              examples:
                RESOURCE_NOT_FOUND:
                  summary: RESOURCE_NOT_FOUND
                  value:
                    code: RESOURCE_NOT_FOUND
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 404
                    title: RESOURCE_NOT_FOUND
                    type: urn:gala:problem:resource-not-found
              schema:
                $ref: '#/components/schemas/Problem'
          description: RESOURCE_NOT_FOUND
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - RESOURCE_NOT_FOUND
      security: []
      summary: read what an invitation link offers
      tags:
        - membership-invitations
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: none
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: read what an invitation link offers
      x-gala-reachable-problems:
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
      x-gala-replay-identity: safe-query
      x-gala-state-guards:
        - NONE
      x-gala-success-category: query
      x-gala-tenant-scope: NONE
  /v2/membership-invitations/{token}:accept:
    post:
      operationId: postMembershipInvitationsByTokenAccept
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: examplexxxxxxxxxxxxxxxxxxxxxxxxx
          in: path
          name: token
          required: true
          schema:
            maxLength: 256
            minLength: 32
            type: string
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value: {}
            schema:
              $ref: '#/components/schemas/PostMembershipInvitationsByTokenAcceptRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    membershipId: 018f0000-0000-7000-8000-000000000001
                    principalId: 018f0000-0000-7000-8000-000000000001
                    roleId: 018f0000-0000-7000-8000-000000000001
                    state: ACTIVE
                    version: 0
              schema:
                $ref: '#/components/schemas/PostMembershipInvitationsByTokenAcceptResponse'
          description:
            single-use non-enumerating invitation acceptance succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
