      description: |
        Acceptance is possession-based. The token is the whole credential: the
        principal who presents it joins the organization with the invited role,
        whoever they are. The `recipient` recorded on the invitation is a label
        for the inviter's benefit and is never compared with the accepting
        principal's verified identity (LOCAL-34 G6). The token is single-use and
        non-enumerating; recipient binding is revisited when verified email
        exists.
      security:
        - {}
        - browserSession: []
      summary: single-use non-enumerating invitation acceptance
      tags:
        - membership-invitations
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: single-use-capability
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: single-use non-enumerating invitation acceptance
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - INVALID_SOURCE_STATE
        - REQUEST_FIELD_UNKNOWN
        - VALIDATION_FAILED
      x-gala-replay-identity: invitation-capability
      x-gala-state-guards:
        - MembershipInvitation:PENDING -> ACCEPTED
        - Organization:ACTIVE
      x-gala-success-category: protocol
      x-gala-tenant-scope: TOKEN_BOUND_ORGANIZATION
