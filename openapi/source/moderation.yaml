  /v2/organizations/{organizationId}/publications/{publicationId}/moderation/comments/{commentId}:decide:
    post:
      description: |
        SCHEMA-3.3.0 appeals: on a comment with a pending appeal, `RESTORE`
        restores it and settles the appeal `RESTORED`; `DENY_APPEAL` keeps it
        removed and settles the appeal `DENIED` (`note` optional, at most 1000
        characters). `DENY_APPEAL` without a pending appeal is `409
        INVALID_DECISION`. Only a person decides an appeal.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdModerationCommentsByCommentIdDecide
