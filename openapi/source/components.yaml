            required:
              - outcome
          then:
            not:
              anyOf:
                - required:
                    - failureCode
                - required:
                    - startedAt
                - required:
                    - completedAt
            properties:
              destinationChanged:
                const: no
              retryable:
                const: false
            required:
              - resultDigest
        - if:
            properties:
              outcome:
                const: succeeded
            required:
              - outcome
          then:
            not:
              required:
                - failureCode
            properties:
              destinationChanged:
                enum:
                  - no
                  - yes
