components:
  headers:
    AcceptRanges:
      description:
        Advertises byte-range support (SCHEMA-2.17.0), so a sound or video
        player can seek without downloading the whole file first.
      required: true
      schema:
        const: bytes
    CacheControlNoStore:
      required: true
      schema:
        const: no-store
    ContentDispositionAttachment:
      description: 'The archive is a download: `attachment` with its file name.'
      required: true
      schema:
        pattern: ^attachment; filename="[A-Za-z0-9._-]{1,120}"$
        type: string
    ContentDispositionInline:
      required: true
      schema:
        const: inline
    ContentRange:
      description:
        RFC 9110 `Content-Range`. `bytes <start>-<end>/<total>` on `206`; on
        `416` the unsatisfied-range form (`bytes`, an asterisk, then
        `/<total>`), naming the asset's real total length so the caller can
        retry with a satisfiable range.
      required: true
      schema:
        pattern: ^bytes (?:[0-9]+-[0-9]+|\*)/[0-9]+$
        type: string
    ETag:
      required: true
      schema:
        pattern: ^"[0-9]+"$
        type: string
    Location:
      required: true
      schema:
        minLength: 1
        pattern: ^/(?!/)(?!.*//)(?!.*[?#]).*$
        type: string
    RetryAfter:
      required: true
      schema:
        maximum: 86400
        minimum: 1
        type: integer
    XContentTypeOptionsNosniff:
      required: true
      schema:
        const: nosniff
    XCorrelationId:
      required: true
      schema:
        format: uuid
        type: string
    XGalaCurrentHead:
      required: true
      schema:
        pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
        type: string
  parameters:
    ContentLimit:
      description: |
        Same bound as the shared `Limit` parameter, with a higher default
        appropriate to a content list row: the server may return fewer items
        than `limit` even when more are available.
      example: 1
      in: query
      name: limit
      required: false
      schema:
        default: 50
        maximum: 100
        minimum: 1
        type: integer
    Cursor:
      example: example
      in: query
      name: cursor
      required: false
      schema:
        maxLength: 2048
        minLength: 1
        type: string
    IdempotencyKey:
      example: 018f0000-0000-7000-8000-000000000001
      in: header
      name: Idempotency-Key
      required: true
      schema:
        format: uuid
        type: string
    IfMatch:
      example: '"0"'
      in: header
      name: If-Match
      required: true
      schema:
        pattern: ^"[0-9]+"$
        type: string
    Range:
      description:
        RFC 9110 single-range `Range` request header (SCHEMA-2.17.0), honoured
        for sound and video so a player can seek. Absent means the whole asset.
        A multi-range request is not supported and is treated as absent.
      example: bytes=0-1023
      in: header
      name: Range
      required: false
      schema:
        pattern: ^bytes=[0-9]+-[0-9]*$
        type: string
    Limit:
      example: 1
      in: query
      name: limit
      required: false
      schema:
        default: 25
        maximum: 100
        minimum: 1
        type: integer
    XCorrelationId:
      example: 018f0000-0000-7000-8000-000000000001
      in: header
      name: X-Correlation-Id
      required: false
      schema:
        format: uuid
        type: string
    XCsrfToken:
      example: examplexxxxxxxxxxxxxxxxxxxxxxxxx
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema:
        maxLength: 512
        minLength: 32
        type: string
  responses:
    RequestTooLarge:
      content:
        application/problem+json:
          examples:
            VALIDATION_FAILED:
              summary: VALIDATION_FAILED
              value:
                code: VALIDATION_FAILED
                correlationId: 018f0000-0000-7000-8000-000000000001
                detail: See the operation contract.
                errors: []
                retryable: false
                schemaId: urn:gala:schema:problem:2.0.0
                schemaVersion: 2.0.0
                status: 413
                title: VALIDATION_FAILED
                type: urn:gala:problem:validation-failed
          schema:
