    PublicationTransfer:
      additionalProperties: false
      description:
        "A move of one publication (its Galascribe record, history, comments,
        reactions and settings) from the source organization to the destination
        organization (SCHEMA-3.3.0). The GitHub repository stays where it is; a
        custom domain binding is detached and the destination re-adds it. While
        `PENDING_ACCEPTANCE` or `ACCEPTED` the publication is fenced: every
        publication-scoped command except the transfer routes answers `409
        TRANSFER_PENDING`. `checks` are re-evaluated for the reading side on
        every read of a pending transfer, so re-reading is the re-check.
        `consequenceDigest` is what the destination's `:accept` quotes back.
        `completedAt` is set once `COMPLETED`; `reasonCode` on a cancelled or
        declined transfer."
