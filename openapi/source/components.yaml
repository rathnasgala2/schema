    OperationHeld:
      additionalProperties: false
      description: |
        SCHEMA-3.17.0. Present on an operation that is still `accepted` and is
        not starting because another operation of the same publication holds
        its destination: the destination fence a deploy opens at intent
        exchange stays held until that operation ends, and a publish does not
        dispatch while it is held. It names the holder so a client can say what
        the operation is waiting for instead of showing a bare `accepted`.
        Absent when nothing holds the destination and on every operation that
        has started or ended. A held operation ends with
        `DESTINATION_BUSY_TIMEOUT` if the holder does not release the fence
        within the server's bound (see `reason`).
      properties:
        byOperationId:
          description: The operation that holds the destination.
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        holderPhase:
          description: |
            The holder's lifecycle state now, spelled as the transition
            catalog spells a `PublicationOperation` state in capitals
            (`ACCEPTED`, `EXECUTING`, `RECONCILING`, `COMPLETED`,
            `FAILED_NO_EFFECT`, `CANCELLED_NO_EFFECT`), which is not the
            lower-case `phase` an operation read carries. A client shows a
            value it does not know as it is.
          maxLength: 80
          minLength: 1
          type: string
        holderReason:
          $ref: '#/components/schemas/OperationReason'
          description: |
            Why the holder is in that state, when it is known: its terminal
            `reason`, or the verdict its run settled with while the fence is
            still being released. Absent while the holder is simply running.
        since:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
          description:
            When this operation was accepted and started waiting for the
            destination.
      required:
        - byOperationId
        - since
        - holderPhase
      type: object
    OperationPhase:
      enum:
        - accepted
        - executing
        - reconciling
        - completed
        - failed_no_effect
        - cancelled_no_effect
      type: string
    OperationReason:
      description: |
        SCHEMA-3.17.0. A stable upper-case code saying why an operation ended
        the way it did, or why it is in its phase: set on a `failed_no_effect`
        or `cancelled_no_effect` operation and on one that is `reconciling`
        because its deploy failed; absent on a running or successful operation
        and on operations that ended before 3.17.0. A free string within the
        pattern, not a closed enumeration, so a client shows a generic sentence
        for a code it does not know. Known values: `RUN_NOT_STARTED`,
        `BUILD_FAILED`, `RUN_CANCELLED`, `RUN_TIMED_OUT`,
        `WORKFLOW_UNAVAILABLE`, `DEPLOY_FAILED`, `PAGES_NOT_AVAILABLE`,
        `REPORT_FAILED`, `LIVE_CHECK_FAILED`, `CHANGE_CLOSED_ON_GITHUB` (the
        `reasonCode` values of a history failure) and, new in 3.17.0,
        `DESTINATION_BUSY_TIMEOUT` (the operation was held behind another that
        did not release the destination within the server's bound, so it ended
        without creating a run), `DESTINATION_FENCE_EXPIRED` (the destination
        fence this operation held was closed by the server's reaper after its
        run settled with no receipt), `CANONICAL_BASE_MISMATCH` (the site's
        canonical base was not the address it is served from when the
        operation was dispatched) and `DOMAIN_NOT_READY` (a custom domain was
        part-way through its switch and no origin could be verified).
      maxLength: 64
      minLength: 3
      pattern: ^[A-Z][A-Z0-9_]{2,63}$
      type: string
    OperationResponse:
      additionalProperties: false
      properties:
        commandId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        operationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
