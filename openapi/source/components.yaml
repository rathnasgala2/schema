              timezone:
                type: string
      description:
        "SCHEMA-3.19.0: the publication's staggered-release setting as stored,
        the `staggeredRelease` member of `PublishingPolicy`. When `enabled` is
        true Galascribe publishes each draft whose `publishAfter` front-matter
        date has arrived, reading the date in `timezone` and releasing it on the
        first sweep at or after 00:00 of that date; when false nothing is
        released by the system and `publishAfter` values are kept untouched. A
        publication that never set it reads `{enabled: false, timezone: null}`;
        `timezone` is never null while `enabled` is true."
      properties:
        enabled:
          type: boolean
        timezone:
          oneOf:
            - $ref: '#/components/schemas/StaggeredReleaseTimezone'
            - type: 'null'
