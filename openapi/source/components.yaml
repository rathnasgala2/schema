    PublicationImportState:
      description:
        '`INSPECTING` -> `READY` (inspection done, findings listed) ->
        `CONNECTING` (`:connect`) or `CONVERTING` (`:convert`) -> `CONNECTED`.
        `FAILED` and `CANCELLED` are terminal and wrote nothing beyond what
        `failure` names.'
      enum:
        - INSPECTING
        - READY
        - CONNECTING
        - CONVERTING
        - CONNECTED
        - FAILED
        - CANCELLED
      type: string
    PublicationImportLayout:
      description:
        '`GALA_V2`: `gala/repository.json` is a valid v2 declared graph.
        `GALA_V1`: a v1 site (`site.config.yml`, and posts as `index.<lang>.md`
        files in folders under `content/posts`). `UNKNOWN`: neither.'
      enum:
        - GALA_V2
        - GALA_V1
        - UNKNOWN
      type: string
    PublicationImportFinding:
      additionalProperties: false
      description:
        One thing inspection found, listed before anything is written. A
        `BLOCKER` stops `:connect`/`:convert` (`409 IMPORT_BLOCKED`). Known
        codes include `REPOSITORY_NEEDS_UPDATE`, `WORKFLOW_MISSING`,
        `V1_SYNTAX_UNSUPPORTED`, `V1_MEDIA_LARGE`, `V1_SCHEDULED_BECOMES_DRAFT`,
        `V1_POST_EXPIRED_SKIPPED`, `V1_THEME_REPLACED`, `V1_PRISM_DROPPED`,
        `STARTER_FILES_ADDED` and `CONVERSION_TOO_LARGE`; a client shows
        `detail` for codes it does not know.
      properties:
        code:
          maxLength: 80
          minLength: 1
          pattern: ^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$
          type: string
        detail:
          maxLength: 500
          minLength: 1
          type: string
        path:
          description:
            Repository-relative path the finding is about, when it is about one
            file.
          maxLength: 512
          minLength: 1
          type: string
        severity:
          enum:
            - INFO
            - WARNING
            - BLOCKER
          type: string
      required:
        - code
        - severity
        - detail
      type: object
    PublicationImportRepository:
      additionalProperties: false
      properties:
        defaultBranch:
          maxLength: 255
          minLength: 1
          type: string
        fullName:
          maxLength: 140
          minLength: 3
          pattern: ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$
          type: string
        private:
