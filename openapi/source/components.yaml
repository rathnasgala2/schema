          type: string
        state:
          $ref: '#/components/schemas/MembershipInvitationState'
        token:
          description:
            plaintext single-use invitation token, present exactly once on the
            response that creates the invitation; absent on an idempotent replay
            of this request and absent from every read of an invitation. The
            invitee redeems it with `POST
            /v2/membership-invitations/{token}:accept`. It is a credential and
            must never be logged, persisted outside the invitation record, or
            echoed by any other response.
          maxLength: 256
          minLength: 32
          type: string
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - invitationId
        - version
        - state
        - roleId
        - expiresAt
      type: object
