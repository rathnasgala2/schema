    MembershipInvitationState:
      enum:
        - PENDING
        - ACCEPTED
        - REVOKED
        - EXPIRED
      type: string
    MembershipInvitationSummary:
      additionalProperties: false
      description:
        "One pending or settled invitation, in exactly the shape the
        single-invitation read returns, so a client renders a row and its detail
        view from the same fields. SCHEMA-3.4.0 adds what a People page needs to
        show a pending row: `recipient` (the inviter's own unverified label,
        absent for older invitations), the invited role (`roleKey`, `roleName`),
        its publication when the invitation is publication-scoped
        (`publicationId`, `publicationName`), and who sent it (`invitedBy`)."
      properties:
        expiresAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        invitationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        roleId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        state:
          $ref: '#/components/schemas/MembershipInvitationState'
        invitedBy:
          $ref: '#/components/schemas/SiteActor'
        publicationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        publicationName:
          maxLength: 80
          minLength: 1
          type: string
        recipient:
          description:
            'The label the inviter typed when creating the invitation (an email
            address), shown so the inviter recognises the row. It is not a
            verified identity: acceptance is possession-based and this value is
            never matched against whoever accepts (LOCAL-34 G6). Absent for
            invitations created before the label was stored.'
          maxLength: 320
          minLength: 1
          type: string
        roleKey:
          maxLength: 80
          minLength: 1
