          maxItems: 1000
          type: array
        blockers:
          items:
            maxLength: 80
            minLength: 1
            type: string
          maxItems: 100
          type: array
        commandId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        currentAttemptManagedReceipt:
          $ref: ../schemas/deployment-receipt.schema.json
        held:
          $ref: '#/components/schemas/OperationHeld'
        kind:
