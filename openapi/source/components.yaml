    PublicationAppearanceOpenChange:
      additionalProperties: false
      properties:
        changeId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
      required:
        - changeId
      type: object
    PublicationAppearanceSelected:
      additionalProperties: false
      description: |
        From `gala/appearance.json`. `themeId` is `null` ("Custom theme") when
        `themePackage` is not in the catalog. `themePackage` is the file's
        `theme` value, a package with its version range. `attribution`
        (SCHEMA-3.3.0, optional) is the file's footer attribution switch;
        absent means the file has none, which renders as shown. `tokens`
        (SCHEMA-3.10.0, optional) is the file's publication palette as read;
        absent or `{}` means the theme's own colours. `brandMark`
        (SCHEMA-3.12.0, optional): the publication's brand mark as currently
        committed, absent when none.
      properties:
        attribution:
          $ref: ../schemas/appearance.schema.json#/$defs/attribution
        brandMark:
          description: >-
            SCHEMA-3.12.0: the publication's brand mark as currently committed,
            absent when none
          oneOf:
            - allOf:
                - $ref: ../schemas/appearance.schema.json#/$defs/repoRelativePath
                - pattern: ^assets/brand/
            - type: 'null'
        colorModeDefault:
          $ref: '#/components/schemas/AppearanceColorMode'
        themeId:
          oneOf:
            - $ref: '#/components/schemas/AppearanceThemeId'
            - type: 'null'
        themePackage:
          $ref: ../schemas/appearance.schema.json#/$defs/packageRange
        tokens:
          $ref: ../schemas/appearance.schema.json#/$defs/semanticTokens
      required:
        - themeId
        - themePackage
        - colorModeDefault
      type: object
    ContentChangeAssetEntry:
      additionalProperties: false
      allOf:
        - if:
            properties:
              action:
                const: PUT
            required:
              - action
          then:
            required:
              - bytesBase64
              - contentType
              - contentDigest
          else:
            not:
              anyOf:
                - required:
                    - bytesBase64
                - required:
                    - contentType
                - required:
                    - contentDigest
      description: |
        One image write or delete inside a batch `content-changes:plan`
        request -- an article's cover image, or an image referenced from
        its body. `bytesBase64` is base64 over the raw image bytes; the
        5 MiB bound is measured on the decoded byte length, not this
        field's text length, and `bytesBase64`'s own `maxLength` is the
        base64 ceiling for that same decoded bound. `contentType` is closed
        to PNG, JPEG, WebP, GIF and AVIF (SCHEMA-3.3.0 drops the sound and
        video types the server never accepted); `image/svg+xml` is
        deliberately absent everywhere in this contract (an SVG can carry
        script). `DELETE` names only the path it removes and carries none
        of the write-only members.
      properties:
        action:
          enum:
            - PUT
            - DELETE
          type: string
        bytesBase64:
          maxLength: 6990512
          pattern: ^[A-Za-z0-9+/]+={0,2}$
          type: string
        contentDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        contentType:
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - image/gif
            - image/avif
          type: string
        path:
          maxLength: 512
          minLength: 1
          pattern: ^(?!/)(?!.*(?:^|/)\.)(?!gala(?:/|$))(?!gala\.lock\.json$)[^\x00-\x1f\x7f\\]+$
          type: string
      required:
        - path
        - action
      type: object
    ContentChangeDocumentEntry:
      additionalProperties: false
      allOf:
        - if:
            properties:
              action:
                const: PUT
            required:
              - action
          then:
            required:
              - text
              - contentDigest
          else:
            not:
              anyOf:
                - required:
                    - text
                - required:
                    - contentDigest
      description: |
        One document write or delete inside a batch `content-changes:plan`
        request. `DELETE` names only the path it removes and carries
        neither `text` nor `contentDigest`.
      properties:
        action:
          enum:
            - PUT
            - DELETE
          type: string
        contentDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        path:
          maxLength: 512
          minLength: 1
          pattern: ^(?!/)(?!.*(?:^|/)\.)(?!gala\.lock\.json$)(?:gala/theme-pages/[^\x00-\x1f\x7f\\/]+|(?!gala(?:/|$))[^\x00-\x1f\x7f\\]+)$
          type: string
        text:
          maxLength: 1048576
          type: string
      required:
        - path
        - action
      type: object
    ContentFrontmatter:
      $ref: ../schemas/content-frontmatter.schema.json
