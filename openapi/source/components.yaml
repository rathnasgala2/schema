            - type: 'null'
      required:
        - address
      type: object
    NotificationCadence:
      description:
        'SCHEMA-3.23.0: how often a category is emailed. `instant` sends one
        email per notification, `daily` one digest per day, `off` none. The
        inbox row exists whatever the cadence.'
      enum:
        - instant
        - daily
        - 'off'
      type: string
    NotificationCategory:
      description:
        'SCHEMA-3.23.0: the closed catalog of notification categories, shared by
        inbox rows and email preferences. `comments` (site members who can
        moderate: new comment, comment held for review, report filed),
        `messages` (site owners and admins: new contact-form message),
        `publishing` (site members: publish failed, a scheduled or staggered
        release went live, review requested or approved), `audience` (site
        owners and admins: new followers and subscribers, summarised), `replies`
        (any person: someone replied to your comment) and `following` (any
        person: a new post from an author you follow). The email default per
        category is `comments` daily, `messages` instant, `publishing` instant,
        `audience` daily, `replies` instant, `following` daily.'
      enum:
        - comments
        - messages
        - publishing
        - audience
        - replies
        - following
      type: string
    NotificationItem:
      additionalProperties: false
      description:
        'SCHEMA-3.23.0: one inbox row. It carries a minimal display payload
        only: no email address and no comment body beyond a 140-character
        `excerpt`. `kind` is the specific event (for example `comment-created`,
        `comment-held`, `report-filed`, `contact-message-received`,
        `publish-failed`, `release-live`, `review-requested`, `review-approved`,
        `audience-summary`, `following-post`) as a lowercase slug; a client
        treats a `kind` it does not know as its `category`. `publication` is
        null for a row that belongs to no site (a reply to a comment on a
        deleted site, for instance).'
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
        createdAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        excerpt:
          maxLength: 140
          minLength: 1
          type:
            - string
            - 'null'
        id:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        kind:
          maxLength: 64
          minLength: 2
          pattern: ^[a-z][a-z0-9-]{1,63}$
          type: string
        publication:
          oneOf:
            - $ref: '#/components/schemas/NotificationPublication'
            - type: 'null'
        readAt:
          oneOf:
            - $ref: ../schemas/problem.schema.json#/$defs/rfc3339
            - type: 'null'
        target:
          $ref: '#/components/schemas/NotificationTarget'
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - id
        - category
        - kind
        - publication
        - title
        - excerpt
        - target
        - createdAt
        - readAt
      type: object
    NotificationPreference:
      additionalProperties: false
      properties:
        cadence:
          $ref: '#/components/schemas/NotificationCadence'
        category:
          $ref: '#/components/schemas/NotificationCategory'
      required:
        - category
        - cadence
      type: object
    NotificationPreferenceList:
      allOf:
        - contains:
            properties:
              category:
                const: comments
            required:
              - category
            type: object
          maxContains: 1
          minContains: 1
        - contains:
            properties:
              category:
                const: messages
            required:
              - category
            type: object
          maxContains: 1
          minContains: 1
        - contains:
            properties:
              category:
                const: publishing
            required:
              - category
            type: object
          maxContains: 1
          minContains: 1
        - contains:
            properties:
              category:
                const: audience
            required:
              - category
            type: object
          maxContains: 1
          minContains: 1
        - contains:
            properties:
              category:
                const: replies
            required:
              - category
            type: object
          maxContains: 1
          minContains: 1
        - contains:
            properties:
              category:
                const: following
            required:
              - category
            type: object
          maxContains: 1
          minContains: 1
      description:
        'SCHEMA-3.23.0: exactly one entry per category, in any order. A write
        that omits or repeats a category is `422 VALIDATION_FAILED`.'
      items:
        $ref: '#/components/schemas/NotificationPreference'
      maxItems: 6
      minItems: 6
      type: array
    NotificationPreferences:
      additionalProperties: false
      description:
        "SCHEMA-3.23.0: a person's email choices per notification category.
        `emailAvailable` is read-only: true only while the person has a
        consented contact email on file (`contactEmail.state` `ON_FILE`);
        without one the inbox still works and no category is emailed. `timeZone`
        is where the daily digest goes out at 08:00, or null for UTC. A write
        replaces every category and the time zone."
      properties:
        categories:
          $ref: '#/components/schemas/NotificationPreferenceList'
        emailAvailable:
          type: boolean
        timeZone:
          oneOf:
            - $ref: '#/components/schemas/NotificationTimeZone'
            - type: 'null'
      required:
        - emailAvailable
        - timeZone
        - categories
      type: object
    NotificationPublication:
      additionalProperties: false
      properties:
        id:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        title:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - id
        - title
      type: object
    NotificationTarget:
      additionalProperties: false
      description:
        'SCHEMA-3.23.0: where a notification leads. `kind` names the kind of
        place in words a client may switch on and ignore when unknown (for
        example `comments`, `messages`, `publishing`, `audience`, `post`,
        `following`); `url` is an App route path (never an absolute address)
        that the row links to.'
      properties:
        kind:
          maxLength: 64
          minLength: 2
          pattern: ^[a-z][a-z0-9-]{1,63}$
          type: string
        url:
          maxLength: 512
          minLength: 1
          pattern: ^/(?!/)[^\s]*$
          type: string
      required:
        - kind
        - url
      type: object
    NotificationTimeZone:
      description:
        'SCHEMA-3.23.0: an IANA time zone name (`America/Los_Angeles`,
        `Europe/London`, `UTC`) in which a person receives the daily digest at
        08:00. The API accepts only a name its time-zone database knows; an
        unknown name is `422 VALIDATION_FAILED` pointed at `/timeZone`. The
        pattern only fixes the shape.'
      maxLength: 64
      pattern: ^(?:[A-Za-z_]+(?:/[A-Za-z0-9_+-]+)+|UTC)$
      type: string
    PostPublicNotificationUnsubscribesByTokenResponse:
      additionalProperties: false
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
      required:
        - category
      type: object
    PostSelfNotificationsMarkReadRequest:
      additionalProperties: false
      maxProperties: 1
      minProperties: 1
      properties:
        all:
          const: true
        ids:
          items:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
          maxItems: 100
          minItems: 1
          type: array
          uniqueItems: true
      type: object
    PostSelfNotificationsMarkReadResponse:
      additionalProperties: false
      properties:
        unreadCount:
          format: int64
          minimum: 0
          type: integer
      required:
        - unreadCount
      type: object
    PostalAddress:
      description:
        "SCHEMA-3.23.0: a person's postal address as plain text, one to five
        lines separated by a line feed, at most 300 characters in all. It is the
        footer address of the newsletter emails of every site the person owns."
      maxLength: 300
      minLength: 1
      pattern: ^[^\r\n]+(?:\n[^\r\n]+){0,4}$
      type: string
    PutPublicPublicationsByPublicationIdAuthorsByAuthorIdFollowResponse:
      $ref: '#/components/schemas/FollowState'
    PutSelfNotificationPreferencesRequest:
      additionalProperties: false
      properties:
        categories:
          $ref: '#/components/schemas/NotificationPreferenceList'
        timeZone:
          oneOf:
            - $ref: '#/components/schemas/NotificationTimeZone'
            - type: 'null'
      required:
        - categories
        - timeZone
      type: object
    PutSelfNotificationPreferencesResponse:
      $ref: '#/components/schemas/NotificationPreferences'
    PutSelfPostalAddressRequest:
      additionalProperties: false
      properties:
        address:
          $ref: '#/components/schemas/PostalAddress'
      required:
        - address
      type: object
    PutSelfPostalAddressResponse:
      additionalProperties: false
      properties:
        address:
          $ref: '#/components/schemas/PostalAddress'
      required:
        - address
      type: object
  securitySchemes:
    adminApiKey:
      bearerFormat: Admin API key (gk_<prefix>_<secret>)
      description:
        Scoped credential an operator creates; acts as that operator within its
        scopes. Refused for every operation without `x-gala-api-key-scope`.
      scheme: bearer
      type: http
    readerBearer:
      bearerFormat: Opaque publication-scoped reader token
      scheme: bearer
      type: http
    browserSession:
      in: cookie
      name: __Host-gala-session
      type: apiKey
    galaReceipt:
      in: header
      name: Authorization
      type: apiKey
    githubOidc:
      bearerFormat: GitHub OIDC JWT
      scheme: bearer
      type: http
    githubWebhookSignature:
      in: header
      name: X-Hub-Signature-256
      type: apiKey
    internalHealth:
      type: mutualTLS
    stripeWebhookSignature:
      in: header
      name: Stripe-Signature
      type: apiKey
