      maxLength: 2048
      minLength: 1
      pattern: ^(?:https://[^\s]+|http://(?:localhost|127\.0\.0\.1)(?::[0-9]{1,5})?(?:/[^\s]*)?)$
      type: string
    DeletePublicPublicationsByPublicationIdAuthorsByAuthorIdFollowResponse:
