    SiteThemeChange:
      additionalProperties: false
      properties:
        from:
          maxLength: 200
          minLength: 1
          type:
            - string
            - 'null'
        to:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - from
        - to
      type: object
    SitePendingChange:
      additionalProperties: false
      allOf:
        - if:
            properties:
              kind:
                enum:
                  - LOOK
                  - SETTINGS
            required:
              - kind
          then:
            properties:
              action:
                const: CHANGE
          else:
            properties:
              action:
                enum:
                  - CREATE
                  - EDIT
                  - DELETE
      description:
        'One unpublished change in words. Exactly one entry exists per path (and
        one for the look): when several unpublished changes touch the same path
        only the newest is listed and older ones are superseded and omitted.
        `SETTINGS` (SCHEMA-3.3.0) is a change to a typed site configuration file
        such as `gala/publication.json` or `gala/modules/interactions.json`; its
        `action` is `CHANGE`, as for `LOOK`, and its `title` is a short label
        such as "Site address" or "Readers". `EDITION` (SCHEMA-3.3.0) is a Prism
        edition document beside its article.'
      properties:
        action:
          enum:
            - CREATE
            - EDIT
            - DELETE
            - CHANGE
          description:
            '`CHANGE` is used for `LOOK` and `SETTINGS` and only for them;
            `POST`, `PAGE` and `EDITION` use `CREATE`, `EDIT` or `DELETE`.'
          type: string
        kind:
          enum:
            - POST
            - PAGE
            - LOOK
            - SETTINGS
            - EDITION
          type: string
        path:
          description:
            Repository path of the post, page or edition, or (for `SETTINGS`) of
            the configuration file the change writes; absent for `LOOK`.
          maxLength: 512
          minLength: 1
          type: string
        theme:
          $ref: '#/components/schemas/SiteThemeChange'
        title:
          type: string
          minLength: 1
          maxLength: 200
        author:
          $ref: '#/components/schemas/SiteActor'
        changeId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        review:
          description:
            '`NOT_REQUIRED` when the publication does not require review;
            otherwise `WAITING`, `APPROVED` or `CHANGES_REQUESTED`.
            `NEEDS_RE_REVIEW` (SCHEMA-3.6.0): the reviewed revision was replaced
            by a newer one and the author requests review again.'
          enum:
            - NOT_REQUIRED
            - WAITING
            - APPROVED
            - CHANGES_REQUESTED
            - NEEDS_RE_REVIEW
          type: string
        reviewComment:
          description:
            The newest decision's comment (SCHEMA-3.6.0), shown to the author
            next to the change. Absent when none.
          maxLength: 4000
          minLength: 1
          type: string
        reviewDecidedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        reviewDecidedBy:
          $ref: '#/components/schemas/SiteActor'
        pullRequestUrl:
          description:
            The mirror of this change on GitHub (SCHEMA-3.6.0), the canonical
            GitHub pull-request URL, as `GithubPullRequestSummary.url`. Absent
            until a pull request is recorded.
          format: uri
          pattern: ^https://github[.]com/[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}/pull/[1-9][0-9]*$
          type: string
        reviewId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
          description:
            The review a reviewer decides through `POST
            .../reviews/{reviewId}:decide`. Present when a review exists.
        updatedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
      required:
        - changeId
        - kind
        - action
        - title
        - review
        - updatedAt
        - author
      type: object
    SiteAttentionItem:
      additionalProperties: false
      description:
        "Something that needs a person to act. The list is empty when nothing
        does. SCHEMA-3.3.0: `SCHEDULED_PUBLISH_FAILED` means a scheduled publish
        could not start at its time; `relatedPublishId` names the schedule and
        `reasonCode` the first precondition that failed (a client maps the
        values it knows to a sentence and shows a generic one otherwise);
        nothing was merged. `DOMAIN_PUBLISH_REQUIRED` means a custom domain is
        live and the next publish moves the site's address to it.
        `DOMAIN_DEGRADED` means a live custom domain stopped working;
        `reasonCode` names why and the domain read carries the next step.
        SCHEMA-3.17.0 adds the domain `reasonCode` values `MOVE_FAILED` (the
        system move of the site's canonical base to or from the domain failed
        and will be retried), `MOVE_STUCK` (it failed three times and waits for
        the author to retry from the domain page), `MOVE_ABANDONED` (the move
        back to the github.io address on removal gave up) and `AUTHORITY_LAPSED`
        (the stored publish authority the move runs under could no longer be
        restated); the domain read's `baseMove` carries the same state. A client
        shows a generic sentence for a `reasonCode` it does not know.
        SCHEMA-3.9.0: on `REPOSITORY_NEEDS_UPDATE`, `reason` names the cause and
        `paths` the managed repository files involved, so a client can say what
        to do and list the files (both are absent from older servers and for
        other codes; show a generic sentence for a `reason` you do not know).
        `AUTHOR_EDITED`: a managed file differs from the version Galascribe
        manages and only the author may resolve it. `BRANCH_PROTECTION`: GitHub
        refused Galascribe's own repair commit. `REPOSITORY_ARCHIVED`: the
        repository is archived. `INSTALLATION_SUSPENDED`: the GitHub App
        installation is suspended. `WORKFLOWS_PERMISSION_MISSING`: the
        installation has not accepted the workflows permission.
        `AUTHORIZATION_LOST`: Galascribe lost its GitHub authorization.
        `FORBIDDEN`: GitHub refused for another permission reason. The same
        `reason` and `paths` ride on the `REPOSITORY_NEEDS_UPDATE` entry of a
        publish refusal's `errors`."
      properties:
        code:
          enum:
            - REPOSITORY_NEEDS_UPDATE
            - CONTENT_CONFLICT
            - PUBLISH_FAILED
            - AUTHORIZATION_LOST
            - REPOSITORY_NOT_SET_UP
            - DESTINATION_NOT_CHOSEN
            - CHANGE_CLOSED_ON_GITHUB
            - PUBLISH_WORKFLOW_UNAVAILABLE
            - PAGES_NOT_AVAILABLE
            - REPOSITORY_UNAVAILABLE
            - REPOSITORY_MOVED
            - SCHEDULED_PUBLISH_FAILED
            - DOMAIN_PUBLISH_REQUIRED
            - DOMAIN_DEGRADED
          type: string
        paths:
          description:
            SCHEMA-3.9.0. The managed repository files a
            `REPOSITORY_NEEDS_UPDATE` is about; may be empty when the cause is
            not about a file.
          items:
            maxLength: 512
            minLength: 1
            type: string
          maxItems: 50
          minItems: 0
          type: array
        reason:
          description:
            SCHEMA-3.9.0. Why a `REPOSITORY_NEEDS_UPDATE` needs the author.
          enum:
            - AUTHOR_EDITED
            - BRANCH_PROTECTION
            - REPOSITORY_ARCHIVED
            - INSTALLATION_SUSPENDED
            - WORKFLOWS_PERMISSION_MISSING
            - AUTHORIZATION_LOST
            - FORBIDDEN
          type: string
        reasonCode:
          description:
            'A free string within the pattern. Known `DOMAIN_DEGRADED` values
            (SCHEMA-3.17.0): MOVE_FAILED, MOVE_STUCK, MOVE_ABANDONED,
            AUTHORITY_LAPSED; a client shows a generic sentence for any other.'
          maxLength: 80
          minLength: 1
          pattern: ^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$
          type: string
        relatedChangeId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        relatedPublishId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
      required:
        - code
      type: object
    SiteLastPublished:
