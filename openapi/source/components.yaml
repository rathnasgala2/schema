      additionalProperties: false
      allOf:
        - if:
            not:
              required:
                - repositoryChangeId
          then:
            required:
              - sourceRevision
              - policyDigest
              - validationEvidenceDigest
      description: |
        A review is requested over an exact source revision and the exact
        validation evidence and policy it was judged against. A client that
        names the confirmed repository change the revision came from
        (`repositoryChangeId`) does not send the two digests: the server
        already holds both inputs and derives them, because a browser client
        never constructs an identifier or a digest it cannot compute from what
        it was given (LOCAL-36 G-01). A caller that does send them -- a
        workload holding the inputs itself -- must send both.

        SCHEMA-2.9.0 (INFRA-E2E-7 finding, LOCAL-57 pattern): when
        `repositoryChangeId` is present, `sourceRevision` is optional too --
        the API derives it as the named confirmed change's candidate commit,
        which no read exposes to a browser client, and refuses a present value
        that disagrees with `422 VALIDATION_FAILED` naming `/sourceRevision`.
        When `repositoryChangeId` is absent (the 2.7.1 shape) `sourceRevision`
        stays required alongside the two digests.
