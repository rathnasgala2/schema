        policyDigest:
          description: |
            `sha256` over the RFC 8785 canonical JSON of the exact publication
            policy document the revision was judged against, lowercase hex with
            the `sha256:` prefix. Server-derived from the named confirmed
            repository change when absent.
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        repositoryChangeId:
          description: |
            The confirmed repository change this review is created from. It is
            the `operationId` the plan's `202` returned, which is also the
            created change's identity (LOCAL-16).
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        sourceRevision:
          description: |
            The exact source revision under review. Required when
            `repositoryChangeId` is absent. When it is present the API derives
            the revision from the named confirmed change's candidate commit
            and refuses a disagreement with `422 VALIDATION_FAILED` naming
            `/sourceRevision` (SCHEMA-2.9.0, LOCAL-57 pattern).
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        validationEvidenceDigest:
          description: |
            `sha256` over the RFC 8785 canonical JSON of the exact validation
            evidence recorded for this revision, lowercase hex with the
            `sha256:` prefix. Server-derived from the named confirmed
            repository change when absent.
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
      type: object
