          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        moreReplies:
          type: boolean
        own:
          $ref: '#/components/schemas/CommentOwnState'
        parentId:
