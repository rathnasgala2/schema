    PublishingPolicy:
      additionalProperties: false
      description:
        'How this publication publishes. Absence of the member on the
        publication resource means the defaults: `requireReview` false,
        `galascribeMerges` true, and `staggeredRelease` off (`enabled` false,
        `timezone` null). When the member is present it carries all three
        (SCHEMA-3.19.0 adds `staggeredRelease`).'
      properties:
        galascribeMerges:
          description:
            Default true. When true Galascribe opens and merges the pull request
            itself through the GitHub App; when false each change must already
            be merged on GitHub before it can be published.
          type: boolean
        requireReview:
          description:
            Default false. When true a change needs an approved review before it
            can be published.
          type: boolean
        staggeredRelease:
          $ref: '#/components/schemas/StaggeredReleaseSetting'
      required:
        - requireReview
