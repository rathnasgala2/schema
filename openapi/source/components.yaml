    GetOrganizationsByOrganizationIdPublicationsByPublicationIdDestinationResponse:
      additionalProperties: false
      allOf:
        - if:
            properties:
              adapterId:
                pattern: ^github-pages$
                type: string
                x-gala-const: github-pages
            required:
              - adapterId
          then:
            properties:
              environment:
                pattern: ^github-pages$
                type: string
                x-gala-const: github-pages
              providerBinding:
                properties:
                  basePath: false
                  controlPlaneBindingDigest: false
                  mutationKeyDigest: false
                  region: false
                  regionCatalogDigest: false
                  servedApiOrigin: false
                  servedBucket: false
                  stagingApiOrigin: false
                  stagingBucket: false
                  targetDigest: false
                  websiteConfigurationDigest: false
                  websiteOrigin: false
                required:
                  - owner
                  - repository
                  - repositoryId
            required:
              - environment
        - if:
            properties:
              adapterId:
                pattern: ^do-spaces$
                type: string
                x-gala-const: do-spaces
            required:
              - adapterId
          then:
            properties:
              environment:
                pattern: ^do-spaces$
                type: string
                x-gala-const: do-spaces
              providerBinding:
                properties:
                  owner: false
                  repository: false
                  repositoryId: false
                required:
                  - region
                  - servedBucket
                  - stagingBucket
                  - basePath
                  - websiteOrigin
                  - servedApiOrigin
                  - stagingApiOrigin
                  - targetDigest
                  - mutationKeyDigest
                  - regionCatalogDigest
                  - websiteConfigurationDigest
                  - controlPlaneBindingDigest
            required:
              - environment
              - providerBinding
        - if:
            properties:
              adapterId:
                pattern: ^local-directory$
                type: string
                x-gala-const: local-directory
            required:
              - adapterId
          then:
            properties:
              environment:
                pattern: ^local-directory$
                type: string
                x-gala-const: local-directory
              providerBinding: false
            required:
              - environment
      description:
        'The publication''s deployment destination (SCHEMA-2.10.0, LOCAL-63).
        `state: UNSET` with `version: 0` is the honest representation of no
        destination chosen yet: the sub-resource exists for every publication,
        and `PUT` uses the required `If-Match` header uniformly (`"0"` means
        create). `adapterId`, `environment` and `providerBinding` are present
        exactly when `state` is `SET` or `LOCKED`.'
      properties:
        adapterId:
          description:
            Present once the destination has been set (`state` `SET` or
            `LOCKED`); absent while `UNSET`.
          enum:
            - github-pages
            - do-spaces
            - local-directory
          type: string
        admittedRegions:
          description:
            The exact accepted DigitalOcean Spaces region catalog (server-owned
            `spacesRegionCatalog`), so a client never hard-codes provider facts
            (LOCAL-63c). ASCII-sorted, present regardless of the chosen adapter
            so a Spaces picker can render before the author selects it.
          items:
            $ref: ../schemas/deployment-intent.schema.json#/$defs/spacesRegion
          maxItems: 64
          minItems: 1
          type: array
          uniqueItems: true
        callerCapabilities:
          description:
            Capability keys the calling principal holds on this resource, so
            that a client can enable or hide controls without guessing (LOCAL-34
            G15/G16). Absent means the server did not compute it; it is never an
            authorization decision by itself.
          items:
            maxLength: 160
            minLength: 1
            type: string
          maxItems: 200
          type: array
          uniqueItems: true
        environment:
          description:
            Equals `adapterId`; present exactly when `adapterId` is present.
          enum:
            - github-pages
            - do-spaces
            - local-directory
          type: string
        lockedAt:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/rfc3339
          description:
            'Present exactly when `state` is `LOCKED`: the instant the accepting
            publish transaction fixed the destination.'
        lockedByOperationId:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/stableId
          description:
            'Present exactly when `state` is `LOCKED`: the operation id of the
            publish that fixed the destination.'
        providerBinding:
          additionalProperties: false
          properties:
            basePath:
              default: /
              maxLength: 512
              minLength: 1
              pattern: ^/$|^/(?:[A-Za-z0-9._-]+/)+$
              type: string
            controlPlaneBindingDigest:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
            mutationKeyDigest:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
            owner:
              maxLength: 39
              minLength: 1
              pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
              type: string
            region:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/spacesRegion
            regionCatalogDigest:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
            repository:
              maxLength: 100
              minLength: 1
              pattern: ^(?!\.{1,2}$)[A-Za-z0-9._-]{1,100}$
              type: string
            repositoryId:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/githubPositiveDecimal
            servedApiOrigin:
              allOf:
                - $ref: ../schemas/deployment-intent.schema.json#/$defs/urlHttps
              maxLength: 2048
              type: string
            servedBucket:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/spacesBucket
            stagingApiOrigin:
              allOf:
                - $ref: ../schemas/deployment-intent.schema.json#/$defs/urlHttps
              maxLength: 2048
              type: string
            stagingBucket:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/spacesBucket
            targetDigest:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
            websiteConfigurationDigest:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
            websiteOrigin:
              allOf:
                - $ref: ../schemas/deployment-intent.schema.json#/$defs/urlHttps
              maxLength: 2048
              type: string
          required: []
          type: object
        publicationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        state:
          enum:
            - UNSET
            - SET
            - LOCKED
          type: string
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - publicationId
        - version
        - state
      type: object
