  schemas:
    ActivationDetectionEvidenceResponse:
      additionalProperties: false
      properties:
        activationDetectionObservation:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/activationDetectionObservation
        activationDetectionPlanDigest:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/digest
        operationId:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/stableId
        organizationId:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/stableId
      required:
        - organizationId
        - operationId
        - activationDetectionPlanDigest
        - activationDetectionObservation
      type: object
    AuthenticatorState:
      enum:
        - ACTIVE
        - AVAILABLE
        - COMPROMISED
        - CONSUMED
        - REVOKED
        - UNLINKED
      type: string
    AuthenticatorSummary:
      additionalProperties: false
      properties:
        authenticatorId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        createdAt:
          description:
            When this authenticator was registered. Optional and nullable,
            because a row migrated from before the column existed carries no
            registration instant, and a client shows nothing rather than
            guessing one.
          format: date-time
          pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z$
          type:
            - string
            - 'null'
        kind:
          enum:
            - GITHUB
            - PASSKEY
            - RECOVERY_CODES
          type: string
        label:
          maxLength: 80
          minLength: 1
          type: string
        lastUsedAt:
          description:
            When this authenticator last completed an authentication. Optional
            and nullable, because an authenticator that has never been used, or
            whose use predates this field, carries no instant.
          format: date-time
          pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z$
          type:
            - string
            - 'null'
        state:
          $ref: '#/components/schemas/AuthenticatorState'
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - authenticatorId
        - version
        - state
        - kind
        - label
      type: object
    DeleteOrganizationsByOrganizationIdPublicationsByPublicationIdRequest:
      additionalProperties: false
      properties:
        consequenceDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        consequencePreviewId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        exportWindowAcknowledged:
          const: true
          type: boolean
        irreversibleFenceAcknowledged:
          const: true
          type: boolean
      required:
        - consequencePreviewId
        - consequenceDigest
        - exportWindowAcknowledged
        - irreversibleFenceAcknowledged
      type: object
    DeleteOrganizationsByOrganizationIdPublicationsByPublicationIdResponse:
      $ref: '#/components/schemas/OperationResponse'
    DeploymentActivationEvidence:
      additionalProperties: false
      description: |
        What Galascribe knows about this generation becoming the served one.
        Absent when the server has recorded nothing; present with `state` alone
        while nothing has been detected yet. `detectedAt` and `method` are the
        `activationBasis` DEC-097 section 6 installs exactly once, so they are
        present together or not at all.
      properties:
        detectedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        method:
          $ref: '#/components/schemas/DeploymentActivationMethod'
        state:
          $ref: '#/components/schemas/DeploymentActivationState'
      required:
        - state
      type: object
    DeploymentActivationMethod:
      description: |
        Which of DEC-097 section 6's two `activationBasis` sources proved
        activation: the adapter's own provider observation, or Galascribe's
        credential-free public generation-marker watch.
      enum:
        - KERNEL_PROVIDER_OBSERVATION
        - GALA_PUBLIC_MARKER_DETECTION
      type: string
    DeploymentActivationState:
      description: |
        Where this generation stands against the deployment generation machine's
        activation edge. `NOT_DETECTED` is CANDIDATE or STAGED with no basis
        installed; `DETECTED` is a basis installed, which is what admits
        ACTIVE_VERIFYING and every later state; `ABANDONED` is the machine's
        `CANDIDATE | STAGED -> ABANDONED` arrow, taken only with proof of no
        activation.
      enum:
        - NOT_DETECTED
        - DETECTED
        - ABANDONED
      type: string
    DeploymentVerificationEvidence:
      additionalProperties: false
      description: |
        What Galascribe's public verification has established for this
        generation. Absent when the server has recorded nothing. `verifiedAt` is
        present only in the `VERIFIED` state; `publicVerificationUrl` is the
        public address the verification actually fetched, so a reader can see
        for themselves what Galascribe saw.
      properties:
        publicVerificationUrl:
          description:
            Absolute `https` URL the public verification fetched. Clients
            navigate to it verbatim and never construct it (LOCAL-36 G-05).
          maxLength: 2048
          minLength: 1
          pattern: ^https://[^\s?#]+$
          type: string
        state:
          $ref: '#/components/schemas/DeploymentVerificationState'
        verifiedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
      required:
        - state
      type: object
    DeploymentVerificationState:
      description: |
        Where this generation stands against the deployment generation machine's
        verification arc, one member per reachable outcome: `NOT_STARTED` is
        CANDIDATE or STAGED, `IN_PROGRESS` is ACTIVE_VERIFYING, `VERIFIED` is
        ACTIVE_VERIFIED, `DEGRADED` is PROPAGATION_DEGRADED, `RECONCILING` is
        UNKNOWN_RECONCILING, and `INCONCLUSIVE` is DEC-097 section 6's
        `verification-inconclusive` finalization -- the deadline passed with at
        least one required stream unread. A SUPERSEDED generation keeps the
        state it last reached.
      enum:
        - NOT_STARTED
        - IN_PROGRESS
        - VERIFIED
        - DEGRADED
        - RECONCILING
        - INCONCLUSIVE
      type: string
    DeploymentGenerationState:
      enum:
        - CANDIDATE
        - STAGED
        - ACTIVE_VERIFYING
        - ACTIVE_VERIFIED
        - PROPAGATION_DEGRADED
        - ABANDONED
        - UNKNOWN_RECONCILING
        - SUPERSEDED
      type: string
    DeploymentSummary:
      additionalProperties: false
      properties:
        activation:
          $ref: '#/components/schemas/DeploymentActivationEvidence'
        artifactDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        defaultBranchUpdate:
          $ref: '#/components/schemas/DeploymentDefaultBranchUpdate'
        generationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        sourceCommit:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        state:
          $ref: '#/components/schemas/DeploymentGenerationState'
        verification:
          $ref: '#/components/schemas/DeploymentVerificationEvidence'
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - generationId
        - version
        - state
        - artifactDigest
        - sourceCommit
      type: object
    GetGithubAppResponse:
      additionalProperties: false
      description:
        Public identity of the Galascribe GitHub App, so that a client can send
        an owner to GitHub's installation flow without ever asking a person for
        a numeric identifier (LOCAL-36 G-05).
      properties:
        installUrl:
          description:
            Absolute GitHub URL that starts the installation flow for this App.
            Clients navigate to it verbatim and never construct it.
          maxLength: 2048
          minLength: 1
          pattern: ^https://github\.com/apps/[A-Za-z0-9][A-Za-z0-9-]{0,98}/installations/new$
          type: string
        slug:
          description: GitHub App slug, as GitHub publishes it.
          maxLength: 100
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,98}$
          type: string
      required:
        - slug
        - installUrl
      type: object
    GetGithubInstallationsByInstallationIdRepositoriesResponse:
      additionalProperties: false
      allOf:
        - else:
            properties:
              nextCursor:
                type: 'null'
          if:
            properties:
              hasMore:
                const: true
            required:
              - hasMore
          then:
            properties:
              nextCursor:
                type: string
            required:
              - nextCursor
      properties:
        hasMore:
          type: boolean
        pagesVisibilityPolicy:
          $ref: '#/components/schemas/GithubPagesVisibilityPolicy'
        items:
          items:
            $ref: '#/components/schemas/GithubRepositorySummary'
          maxItems: 100
          type: array
        nextCursor:
          description:
            Opaque cursor for the next page. Present and non-null exactly when
            `hasMore` is true; absent or null when `hasMore` is false. The
            length bounds constrain the string branch only.
          maxLength: 2048
          minLength: 1
          type:
            - string
            - 'null'
      required:
        - items
        - hasMore
