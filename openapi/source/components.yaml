      type: object
    GithubRepositoryStartFrom:
      description: |
        What a created repository starts from. `USER_TEMPLATE` (the default)
        generates from the `rathnasgala2/user-template` GitHub template,
        which already carries the settings files, a content folder and the
        publish workflow, so the repository is set up for Galascribe from
        the moment it exists. `EMPTY` creates a repository with none of
        that; `POST .../repository:set-up` adds it afterward.
      enum:
        - USER_TEMPLATE
        - EMPTY
      type: string
    GithubPullRequestSummary:
      additionalProperties: false
      description: |
        GitHub's last authoritative observation of the pull request exposing
        this exact candidate revision for review. The URL is always the
        canonical web `github.com/{owner}/{repository}/pull/{number}` URL;
        absence of this object means no pull request has been recorded yet.
      properties:
        baseRef:
          description:
            The pull request's base branch name as reported by GitHub.
          maxLength: 255
          minLength: 1
          type: string
        headRef:
          description:
            The pull request's head branch name as reported by GitHub.
          maxLength: 255
          minLength: 1
          type: string
        headRevision:
          description: The exact commit observed at the pull request head.
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        number:
          format: int64
          minimum: 1
          type: integer
        observedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        state:
          description: GitHub's normalized pull-request lifecycle state.
          enum:
            - OPEN
            - CLOSED
            - MERGED
          type: string
        url:
          description: The canonical GitHub pull-request URL.
          format: uri
          pattern: ^https://github[.]com/[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}/pull/[1-9][0-9]*$
          type: string
      required:
        - number
        - url
        - headRef
        - baseRef
        - headRevision
        - state
        - observedAt
      type: object
