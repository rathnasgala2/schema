    DefaultBranchUpdateState:
      description: |
        Where a publish's attempt to move the linked repository's default
        branch forward stands. `PENDING` is not yet attempted or awaiting
        retry; `UPDATED` is the terminal success. `BLOCKED_BY_PROTECTION`
        (GitHub refused because the branch is protected) and `DIVERGED` (the
        branch moved since the publish was accepted) are both retryable
        without republishing, because the site is already live either way;
        `FAILED` covers every other cause.
      enum:
        - PENDING
        - UPDATED
        - BLOCKED_BY_PROTECTION
        - DIVERGED
        - FAILED
      type: string
    DeploymentDefaultBranchUpdate:
      additionalProperties: false
      description: |
        Whether the worker that fast-forwards the linked repository's
        default branch to this deployment's published revision has run, and
        how it ended. Absent on a deployment generation predating this
        field.
      properties:
        state:
          $ref: '#/components/schemas/DefaultBranchUpdateState'
        updatedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
      required:
