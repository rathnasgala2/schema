          maxLength: 2048
          minLength: 8
          pattern: ^https://[^\s#]+$
          type:
            - string
            - 'null'
        logoUri:
          format: uri
          maxLength: 2048
          minLength: 8
          pattern: ^https://[^\s#]+$
          type:
            - string
            - 'null'
        name:
          maxLength: 120
          minLength: 1
          type: string
        redirectUris:
          items:
            format: uri
            maxLength: 2048
            minLength: 8
            pattern: ^(?:https://[^/\s#]+/|http://(?:localhost|127\.0\.0\.1|\[::1\])(?::[0-9]+)?/)[^\s#]*$
            type: string
          maxItems: 20
          type: array
          uniqueItems: true
