            Exactly
            `/v2/organizations/{organizationId}/operations/{operationId}` for
            every organization-scoped operation. Clients navigate to this URL
            verbatim and never construct the path themselves (LOCAL-36 G-14). It
            is an API path under `/v2/...` rather than a client route, so a
            browser client resolves it through its own routing table (the App
