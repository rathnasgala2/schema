    StaggeredReleaseTimezone:
      description:
        'SCHEMA-3.19.0: an IANA time zone name (`America/Los_Angeles`,
        `Europe/London`, `UTC`). The API accepts only a name its time-zone
        database knows; an unknown name is `422 VALIDATION_FAILED` pointed at
        `/publishingPolicy/staggeredRelease/timezone`. The pattern only fixes
        the shape.'
      maxLength: 64
      pattern: ^(?:[A-Za-z_]+(?:/[A-Za-z0-9_+-]+)+|UTC)$
      type: string
    StaggeredReleaseSetting:
      additionalProperties: false
      allOf:
        - if:
            properties:
              enabled:
                const: true
            required:
              - enabled
          then:
