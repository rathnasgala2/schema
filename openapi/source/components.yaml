    PostPlatformOauthClientsRequest:
      additionalProperties: false
      allOf:
        - if:
            properties:
              grantTypes:
                contains:
                  const: AUTHORIZATION_CODE
            required:
              - grantTypes
          then:
            properties:
              redirectUris:
                minItems: 1
          else:
            properties:
              redirectUris:
                maxItems: 0
        - if:
            properties:
              grantTypes:
                contains:
                  const: REFRESH_TOKEN
            required:
              - grantTypes
          then:
            properties:
              grantTypes:
                contains:
                  const: AUTHORIZATION_CODE
        - if:
            properties:
              clientType:
                const: PUBLIC
            required:
              - clientType
          then:
            properties:
              grantTypes:
                not:
                  contains:
                    const: CLIENT_CREDENTIALS
      properties:
        accessTokenTtlSeconds:
          maximum: 86400
          minimum: 300
          type: integer
        clientType:
          $ref: '#/components/schemas/PlatformOauthClientType'
        description:
          maxLength: 1000
          minLength: 1
