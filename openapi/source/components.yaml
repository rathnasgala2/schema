        state:
          enum:
            - NONE
            - PENDING
            - ISSUED
            - ERRORED
            - PROXIED
          description:
            "`PROXIED` (SCHEMA-3.6.0): the provider's edge terminates TLS;
            GitHub's own certificate is not renewed while proxied."
