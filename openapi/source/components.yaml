          if:
            properties:
              managedReceiptSnapshotCount:
                const: 0
            required:
              - managedReceiptSnapshotCount
          then:
            not:
              anyOf:
                - required:
                    - managedReceipt
                - required:
                    - currentAttemptManagedReceipt
                - required:
                    - nextManagedReceiptSnapshotSequence
            properties:
              managedReceiptSnapshots:
                maxItems: 0
        - if:
            properties:
              managedReceiptSnapshots:
                maxItems: 0
            required:
              - managedReceiptSnapshots
          then:
            not:
              required:
                - nextManagedReceiptSnapshotSequence
        - if:
            required:
              - nextManagedReceiptSnapshotSequence
          then:
            properties:
              managedReceiptSnapshots:
                minItems: 1
      properties:
        activationBasis:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/activationBasis
        activationDetectionLastEvidenceDigest:
