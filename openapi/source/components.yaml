        displayName:
          maxLength: 80
          minLength: 1
          type: string
        initials:
          maxLength: 4
          minLength: 1
          type: string
      required:
        - displayName
        - initials
      type: object
    Consequence:
      additionalProperties: false
      description:
        One consequence a consequence preview names before a fenced command
        (owner transfer, publication transfer, account closure) (SCHEMA-3.3.0).
        The command quotes the preview's `consequenceDigest` back; a client
        never fabricates it.
      properties:
        code:
          description:
            Closed, machine-readable consequence identifier the client renders
            through its own copy deck.
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:[-.][a-z0-9]+)*$
          type: string
        detail:
          description: Plain, non-sensitive summary of this consequence.
          maxLength: 320
          minLength: 1
          type: string
        organizationId:
          description:
            The organization this consequence concerns, when it concerns one
            (account closure lists its consequences by organization).
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
