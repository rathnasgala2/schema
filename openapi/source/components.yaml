    ReceiptExchangeDeploymentIntentRequest:
      additionalProperties: false
      allOf:
        - if:
            properties:
              adapter:
                properties:
                  adapterId:
                    const: github-pages
                required:
                  - adapterId
            required:
              - adapter
          then:
            not:
              required:
                - spacesStagePrefix
        - if:
            properties:
              adapter:
                properties:
                  adapterId:
                    const: do-spaces
                required:
                  - adapterId
            required:
              - adapter
          then:
            not:
              required:
                - pagesBuildVersion
        - if:
            properties:
              adapter:
                properties:
                  adapterId:
                    const: local-directory
                required:
                  - adapterId
            required:
              - adapter
          then:
            not:
              anyOf:
                - required:
                    - pagesBuildVersion
                - required:
                    - spacesStagePrefix
      description: |
        What the workflow holds. `pagesBuildVersion` and `spacesStagePrefix` are
        optional here (LOCAL-57): the API derives the same two values
        deterministically from identifiers it mints, so a workflow that cannot
        compute them simply omits them, and one that can may send them. A sent
        value that does not equal the derived one is refused with `422
        VALIDATION_FAILED` -- it is a disagreement about what is being deployed,
        not a formatting error. They were required in 2.7.x, and each is still
        confined to the adapter it belongs to. The retained deployment-intent
        document carries both as required, server-derived members.

        SCHEMA-2.9.0 (LOCAL-60, DEC-097 section 7) extends the same rule to the
        members the workflow has no honest source for: `destination` is the
        request-side `ReceiptExchangeIntentRequestDestination` (its
        `environment` and `targetDigest` are api-derived), `rebuildRecord` is
        the request-side `ReceiptExchangeIntentRequestRebuildRecord` (its four
        Gala-owned members are api-derived) and `capabilityDecisionDigest` is
        api-derived. Each is optional on the request; a present value that
        disagrees with the api's derivation is refused with `422
        VALIDATION_FAILED`. `provenanceDigest` and `sbomDigest` stay required:
        they digest records the workflow itself authors. The retained
        deployment-intent document is unchanged and carries every member as
        required. Every 2.8.x request body that names the retained members with
        the values the api derives is still valid.
      properties:
        adapter:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/adapterIdentity
        artifactByteCount:
          format: int64
          minimum: 1
          type: integer
        artifactDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        artifactFileCount:
          format: int64
          minimum: 1
          type: integer
        artifactId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        capabilityDecisionDigest:
          description: |
            The digest of the closed `capabilityDecision` record (DEC-097
            section 8), when the workflow knows it. Optional (SCHEMA-2.9.0,
            LOCAL-60): the decision is server-owned, so the API constructs the
            record, derives this digest and refuses a disagreement with `422
            VALIDATION_FAILED`. Required in 2.8.x; required and server-derived
            in the retained deployment-intent document. SCHEMA-3.17.0: the
            record's `destination` carries `verificationBaseUrl` when the
            request does, so the digest covers it, as a member of `destination`
            like `baseUrl`; a request without it digests as it did before.
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        destination:
          $ref: '#/components/schemas/ReceiptExchangeIntentRequestDestination'
        effectiveArtifactExpiresAt:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/rfc3339
        frozenEnvelopeByteCount:
          format: int64
          minimum: 1
          type: integer
        frozenEnvelopeDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        frozenHandoffArtifactId:
          pattern: ^[1-9][0-9]{0,19}$
          type: string
        frozenHandoffName:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/plainLabel
        lockDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        manifestDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        pagesBuildVersion:
          description: |
            The Pages build version this deployment addresses, when the
            workflow knows it. Optional: the API derives the same value and
            refuses a disagreement (LOCAL-57). Admitted only for
            `github-pages`.
          pattern: ^[0-9a-f]{40}$
          type: string
        provenanceDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        publisher:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/packageIdentity
        purpose:
          const: deployment-intent
        rebuildRecord:
          $ref: '#/components/schemas/ReceiptExchangeIntentRequestRebuildRecord'
        requestedArtifactRetentionDays:
          maximum: 7
          minimum: 1
          type: integer
        sbomDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        sourceCommit:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        spacesStagePrefix:
          description: |
            The Spaces staging prefix this deployment stages under, when the
            workflow knows it. Optional: the API derives the same value and
            refuses a disagreement (LOCAL-57). Admitted only for `do-spaces`.
          maxLength: 512
          minLength: 1
          type: string
        verificationSubmission:
          description: |
            Whether the complete verification plan fits one request. The two
            arms are named components with an explicit `state` discriminator, so
            a generator emits two bound subtypes instead of one anonymous union
            with no members (API 2.7.1 consumer report).
          discriminator:
            mapping:
              fit: '#/components/schemas/VerificationSubmissionFit'
              unfit: '#/components/schemas/VerificationSubmissionUnfit'
            propertyName: state
          oneOf:
            - $ref: '#/components/schemas/VerificationSubmissionFit'
            - $ref: '#/components/schemas/VerificationSubmissionUnfit'
        workflowTriggerCommit:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
      required:
        - purpose
        - sourceCommit
        - workflowTriggerCommit
        - artifactId
        - artifactDigest
        - manifestDigest
        - provenanceDigest
        - sbomDigest
        - frozenHandoffArtifactId
        - frozenHandoffName
        - frozenEnvelopeDigest
        - frozenEnvelopeByteCount
        - artifactByteCount
        - artifactFileCount
        - requestedArtifactRetentionDays
        - effectiveArtifactExpiresAt
        - verificationSubmission
        - lockDigest
        - rebuildRecord
        - publisher
        - adapter
        - destination
      type: object
    ReceiptExchangeDeploymentIntentResponse:
      additionalProperties: false
      properties:
        kind:
          const: deployment-intent
          description: |
            The outer discriminator of the receipt-exchange response union.
            Optional, so a 2.7.x-era body still validates; a server that speaks
            2.8.0 always sends it.
        deploymentIntent:
          $ref: ../schemas/deployment-intent.schema.json
        purpose:
          const: deployment-intent
        reportChallengeExpiresAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        reportChallengeId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
      required:
        - purpose
        - deploymentIntent
        - reportChallengeId
        - reportChallengeExpiresAt
      type: object
    ReceiptExchangeDeploymentReceiptRequest:
      additionalProperties: false
      properties:
        attemptId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        intentDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        operationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        purpose:
          const: deployment-receipt
        reportChallengeId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
      required:
        - purpose
        - operationId
        - attemptId
        - intentDigest
        - reportChallengeId
      type: object
    ReceiptSubmissionDeployFailure:
      additionalProperties: false
      description: |
        SCHEMA-3.17.0. Why a deploy failed, as the workflow classified it, so
        the API can settle the operation with a named cause even when the
        deploy wrote no kernel journal.
      properties:
        failureCode:
          description: |
            A stable upper-case code naming the failure, for example
            `PAGES_PUBLIC_REDIRECT` (the public read was redirected, `toHost`
            says where). A free string within the pattern, not a closed
            enumeration; a client shows a generic sentence for a code it does
            not know.
          maxLength: 64
          minLength: 3
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
          type: string
        journal:
          description: |
            `present`: the deploy wrote a kernel journal and the submission
            carries it as `kernelJournal`. `absent`: the deploy failed before
            any journal existed; `kernelJournal` must be omitted.
          enum:
            - present
            - absent
          type: string
        stage:
          description: |
            The deployment stage the failure happened in (for example
            `preflight`, `staging` or `observation`), when it happened in one.
            Absent for a failure before any stage ran.
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,63}$
          type: string
        toHost:
          description: |
            For a redirect failure, the lower-case host the public read was
            redirected to (an IDNA hostname, no scheme, port or path).
          maxLength: 253
          minLength: 1
          pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
          type: string
      required:
        - journal
        - failureCode
      type: object
    ReceiptSubmissionVerifiedAt:
      additionalProperties: false
      description: |
        SCHEMA-3.17.0. The origin the workflow read the public marker at to
        verify the deploy. It can differ from `publicBaseUrl`: while a custom
        domain is being switched the verification origin is the one that
        answers over HTTPS right now, and the API records which one was read.
      properties:
        origin:
          description: |
            The https origin: scheme, lower-case host and an optional port,
            with no userinfo, path, query or fragment (no trailing slash).
          maxLength: 270
          minLength: 9
          pattern: ^https://[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?(?::[0-9]{1,5})?$
          type: string
      required:
        - origin
      type: object
    ReceiptExchangeIntentRequestDestination:
      additionalProperties: false
      allOf:
        - if:
            properties:
              adapterId:
                const: github-pages
            required:
              - adapterId
          then:
            properties:
              environment:
                const: github-pages
              providerBinding:
                properties:
                  mutationSurfaceDigest: false
                  rootIdentityDigest: false
                required:
                  - owner
                  - repository
        - if:
            properties:
              adapterId:
                const: do-spaces
            required:
              - adapterId
          then:
            not:
              required:
                - providerBinding
            properties:
              environment:
                const: do-spaces
        - if:
            properties:
              adapterId:
                const: local-directory
            required:
              - adapterId
          then:
            properties:
              environment:
                const: local-directory
              providerBinding:
                properties:
                  owner: false
                  repository: false
                required:
                  - mutationSurfaceDigest
                  - rootIdentityDigest
      description: |
        The destination as the workflow holds it (SCHEMA-2.9.0, LOCAL-60,
        DEC-097 section 7). `adapterId`, `adapterVersion` and `baseUrl` are
        required: the adapter is lock-derived and the base URL is the
        publication's canonical base, both workflow-verifiable. `environment`
        and `targetDigest` are optional: the API derives `environment` as the
        adapter's constant (LOCAL-60a) and `targetDigest` as the digest of its
        own retained provider binding, and refuses a present value that
        disagrees with `422 VALIDATION_FAILED`. `providerBinding` is admitted
        per adapter: for `github-pages` it names the repository the runner is
        bound to (`owner`, `repository`, checked against the API's repository
        binding); for `local-directory` it supplies the two evidence digests the
        API has no other source for (`rootIdentityDigest`,
        `mutationSurfaceDigest`, DEC-097 section 7); for `do-spaces` it is
        forbidden on the request until the publication destination record
        exists (C2) -- the buckets and region are bound to the author
        destination, never proposed by a deploy job. The retained
        deployment-intent `destinationIdentity` is unchanged.
      properties:
        adapterId:
          description: |
            The lock-selected adapter, one of the three MVP adapters
            (SCHEMA-2.9.0 review): the per-adapter `providerBinding` and
            `environment` rules above key on it, so an identity outside the
            vocabulary is refused here rather than falling through every
            branch. The retained `destinationIdentity.adapterId` stays a
            `plainLabel` (fixture adapters).
          enum:
            - github-pages
            - do-spaces
            - local-directory
          type: string
        adapterVersion:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/semver
        baseUrl:
          allOf:
            - $ref: ../schemas/deployment-intent.schema.json#/$defs/urlHttps
          maxLength: 2048
          type: string
          x-gala-utf8ByteLength:
            maximum: 2048
        environment:
          description: |
            Optional (SCHEMA-2.9.0): the API derives the adapter's constant
            (`github-pages`, `do-spaces` or `local-directory`, LOCAL-60a) and
            refuses a disagreement with `422 VALIDATION_FAILED`. Required in
            the retained document.
          enum:
            - github-pages
            - do-spaces
            - local-directory
          type: string
        providerBinding:
          $ref: '#/components/schemas/ReceiptExchangeIntentRequestProviderBinding'
        targetDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
          description: |
            Optional (SCHEMA-2.9.0): the API derives the digest of its retained
            provider binding (`GALA-DESTINATION-PROVIDER-BINDING-V2`) and
            refuses a disagreement with `422 VALIDATION_FAILED`. Required in
            the retained document.
        verificationBaseUrl:
          allOf:
            - $ref: ../schemas/deployment-intent.schema.json#/$defs/urlHttps
          description: |
            Optional (SCHEMA-3.17.0): the address the deploy is verified at
            when that differs from `baseUrl`, the build base. It is the origin
            and path that answer over HTTPS right now: the github.io project
            address before a custom domain's CNAME is set, the custom base once
            it serves. A lowercase exact host with no userinfo, port, query or
            fragment; a path is allowed. The API refuses a value it does not
            consider the serving address with `422 VALIDATION_FAILED`, and
            retains it in the deployment intent's `destination`. When present it
            is inside the capability decision record, so `capabilityDecisionDigest`
            covers it as it covers `baseUrl` (RFC 8785 canonical member order);
            when absent the digest is exactly what it was before 3.17.0.
          maxLength: 2048
          pattern: ^https://[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?(?:/[^?#\s]*)?$
          type: string
          x-gala-utf8ByteLength:
            maximum: 2048
      required:
        - adapterId
        - adapterVersion
        - baseUrl
      type: object
    ReceiptExchangeIntentRequestProviderBinding:
      additionalProperties: false
      description: |
        Request-side provider binding material (SCHEMA-2.9.0). Which members are
        admitted is fixed by the owning destination's `adapterId`: `owner` and
        `repository` for `github-pages` (the same spellings as the retained
        `destinationProviderCoordinates`), `rootIdentityDigest` and
        `mutationSurfaceDigest` for `local-directory` (DEC-097 section 7 local
        binding), nothing for `do-spaces`.
      properties:
        mutationSurfaceDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
          description: |
            `local-directory` only: the descriptor-proved, path-insensitive
            physical mutation surface digest (`GALA-LOCAL-MUTATION-SURFACE-V2`).
        owner:
          description: GitHub owner login, for `github-pages` destinations.
          maxLength: 39
          minLength: 1
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$
          type: string
          x-gala-asciiByteLength:
            maximum: 39
            minimum: 1
        repository:
          description: GitHub repository name, for `github-pages` destinations.
          maxLength: 100
          minLength: 1
          pattern: ^(?!\.{1,2}$)[A-Za-z0-9._-]{1,100}$
          type: string
          x-gala-asciiByteLength:
            maximum: 100
            minimum: 1
        rootIdentityDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
          description: |
            `local-directory` only: the path-sensitive root identity digest
            (`GALA-LOCAL-ROOT-IDENTITY-V2`).
      type: object
    ReceiptExchangeIntentRequestRebuildRecord:
      additionalProperties: false
      description: |
        The request-side reproducible build record (SCHEMA-2.9.0, LOCAL-60).
        It carries exactly the members of the retained
        `recordReproducibleBuildRecord` (DEC-097 section 5), by the same
        definitions, with the four Gala-owned members optional: `policyReleaseId` and
        `buildPolicyDecisionDigest` equal the accepted policy decisions,
        `packageReleaseCatalogDigest` equals the server-selected catalog and
        `destinationCapabilityDigest` equals the owning validated destination
        record. The API derives each of the four, writes it into the retained
        record before retention and refuses a present value that disagrees with
        `422 VALIDATION_FAILED`. The retained record is unchanged: one
        byte-identical closed object in build provenance, the deployment intent,
        the authorization request and the durable operation record, with every
        member required.
      properties:
        basePath:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/canonicalRoute
        baseUrl:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/urlHttps
        buildEpoch:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/rfc3339
        buildInputDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
        buildPolicyDecisionDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
          description: |
            Optional (SCHEMA-2.9.0): the API derives the accepted build-policy
            decision digest and refuses a disagreement with `422
            VALIDATION_FAILED`. Required in the retained record.
        builder:
          allOf:
            - $ref: ../schemas/deployment-intent.schema.json#/$defs/packageIdentity
            - properties:
                package:
                  const: '@rathnasgala2/publish-action'
        contractVersion:
          const: 2.0.0
        dependencyLockDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
        destinationCapabilityDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
          description: |
            Optional (SCHEMA-2.9.0): the API derives it from the owning
            validated destination record and refuses a disagreement with `422
            VALIDATION_FAILED`. Required in the retained record.
        packageReleaseCatalogDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
          description: |
            Optional (SCHEMA-2.9.0): the API derives the server-selected
            package release catalog digest and refuses a disagreement with
            `422 VALIDATION_FAILED`. Required in the retained record.
        policyReleaseId:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/stableId
          description: |
            Optional (SCHEMA-2.9.0): the API derives the accepted immutable
            policy release identity and refuses a disagreement with `422
            VALIDATION_FAILED`. Required in the retained record.
        renderPolicy:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/recordRenderPolicyIdentity
        repositoryId:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/githubPositiveDecimal
        repositoryRootDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
        schemas:
          allOf:
            - $ref: ../schemas/deployment-intent.schema.json#/$defs/packageIdentity
            - properties:
                package:
                  const: '@rathnasgala2/schemas'
        sourceCommit:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/gitObjectId
        sourceTree:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/gitObjectId
        stylingContractDigest:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
        template:
          allOf:
            - $ref: ../schemas/deployment-intent.schema.json#/$defs/packageIdentity
            - properties:
                package:
                  const: '@rathnasgala2/template'
        theme:
          allOf:
            - $ref: ../schemas/deployment-intent.schema.json#/$defs/packageIdentity
            - properties:
                package:
                  enum:
                    - '@rathnasgala2/theme-default'
                    - '@rathnasgala2/theme-amaze'
                    - '@rathnasgala2/theme-editorial'
                    - '@rathnasgala2/theme-flashy'
                    - '@rathnasgala2/theme-minimal'
                    - '@rathnasgala2/theme-zebra'
        workflowIdentity:
          $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
      required:
        - repositoryId
        - sourceCommit
        - sourceTree
        - repositoryRootDigest
        - buildEpoch
        - contractVersion
        - builder
        - schemas
        - template
        - theme
        - dependencyLockDigest
        - buildInputDigest
        - baseUrl
        - basePath
        - stylingContractDigest
        - renderPolicy
        - workflowIdentity
      type: object
    ReceiptExchangeSubmissionRecordedResponse:
      additionalProperties: false
      properties:
        kind:
          const: deployment-receipt-submission-recorded
          description: |
            The outer discriminator of the receipt-exchange response union.
            Optional, so a 2.7.x-era body still validates; a server that speaks
            2.8.0 always sends it.
        operationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        purpose:
          const: deployment-receipt
        state:
          const: submission-recorded
        statusUrl:
          description:
            Exactly
            `/v2/organizations/{organizationId}/operations/{operationId}`.
            Clients navigate to this URL verbatim and never construct the path
            themselves (LOCAL-36 G-14). It is an API path under `/v2/...` rather
            than a client route, so a browser client resolves it through its own
            routing table (the App maps
            `/v2/organizations/{organizationId}/operations/{operationId}` onto
            `/organizations/{organizationId}/operations/{operationId}`) rather
            than treating it as a link to follow directly.
          minLength: 1
          pattern: ^/(?!/)(?!.*//)(?!.*[?#]).*$
          type: string
      required:
        - purpose
        - state
        - operationId
        - statusUrl
      type: object
    RepositoryBindingState:
      enum:
        - PENDING
        - ACTIVE
        - AUTHORITY_LOST
        - TRANSFERRING
        - REVOKED
      type: string
    RepositoryChangeState:
      enum:
        - REQUESTED
        - PLANNED
        - AWAITING_CONFIRMATION
        - COMMIT_REQUESTED
        - COMMITTING
        - COMMITTED
        - UNKNOWN_RECONCILING
        - FAILED_NO_CHANGE
        - CANCELLED
      type: string
    RetirementConsequence:
      additionalProperties: false
      properties:
        code:
          description:
            Closed, machine-readable consequence identifier the client renders
            through its own copy deck.
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9]*(?:[-.][a-z0-9]+)*$
          type: string
        detail:
          description: Plain, non-sensitive summary of this consequence.
          maxLength: 320
          minLength: 1
          type: string
        reversible:
          type: boolean
      required:
        - code
        - detail
        - reversible
      type: object
    ReviewState:
      enum:
        - REQUESTED
        - APPROVED
        - REJECTED
        - INVALIDATED
      type: string
    ReviewSummary:
      additionalProperties: false
      description: |
        One review of an exact source revision. It is the same body the single
        review read returns, so a list row and a read of that row never
        disagree.
      properties:
        comment:
          description:
            The newest decision's reviewer comment (SCHEMA-3.6.0). Absent when
            the decision carried none.
          maxLength: 4000
          minLength: 1
          type: string
        decidedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        decidedBy:
          $ref: '#/components/schemas/SiteActor'
        findingsDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        requestedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        requestedBy:
          $ref: '#/components/schemas/SiteActor'
        reviewId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        sourceRevision:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        state:
          $ref: '#/components/schemas/ReviewState'
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - reviewId
        - version
        - state
        - sourceRevision
      type: object
    RoleScope:
      enum:
        - ORGANIZATION
        - PUBLICATION
        - ORGANIZATION_OR_PUBLICATION
      type: string
    RoleSummary:
      additionalProperties: false
      description:
        "SCHEMA-3.3.0: `kind`, `revision`, `state` and `memberCount` are always
        present from this release on (optional only so a 3.2 body still
        validates); `basedOnRoleKey` names the default role a `CUSTOM` role was
        cloned from. A custom role's `stableKey` is server-assigned (`custom_`
        and a suffix); its `description` reads `Based on <base role name>` when
        none was given."
      properties:
        basedOnRoleKey:
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        capabilityKeys:
          items:
            maxLength: 160
            minLength: 1
            type: string
          maxItems: 200
          type: array
          uniqueItems: true
        description:
          maxLength: 320
          minLength: 1
          type: string
        kind:
          $ref: '#/components/schemas/RoleKind'
        memberCount:
          format: int64
          minimum: 0
          type: integer
        name:
          maxLength: 80
          minLength: 1
          type: string
        revision:
          format: int64
          minimum: 1
          type: integer
        roleId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        scope:
          $ref: '#/components/schemas/RoleScope'
        stableKey:
          maxLength: 80
          minLength: 1
          pattern: ^[a-z][a-z0-9_]*$
          type: string
        state:
          $ref: '#/components/schemas/RoleState'
      required:
        - roleId
        - stableKey
        - scope
        - name
        - description
        - capabilityKeys
      type: object
    SessionFamilyState:
      enum:
        - ACTIVE
        - ROTATED
        - REVOKED
        - EXPIRED
        - COMPROMISED
      type: string
    SessionSummary:
      additionalProperties: false
      description:
        One signed-in browser. `current` marks the session making the request.
