              $ref: ../schemas/deployment-intent.schema.json#/$defs/spacesBucket
            stagingBucket:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/spacesBucket
          required: []
          type: object
      required:
        - adapterId
      type: object
    PutOrganizationsByOrganizationIdPublicationsByPublicationIdDestinationResponse:
