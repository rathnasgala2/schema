    ContentItemUnreadableReason:
      description: |
        Why an inventory item's header could not be read. `HEADER_MISSING`:
        the file has no header block at all. `HEADER_UNPARSABLE`: the header
        block does not parse. `HEADER_INVALID`: it parses but does not
        validate against `content-frontmatter.schema.json`. `TOO_LARGE`: the
        file exceeds the document read's 1 MiB bound, so the header was never
        read.
