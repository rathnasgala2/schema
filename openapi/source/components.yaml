        lives beside the article it derives from. Since schema 2.15.0 this comes
        from the header's own `kind` when the inventory item's `summary` is
        present; before that, and whenever `unreadable` is present instead, it
        is derived from the path alone."
      enum:
        - ARTICLE
        - PAGE
        - EDITION
      type: string
    ContentItemStatus:
      description:
        The header's `status`, upper-cased to this contract's enum style.
