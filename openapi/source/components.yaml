          description:
            'SCHEMA-3.21.0: the slug of the primary article this document
            translates; null on a primary.'
          oneOf:
            - $ref: ../schemas/content-frontmatter.schema.json#/$defs/slug
            - type: 'null'
        updatedAt:
          $ref: ../schemas/content-frontmatter.schema.json#/$defs/rfc3339
