            `target`, once proposed.
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        current:
          maxLength: 2048
          minLength: 1
          pattern: ^https://[^\s]+$
          type: string
        published:
          description:
            True once a live version is served with `target` as its address.
          type: boolean
        target:
          maxLength: 2048
          minLength: 1
          pattern: ^https://[^\s]+$
          type: string
      required:
        - current
        - target
        - published
      type: object
    DomainBaseMove:
      additionalProperties: false
      description: |
        SCHEMA-3.17.0. Where the system's move of the site's canonical base
        (`gala/publication.json` `canonicalBase`) stands. Connecting a domain
        moves the base to the custom address and removing it moves the base
        back to the github.io address, each as a system operation
        (`domain_base_move`) that proposes the "Site address" change and
        publishes it, ordered so no address serves a build made for the other.
        A person never has to publish for it.
      properties:
        changeId:
          description: |
            The repository change that carries the base move, once proposed.
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        operationId:
          description: |
            The `domain_base_move` operation doing the work, once it exists;
            read it at `/v2/organizations/{organizationId}/operations/{operationId}`.
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        reason:
          description: |
            Why the move is not progressing, when it is not: a stable upper-case
            code. Known values: `MOVE_FAILED` (an attempt failed; the next check
            cycle retries), `MOVE_STUCK` (three attempts failed; the author's
            Check now retries), `MOVE_ABANDONED` (the move back to the github.io
            address on removal gave up) and `AUTHORITY_LAPSED` (the stored
            publish authority the move runs under could not be restated from the
            latest decision). Absent while the move is progressing or not
            needed. A client shows a generic sentence for a value it does not
            know.
          maxLength: 80
          minLength: 1
          type: string
        state:
          description: |
            `NOT_NEEDED`: the profile base already is the address the site is
            served from. `PENDING`: a move is required and has not started.
            `MOVING`: the move operation is running. `FAILED`: the last attempt
            failed (`reason` says how; it is retried until `MOVE_STUCK`).
            `PROPOSED`: the "Site address" change exists (`changeId`) and is not
            yet published. `PUBLISHED`: the move completed and the base is
            live.
          enum:
            - NOT_NEEDED
            - PENDING
            - MOVING
            - FAILED
            - PROPOSED
            - PUBLISHED
          type: string
      required:
        - state
      type: object
    DomainNextStep:
      additionalProperties: false
      description:
        What is being waited on, or what the author should do next. Known codes
        include `ADD_DNS_RECORDS`, `WAIT_FOR_DNS`, `WAIT_FOR_CERTIFICATE`,
        `WAIT_FOR_ROUTING`, `PUBLISH_TO_SWITCH`, `FIX_DNS_RECORD`,
        `REMOVE_DNS_RECORDS`, `TURN_ON_CLOUDFLARE_PROXY` (SCHEMA-3.6.0, the
        certificate is issued and the author may let Cloudflare proxy the site),
        `WAIT_FOR_MOVE` (SCHEMA-3.17.0, Galascribe is moving the site's
        canonical base to or from the domain; `baseMove` says where it is and
        nothing is asked of the author) and `NONE`; a client shows `detail` for
        codes it does not know.
      properties:
        code:
          maxLength: 80
          minLength: 1
          pattern: ^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$
          type: string
        detail:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - code
        - detail
      type: object
    DomainBinding:
      additionalProperties: false
      description:
        A custom domain on GitHub Pages for one publication (SCHEMA-3.3.0).
        `dns.records` are exactly the records to add at the registrar (a CNAME
        to `<owner>.github.io` for a subdomain; GitHub's four A and four AAAA
        records for an apex). Galascribe checks DNS before it sets the Pages
        custom domain, then waits for GitHub's certificate and routing; `ACTIVE`
        proposes the change that moves `canonicalBase` to the domain, and the
        site moves at the next publish. `expiresAt` is set while
        `OWNERSHIP_PENDING` (7 days). SCHEMA-3.17.0 adds
        `redirectsFromProjectPath`, which says whether GitHub already redirects
        the project path to the domain (from the moment the Pages CNAME is set
        until it is removed) and so decides the address the site is served from
        and the base it must be built for, and `baseMove`, which says where the
        system's move of that base stands (the `WAIT_FOR_MOVE` next step is
        shown while it runs). Both are optional so a 3.16 body still validates.
      properties:
        baseMove:
          $ref: '#/components/schemas/DomainBaseMove'
        canonicalBase:
          $ref: '#/components/schemas/DomainCanonicalBase'
        certificate:
          $ref: '#/components/schemas/DomainCertificate'
        createdAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        dns:
          additionalProperties: false
          properties:
            observed:
              $ref: '#/components/schemas/DomainDnsObservation'
            providers:
              description:
                The DNS providers Galascribe can connect to for this binding
                right now (SCHEMA-3.5.0). Present only when the provider is
                configured in this environment and the binding's state has
                records to add, or (`REMOVE`) to remove. A client shows a
                connect button exactly when this names the provider and intent;
                it never decides from `nextStep`.
              items:
                $ref: '#/components/schemas/DnsProviderOffer'
              maxItems: 4
              minItems: 0
              type: array
            records:
              items:
                $ref: '#/components/schemas/DomainDnsRecord'
              maxItems: 8
              minItems: 0
              type: array
          required:
            - records
            - observed
          type: object
        domainId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        expiresAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        hostname:
          description: Lower-case ASCII (IDNA) hostname.
          maxLength: 253
          minLength: 1
          pattern: ^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$
          type: string
        kind:
          $ref: '#/components/schemas/DomainKind'
        nextStep:
          $ref: '#/components/schemas/DomainNextStep'
        proxy:
          additionalProperties: false
          description:
            Present once Galascribe turned the provider's proxy on for this
            binding through a connection (SCHEMA-3.6.0). Absent while the
            records are DNS-only.
          properties:
            provider:
              $ref: '#/components/schemas/DnsProvider'
            since:
              $ref: ../schemas/problem.schema.json#/$defs/rfc3339
          required:
            - provider
            - since
          type: object
        redirectsFromProjectPath:
          description: |
            SCHEMA-3.17.0. True while GitHub redirects the repository's
            github.io project path to this domain, which it does from the moment
            the Pages CNAME is set until it is removed. While it is true the
            site is served from the domain, so the canonical base it must carry
            is the domain's; while it is false the project path serves the site
            and the base is the github.io address. The server derives it from
            its own record of when the CNAME was set and removed, so a client
            reads the flag and does not infer it from `state`.
          type: boolean
        routing:
          $ref: '#/components/schemas/DomainRouting'
        state:
          $ref: '#/components/schemas/DomainBindingState'
        updatedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - domainId
        - version
        - hostname
        - kind
        - state
        - dns
        - certificate
        - routing
        - canonicalBase
        - nextStep
        - createdAt
        - updatedAt
      type: object
    DnsProvider:
      description:
        Where a domain's DNS records live. `CLOUDFLARE` today; a further
        provider is an additive value.
      enum:
        - CLOUDFLARE
      type: string
    DnsIntent:
      description:
        "`ADD` writes the domain's records at the provider; `REMOVE` deletes
        only the records whose values are Galascribe's targets, never anything
        else at that name; `PROXY` (SCHEMA-3.6.0) turns the provider's proxy on
        for exactly the records Galascribe wrote, and is offered only once the
        domain is live with an issued certificate."
      enum:
        - ADD
        - REMOVE
        - PROXY
      type: string
    DnsProviderOffer:
      additionalProperties: false
      description:
        A provider this environment can connect to for this binding, and what it
        can do now.
      properties:
        intents:
          items:
            $ref: '#/components/schemas/DnsIntent'
          maxItems: 3
          minItems: 1
          type: array
          uniqueItems: true
        provider:
          $ref: '#/components/schemas/DnsProvider'
      required:
        - provider
        - intents
      type: object
    DnsPlanAction:
      description:
        '`CREATE` a record that is not there; `KEEP` one already identical;
        `REPLACE` one of the same type, or a CNAME where an A/AAAA must go (or
        the reverse), that differs; `DELETE` a record carrying a Galascribe
        target value (`REMOVE` only); `PROXY_ON` (SCHEMA-3.6.0, `PROXY` only)
        the record exists DNS-only and will be set to proxied.'
      enum:
        - CREATE
        - KEEP
        - REPLACE
        - DELETE
        - PROXY_ON
      type: string
    DnsPlanEntry:
      additionalProperties: false
      description:
        "One record in a connection's plan. `record` is what Galascribe wants at
        that name; `existing` is what the provider has there now (absent for
        `CREATE`). Records are always written DNS-only (`proxied: false`) so
        GitHub can issue the certificate."
      properties:
        action:
          $ref: '#/components/schemas/DnsPlanAction'
        existing:
          additionalProperties: false
          properties:
            proxied:
              type: boolean
            type:
              maxLength: 16
              minLength: 1
              pattern: ^[A-Z][A-Z0-9]*$
              type: string
            value:
              maxLength: 4096
              minLength: 1
              type: string
          required:
            - type
            - value
            - proxied
          type: object
        record:
          $ref: '#/components/schemas/DomainDnsRecord'
      required:
        - action
        - record
      type: object
    DnsConnectionPhase:
      description:
        '`STARTED` (waiting for the person at the provider);
        `NEEDS_CONFIRMATION` (something would be replaced, nothing touched yet);
        `APPLIED`; `CANCELLED` (the person declined, or discarded the plan);
        `FAILED`; `EXPIRED` (the person did not finish in time).'
      enum:
        - STARTED
        - NEEDS_CONFIRMATION
        - APPLIED
        - CANCELLED
        - FAILED
        - EXPIRED
      type: string
    DnsConnectionOutcomeCode:
      description:
        'Why a connection ended without success: `CANCELLED` (consent denied or
        plan discarded); `ZONE_NOT_FOUND` (the domain is not in the provider
        account chosen); `ZONE_AMBIGUOUS` (more than one active zone of that
        name across the accounts granted); `SCOPE_DECLINED` (the person did not
        grant what was needed); `PROVIDER_FAILED` (the provider failed or
        refused); `STATE_INVALID` (the return from the provider could not be
        matched to this connection); `EXPIRED`.'
      enum:
        - CANCELLED
        - ZONE_NOT_FOUND
        - ZONE_AMBIGUOUS
        - SCOPE_DECLINED
        - PROVIDER_FAILED
        - STATE_INVALID
        - EXPIRED
      type: string
    DnsConnection:
      additionalProperties: false
      description:
        One attempt to add or remove a domain's DNS records at the person's DNS
        provider (SCHEMA-3.5.0). `outcome` is present when `phase` is
        `CANCELLED`, `FAILED` or `EXPIRED`; `plan` when `NEEDS_CONFIRMATION` or
        `APPLIED`; `applied` when `APPLIED`. The provider's access is used
        within one request chain (or held encrypted for at most `expiresAt` on
        `NEEDS_CONFIRMATION`) and revoked afterwards; Galascribe keeps none.
      properties:
        applied:
          additionalProperties: false
          properties:
            at:
              $ref: ../schemas/problem.schema.json#/$defs/rfc3339
            created:
              minimum: 0
              type: integer
            deleted:
              minimum: 0
              type: integer
            replaced:
              minimum: 0
              type: integer
          required:
            - at
            - created
            - replaced
            - deleted
          type: object
        connectionId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        createdAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        expiresAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        intent:
          $ref: '#/components/schemas/DnsIntent'
        outcome:
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/DnsConnectionOutcomeCode'
            detail:
              maxLength: 500
              minLength: 1
              type: string
          required:
            - code
            - detail
          type: object
        phase:
          $ref: '#/components/schemas/DnsConnectionPhase'
        plan:
          items:
            $ref: '#/components/schemas/DnsPlanEntry'
          maxItems: 32
          minItems: 0
          type: array
        provider:
          $ref: '#/components/schemas/DnsProvider'
        zone:
          additionalProperties: false
          properties:
            accountName:
              maxLength: 255
              minLength: 1
              type: string
            name:
              maxLength: 253
              minLength: 1
              type: string
          required:
            - name
            - accountName
          type: object
      required:
        - connectionId
        - provider
        - intent
        - phase
        - createdAt
        - expiresAt
      type: object
