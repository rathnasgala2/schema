              - properties:
                  destinationChanged:
                    const: no
                  failureCode:
                    enum:
                      - NOT_ATTEMPTED_RETRYABLE
                      - RATE_LIMITED
                  outcome:
                    const: failed
                  retryable:
                    const: true
                  stage:
                    const: staging
              - properties:
                  destinationChanged:
                    enum:
                      - unknown
                      - yes
                  failureCode:
                    const: OUTCOME_UNKNOWN_RECONCILING
                  outcome:
                    const: unknown
                  retryable:
                    const: false
                  stage:
                    const: staging
              - properties:
                  destinationChanged:
                    const: no
                  failureCode:
                    enum:
                      - REJECTED
                      - AUTHORIZATION_LOST
                      - PROVIDER_CONTRACT_VIOLATION
                  outcome:
                    const: failed
                  retryable:
                    const: false
                  stage:
                    const: activation
              - properties:
                  destinationChanged:
                    const: no
                  failureCode:
                    enum:
                      - NOT_ATTEMPTED_RETRYABLE
                      - RATE_LIMITED
                  outcome:
                    const: failed
                  retryable:
                    const: true
                  stage:
                    const: activation
              - properties:
                  destinationChanged:
                    enum:
                      - unknown
                      - yes
                  failureCode:
                    const: OUTCOME_UNKNOWN_RECONCILING
                  outcome:
                    const: unknown
                  retryable:
                    const: false
                  stage:
                    const: activation
              - properties:
                  destinationChanged:
                    enum:
                      - no
                      - yes
                  failureCode:
                    enum:
                      - REJECTED
                      - AUTHORIZATION_LOST
                      - PROVIDER_CONTRACT_VIOLATION
                  outcome:
                    const: failed
                  retryable:
                    const: false
                  stage:
                    const: cleanup
              - properties:
                  destinationChanged:
                    enum:
                      - no
                      - yes
                  failureCode:
                    enum:
                      - NOT_ATTEMPTED_RETRYABLE
                      - RATE_LIMITED
                  outcome:
                    const: failed
                  retryable:
                    const: true
                  stage:
                    const: cleanup
              - properties:
                  destinationChanged:
                    enum:
                      - unknown
                      - yes
                  failureCode:
                    const: OUTCOME_UNKNOWN_RECONCILING
                  outcome:
                    const: unknown
                  retryable:
                    const: false
                  stage:
                    const: cleanup
            required:
              - resultDigest
              - failureCode
              - startedAt
              - completedAt
      properties:
        causationId:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/stableId
        completedAt:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/rfc3339
        destinationChanged:
