    HandoverClaim:
      additionalProperties: false
      description:
        One claim link that hands a site to whoever accepts it. Demo-site claims
        appear here too, with proof `YOUTUBE_CHANNEL`.
      properties:
        claimId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        claimUrl:
          description:
            Present only while `state` is `OPEN`, so the owner can copy the link
            again; absent in every other state. It is also absent on an `OPEN`
            claim issued before 3.14.0 whose token the API does not hold sealed,
            until the owner re-issues the claim with `replace`. The link is a
            bearer secret, so anyone who holds it can open the claim page.
          format: uri
          maxLength: 2048
          pattern: ^https://[^\s]+$
          type: string
        claimedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        claimedBy:
          additionalProperties: false
          description: Present only when `state` is `CLAIMED`.
          properties:
            displayName:
              maxLength: 200
              minLength: 1
              type: string
            login:
              description:
                'GitHub login grammar: letters, digits and single hyphens, not
                starting or ending with a hyphen. Absent when the claimant has
                no linked GitHub login.'
              maxLength: 39
              minLength: 1
              pattern: ^[A-Za-z0-9](?:-?[A-Za-z0-9]){0,38}$
              type: string
          required:
            - displayName
          type: object
        createdAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        expiresAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        proof:
          $ref: '#/components/schemas/CreatorClaimProof'
        state:
          $ref: '#/components/schemas/CreatorClaimState'
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - claimId
        - state
        - createdAt
        - expiresAt
        - proof
        - version
      type: object
    HandoverState:
