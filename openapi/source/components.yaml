              maxLength: 2048
              type: string
            servedBucket:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/spacesBucket
            stagingApiOrigin:
              allOf:
                - $ref: ../schemas/deployment-intent.schema.json#/$defs/urlHttps
              maxLength: 2048
              type: string
            stagingBucket:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/spacesBucket
            targetDigest:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
            websiteConfigurationDigest:
              $ref: ../schemas/deployment-intent.schema.json#/$defs/digest
            websiteOrigin:
              allOf:
