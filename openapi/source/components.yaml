    PostWorkloadsGithubReceiptExchangesRequest:
      description:
        Discriminated by the constant `purpose` member every arm already
        carries; the explicit `mapping` names the schema each value binds to so
        OpenAPI Generator 7.25 emits `@JsonSubTypes` entries keyed by the wire
        value instead of by generated class names (API-RECEIPTS-1 follow-up).
      discriminator:
        mapping:
          deployment-intent: '#/components/schemas/ReceiptExchangeDeploymentIntentRequest'
          deployment-receipt: '#/components/schemas/ReceiptExchangeDeploymentReceiptRequest'
        propertyName: purpose
      oneOf:
        - $ref: '#/components/schemas/ReceiptExchangeDeploymentIntentRequest'
        - $ref: '#/components/schemas/ReceiptExchangeDeploymentReceiptRequest'
    PostWorkloadsGithubReceiptExchangesResponse:
      description: |
        Three flat response states, discriminated by the constant `kind` member
        each one carries. `purpose` remains exactly as it was on the wire and
        still separates an intent response from a receipt response; it cannot be
        the discriminator, because its `deployment-receipt` value covers two of
        the three states, and a mapping key must name exactly one schema. The
        previous shape mapped that value onto an intermediate schema with a
        nested `state` discriminator, which OpenAPI Generator 7.25 emits as an
        interface a reader cannot resolve past. `kind` is optional, not
        required, so a 2.7.x-era body still validates against this union -- the
        arms remain mutually exclusive on `purpose` and `state` without it. The
        generator caveat is deliberate: OpenAPI requires a discriminator
        property to be required, and a generated client that reaches this union
        through `kind` alone must tolerate its absence from an older server.
      discriminator:
        mapping:
          deployment-intent: '#/components/schemas/ReceiptExchangeDeploymentIntentResponse'
          deployment-receipt-capability-issued: '#/components/schemas/ReceiptExchangeCapabilityIssuedResponse'
          deployment-receipt-submission-recorded: '#/components/schemas/ReceiptExchangeSubmissionRecordedResponse'
        propertyName: kind
      oneOf:
        - $ref: '#/components/schemas/ReceiptExchangeDeploymentIntentResponse'
        - $ref: '#/components/schemas/ReceiptExchangeCapabilityIssuedResponse'
        - $ref: '#/components/schemas/ReceiptExchangeSubmissionRecordedResponse'
