    PostOrganizationsByOrganizationIdPublicationsByPublicationIdContentChangesPlanRequest:
      additionalProperties: false
      description: |
        Two request shapes, both accepted. The 2.13.0 single-document shape
        (`path`, `contentDigest`, `expectedHead`) plans one document write
        against the exact expected head. The additive batch shape
        (`baseRevision` and at least one of `documents`/`assets`/`appearance`/
        `publicationProfile`)
        plans up to 20 documents and 20 assets -- each `PUT` with its own
        text or bytes and digest, each `DELETE` naming only its path -- and
        optionally one theme selection in one change, against the exact
        expected main-branch head asserted as `baseRevision`. A request
        mixing the two shapes, or a batch request naming none of
        `documents`, `assets`, `appearance` and `publicationProfile`, is
        `422 VALIDATION_FAILED`.
        `appearance` names a catalog theme and a default colour mode, and
        optionally the footer `attribution` (SCHEMA-3.3.0); the server
        writes `gala/appearance.json` (only `theme`, `colorMode.default` and,
        when sent, `attribution` change, every other member is preserved)
        and the `gala.lock.json` `theme` block from its closed theme catalog,
        both in the same change. An `appearance` equal to the current
        selection (theme, default colour mode and, when sent, attribution)
        is `422 VALIDATION_FAILED` pointed at `/appearance`. Document paths
        under `gala/` and `gala.lock.json` remain forbidden.
        `publicationProfile` (SCHEMA-3.12.0) is a further batch member beside
        `appearance`, counting as one of the named members: it edits
        `gala/publication.json` through one planned `PUT` (see
        `ContentChangePublicationProfileEntry`).
        A `PUT` document whose front matter sets or changes `publishAfter`
        (SCHEMA-3.19.0) is refused with `409 STAGGERED_RELEASE_DISABLED` while the
        publication's staggered release is off (`publishingPolicy.staggeredRelease`), and
        with `422 PUBLISH_AFTER_ON_PUBLISHED_POST` when its `status` is not
        `draft`; `errors[].pointer` is `/documents/<path>`.
        Assets are images only (PNG, JPEG, WebP, GIF, AVIF; SVG is refused):
        at most 20 per change, each at most 5 MiB and together at most
        20 MiB, measured on the decoded bytes -- `assets[].bytesBase64` is
        base64 over raw bytes, so what counts is the decoded byte length,
        not this field's text length (documents are unchanged since 2.14.0:
        20 documents, 1 MiB text each).
      properties:
        appearance:
          $ref: '#/components/schemas/ContentChangeAppearanceEntry'
        assets:
          items:
            $ref: '#/components/schemas/ContentChangeAssetEntry'
          maxItems: 20
          type: array
        baseRevision:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        contentDigest:
          pattern: ^sha256:[0-9a-f]{64}$
          type: string
        documents:
          items:
            $ref: '#/components/schemas/ContentChangeDocumentEntry'
          maxItems: 20
          type: array
        expectedHead:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        path:
          maxLength: 512
          minLength: 1
          type: string
        publicationProfile:
          $ref: '#/components/schemas/ContentChangePublicationProfileEntry'
      required: []
      type: object
    PostOrganizationsByOrganizationIdPublicationsByPublicationIdContentChangesPlanResponse:
      additionalProperties: false
      properties:
        changeId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        diffDigest:
