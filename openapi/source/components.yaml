        Exactly one of `summary` or `unreadable` is present on every item the
        server returns from schema 2.15.0 on; a strict validator does not
        enforce this (it would make an older item with neither field, valid
        before 2.15.0, invalid), so a reader checks for both being absent
        defensively.
      properties:
        blobId:
          pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
          type: string
        kind:
          $ref: '#/components/schemas/ContentItemKind'
        path:
          maxLength: 512
          minLength: 1
          pattern: ^(?!/)(?!.*(?:^|/)\.)(?!gala\.lock\.json$)(?:gala/theme-pages/[^\x00-\x1f\x7f\\/]+|(?!gala(?:/|$))[^\x00-\x1f\x7f\\]+)$
          type: string
        size:
          format: int64
          minimum: 0
          type: integer
        summary:
          $ref: '#/components/schemas/ContentInventoryItemSummary'
        unreadable:
          $ref: '#/components/schemas/ContentInventoryItemUnreadable'
      required:
        - path
        - kind
        - blobId
        - size
      type: object
    ContentInventoryItemSummary:
      additionalProperties: false
      description: |
        The header block's own facts about this item, read at inventory time.
        `contentId` is the header's `id`; `status` is the header's `status`
        upper-cased to this contract's enum style. `publishAfter`
        (SCHEMA-3.19.0, optional and nullable) is the header's staggered-release
        date.
      properties:
        contentId:
          $ref: ../schemas/content-frontmatter.schema.json#/$defs/stableId
        createdAt:
          $ref: ../schemas/content-frontmatter.schema.json#/$defs/rfc3339
        language:
          $ref: ../schemas/content-frontmatter.schema.json#/$defs/bcp47
        publishAfter:
          description:
            "SCHEMA-3.19.0: the header's `publishAfter` date (`YYYY-MM-DD`) of a
            draft waiting for staggered release, `null` or absent when the
            header carries none."
          oneOf:
            - $ref: ../schemas/content-frontmatter.schema.json#/$defs/publishAfterDate
            - type: 'null'
        publishedAt:
          $ref: ../schemas/content-frontmatter.schema.json#/$defs/rfc3339
        slug:
          $ref: ../schemas/content-frontmatter.schema.json#/$defs/slug
