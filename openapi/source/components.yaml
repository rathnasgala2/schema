                required:
                  - region
                  - servedBucket
                  - stagingBucket
            required:
              - providerBinding
        - if:
            properties:
              adapterId:
                pattern: ^github-pages$
                type: string
                x-gala-const: github-pages
            required:
              - adapterId
          then:
            properties:
              providerBinding: false
        - if:
            properties:
              adapterId:
                pattern: ^local-directory$
                type: string
                x-gala-const: local-directory
            required:
              - adapterId
          then:
            properties:
              providerBinding: false
      description:
        "Sets the publication's deployment destination adapter and, for
        `do-spaces`, its provider coordinates (SCHEMA-2.10.0, LOCAL-63).
        `github-pages` and `local-directory` forbid `providerBinding`: Pages
        coordinates are always derived from the live repository binding, and
