            the site owner can read the link again from `GET
            .../handover-claims`; once it is VERIFIED or CLAIMED it is gone.'
          format: uri
          maxLength: 2048
          pattern: ^https://[^\s]+$
          type: string
        organizationId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        publicationId:
