                    - rejected
                    - not-attempted-retryable
                    - authorization-lost
                    - rate-limited
                    - provider-contract-violation
            - properties:
                destinationChanged:
                  enum:
                    - unknown
                    - yes
                observationClass:
                  const: request-accepted
                outcome:
                  const: outcome-unknown-reconciling
            - properties:
                destinationChanged:
                  enum:
                    - no
                    - yes
                observationClass:
                  const: provider-state
                outcome:
                  const: succeeded
            - properties:
                destinationChanged:
                  const: no
                observationClass:
                  const: provider-state
                outcome:
                  const: rejected
            - properties:
                destinationChanged:
                  enum:
                    - unknown
                    - yes
                observationClass:
                  const: provider-state
                outcome:
                  const: outcome-unknown-reconciling
            - properties:
                destinationChanged:
                  enum:
                    - no
                    - yes
                    - unknown
                observationClass:
                  const: provider-state
                outcome:
                  const: provider-contract-violation
            - properties:
                destinationChanged:
                  enum:
                    - unknown
                    - yes
                observationClass:
                  const: timeout
                outcome:
                  const: outcome-unknown-reconciling
            - properties:
                destinationChanged:
                  enum:
                    - no
                    - yes
                observationClass:
                  const: provider-error
                outcome:
                  enum:
                    - rejected
                    - not-attempted-retryable
                    - authorization-lost
                    - rate-limited
                    - provider-contract-violation
            - properties:
                destinationChanged:
                  enum:
                    - unknown
                    - yes
                observationClass:
                  const: provider-error
                outcome:
                  const: outcome-unknown-reconciling
        - else:
            not:
              anyOf:
                - required:
                    - generationId
                - required:
                    - observedArtifactDigest
          if:
            properties:
              observationClass:
                const: provider-state
            required:
              - observationClass
        - else:
            not:
              anyOf:
                - required:
                    - providerObjectIdDigest
                - required:
                    - providerVersion
          if:
            properties:
              observationClass:
                enum:
                  - request-accepted
                  - provider-state
                  - provider-error
            required:
              - observationClass
      properties:
        destinationChanged:
          enum:
            - yes
            - no
            - unknown
          type: string
        evidenceDigest:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/digest
        generationId:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/stableId
        kernelSequence:
          maximum: 100
          minimum: 1
          type: integer
        observationClass:
          enum:
            - request-not-started
            - request-accepted
            - provider-state
            - timeout
            - provider-error
          type: string
        observationId:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/stableId
        observedArtifactDigest:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/digest
        observedAt:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/rfc3339
        outcome:
          enum:
            - succeeded
            - rejected
            - not-attempted-retryable
            - outcome-unknown-reconciling
            - authorization-lost
            - rate-limited
            - provider-contract-violation
          type: string
        providerObjectIdDigest:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/digest
        providerVersion:
          maxLength: 80
          minLength: 1
          pattern: ^[\x20-\x7e]+$
          type: string
        stageAttemptId:
          $ref: ../schemas/deployment-receipt.schema.json#/$defs/stableId
      required:
        - observationId
        - stageAttemptId
        - kernelSequence
        - observationClass
        - outcome
        - destinationChanged
        - observedAt
        - evidenceDigest
      type: object
    ManagedDeploymentOperationResponse:
