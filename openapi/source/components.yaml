    DomainBindingState:
      description:
        '`REQUESTED` -> `RESERVED` -> `OWNERSHIP_PENDING` (waiting for DNS) ->
        `CERTIFICATE_PENDING` (GitHub issues the certificate, up to 24 hours) ->
        `ROUTING_PENDING` -> `ACTIVE`; `ACTIVE` <-> `DEGRADED`; `DETACHING` ->
        `DETACHED`; `EXPIRED` (DNS never verified within 7 days); `BLOCKED`
        (GitHub refused the certificate or it timed out; `nextStep` says what to
        do).'
      enum:
        - REQUESTED
        - RESERVED
        - OWNERSHIP_PENDING
        - CERTIFICATE_PENDING
        - ROUTING_PENDING
        - ACTIVE
        - DEGRADED
        - DETACHING
        - DETACHED
        - EXPIRED
        - BLOCKED
      type: string
    DomainKind:
      description:
        '`APEX` when the hostname is its own registrable domain (A and AAAA
        records); otherwise `SUBDOMAIN` (one CNAME).'
      enum:
        - SUBDOMAIN
        - APEX
      type: string
    DomainDnsRecord:
      additionalProperties: false
      properties:
        name:
          description:
            The record name to create at the registrar, relative to the zone
            (`@` for the apex).
          maxLength: 253
          minLength: 1
          type: string
        type:
          enum:
            - CNAME
            - A
            - AAAA
          type: string
        value:
          maxLength: 253
          minLength: 1
          type: string
      required:
        - type
        - name
        - value
      type: object
    DomainDnsObservation:
      additionalProperties: false
      description:
        What Galascribe saw in public DNS at `checkedAt` (absent before the
        first check).
      properties:
        addresses:
          items:
            maxLength: 45
            minLength: 1
            type: string
          maxItems: 16
          minItems: 0
          type: array
        checkedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        cnameTarget:
          maxLength: 253
          minLength: 1
          type: string
        pointsToGithub:
          description:
            True when the hostname resolves to GitHub Pages. It stays false
            while the binding is proxied, because the name then resolves to the
            provider's proxy; `viaProxy` carries that case.
          type: boolean
        resolves:
          type: boolean
        viaProxy:
          description:
            True when the hostname resolves to the provider's proxy rather than
            to GitHub and the binding is proxied (`proxy` is present); the
            routing probe is then the proof of life (SCHEMA-3.6.0). Absent when
            the binding is not proxied.
          type: boolean
      required:
        - resolves
        - pointsToGithub
        - addresses
      type: object
