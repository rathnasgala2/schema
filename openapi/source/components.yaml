        destination:
          $ref: '#/components/schemas/PublicationTransferParty'
        expiresAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        initiatedBy:
          $ref: '#/components/schemas/SiteActor'
        publication:
          $ref: '#/components/schemas/PublicationTransferPublication'
        reasonCode:
          maxLength: 80
          minLength: 1
          type: string
        source:
          $ref: '#/components/schemas/PublicationTransferParty'
        state:
          $ref: '#/components/schemas/PublicationTransferState'
        transferId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - transferId
        - version
        - state
        - publication
        - source
        - destination
        - initiatedBy
        - checks
        - consequences
        - consequenceDigest
        - expiresAt
        - createdAt
      type: object
