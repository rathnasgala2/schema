      additionalProperties: false
      description:
        One admin API key as listed. The secret is never returned again after
        creation.
      properties:
        apiKeyId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        createdAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        createdBy:
          description: The operator the key acts as.
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        expiresAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        lastUsedAt:
          oneOf:
            - $ref: ../schemas/problem.schema.json#/$defs/rfc3339
            - type: 'null'
        name:
          maxLength: 80
          minLength: 1
          type: string
        prefix:
          $ref: '#/components/schemas/PlatformApiKeyPrefix'
        revokedAt:
          oneOf:
            - $ref: ../schemas/problem.schema.json#/$defs/rfc3339
            - type: 'null'
        scopes:
          items:
            $ref: '#/components/schemas/PlatformApiKeyScope'
          maxItems: 4
          minItems: 1
          type: array
          uniqueItems: true
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - apiKeyId
        - name
        - scopes
        - prefix
        - createdBy
        - createdAt
        - expiresAt
        - lastUsedAt
        - revokedAt
        - version
      type: object
    PlatformApiKeyPrefix:
      description:
        Eight Crockford base32 characters; unique, shown in lists and in the key
        itself.
      maxLength: 8
      minLength: 8
      pattern: ^[0-9A-HJKMNP-TV-Z]{8}$
      type: string
    PlatformApiKeyScope:
      description:
        What an admin API key may do. Each scope names a closed set of
        operations through `x-gala-api-key-scope`; an operation without that
        extension is never callable with a key.
      enum:
        - read
        - demo:setup
        - content:write
        - publish
      type: string
    PlatformSetting:
      additionalProperties: false
      description:
        'An app-wide setting: the active release value, or the default when none
        is released.'
      properties:
        allowedValues:
          description:
            The allowlist for a string setting; absent for an integer setting.
          items:
            maxLength: 128
            minLength: 1
            type: string
          maxItems: 100
          type: array
        defaultValue:
          $ref: '#/components/schemas/PlatformSettingValue'
        key:
          $ref: '#/components/schemas/PlatformSettingKey'
        maximum:
          description: Inclusive upper bound of an integer setting.
          format: int64
          type: integer
        minimum:
          description: Inclusive lower bound of an integer setting.
          format: int64
          type: integer
        updatedAt:
          oneOf:
            - $ref: ../schemas/problem.schema.json#/$defs/rfc3339
            - type: 'null'
        value:
          $ref: '#/components/schemas/PlatformSettingValue'
        valueType:
          enum:
            - INTEGER
            - STRING
          type: string
        version:
          description:
            'The release version: send it back in `If-Match` as `"<version>"`.'
          format: int64
          minimum: 0
          type: integer
      required:
        - key
        - valueType
        - value
        - defaultValue
        - version
        - updatedAt
      type: object
    PlatformSettingKey:
      description:
        A setting key such as `youtube.monthlyImportLimit` or
        `article.generationModel`. The server answers `404 SETTING_UNKNOWN` for
        a key it does not define.
      maxLength: 64
      minLength: 3
      pattern: ^[a-z][A-Za-z0-9]*(?:\.[A-Za-z0-9]+){1,3}$
      type: string
    PlatformSettingOverride:
      additionalProperties: false
      description: A per-person or per-organisation override of one setting.
      properties:
        createdAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        key:
          $ref: '#/components/schemas/PlatformSettingKey'
        reason:
          $ref: '#/components/schemas/PlatformOperatorReasonCode'
        subjectId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        subjectKind:
          $ref: '#/components/schemas/PlatformSettingOverrideKind'
        updatedAt:
          $ref: ../schemas/problem.schema.json#/$defs/rfc3339
        updatedByPersonId:
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          type: string
        value:
          $ref: '#/components/schemas/PlatformSettingValue'
        version:
          format: int64
          minimum: 0
          type: integer
      required:
        - subjectKind
        - subjectId
        - key
        - value
        - reason
        - updatedByPersonId
        - createdAt
        - updatedAt
        - version
      type: object
    PlatformSettingOverrideKind:
      description: Whom an override applies to.
      enum:
        - PERSON
        - ORGANIZATION
      type: string
    PlatformSettingValue:
      description:
        'A setting value: an integer or a short string, as the key defines.'
      oneOf:
        - format: int64
          type: integer
        - maxLength: 128
          minLength: 1
          type: string
    PostClaimsByTokenAcceptResponse:
