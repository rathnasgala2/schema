    AppearanceColorMode:
      enum:
        - light
        - dark
        - system
      type: string
    AppearanceThemeId:
      description: |
        The closed catalog of themes the server can select. `default` names
        `@rathnasgala2/theme-default`, `amaze` names
        `@rathnasgala2/theme-amaze`, `editorial` names
        `@rathnasgala2/theme-editorial`, and so on.
      enum:
        - default
        - amaze
        - editorial
        - flashy
        - minimal
        - zebra
      type: string
    ContentChangeAppearanceEntry:
      additionalProperties: false
      description: |
        The theme selection inside a batch `content-changes:plan` request.
        `themeId` and `colorModeDefault` are required; send the current
        values to change only `attribution`. `attribution` (SCHEMA-3.3.0) is
        optional: when present the server writes it as
        `gala/appearance.json`'s `attribution`; when absent the file's
        `attribution` is preserved unchanged. `tokens` (SCHEMA-3.10.0) is
        optional: the author's publication palette, written as
        `gala/appearance.json`'s `tokens`; when absent the file's `tokens`
        are preserved unchanged, and `{}` resets to the theme's own colours.
        `brandMark` (SCHEMA-3.12.0) is optional: a repository-relative path
        under `assets/brand/`, written as `gala/appearance.json`'s
        `brandMark` (the site icon); `null` clears it and an absent member
        preserves the file's value. The App uploads the image file as an
        ordinary `assets[]` entry in the same plan.
      properties:
        attribution:
          $ref: ../schemas/appearance.schema.json#/$defs/attribution
        brandMark:
          oneOf:
            - allOf:
                - $ref: ../schemas/appearance.schema.json#/$defs/repoRelativePath
                - pattern: ^assets/brand/
            - type: 'null'
        colorModeDefault:
          $ref: '#/components/schemas/AppearanceColorMode'
        themeId:
          $ref: '#/components/schemas/AppearanceThemeId'
        tokens:
          $ref: ../schemas/appearance.schema.json#/$defs/semanticTokens
      required:
        - themeId
        - colorModeDefault
      type: object
    ContentChangePublicationProfileEntry:
      additionalProperties: false
      description: |
        SCHEMA-3.12.0: site-level settings inside a batch
        `content-changes:plan` request, the same lifecycle and capability as
        `appearance` (a pending change that goes live on Publish). The
        server loads `gala/publication.json` at `baseRevision`, applies the
        members that are present, validates the result against
        `publication.schema.json`, and plans one `PUT` of
        `gala/publication.json`. An absent member is preserved. `null`
        resets `description` to the publication title (the file requires a
        description); `null` clears `defaultImageRef` and `crawlers`.
        `title`, `defaultLanguage` and `socialLinks` cannot be cleared.
        `socialLinks` (max 32, the publication file's own limit) replaces
        the whole list. `canonicalBase` is never client-settable: it changes
        only through domain attach and detach. A profile that changes nothing is
        `422 VALIDATION_FAILED` pointed at `/publicationProfile`; member
        failures point at `/publicationProfile/<member>`.
      properties:
        crawlers:
          oneOf:
            - $ref: ../schemas/publication.schema.json#/$defs/crawlers
            - type: 'null'
        defaultImageRef:
          oneOf:
            - allOf:
                - $ref: ../schemas/publication.schema.json#/$defs/repoRelativePath
                - pattern: ^assets/brand/
            - type: 'null'
        defaultLanguage:
          $ref: ../schemas/publication.schema.json#/$defs/bcp47
        description:
          oneOf:
            - $ref: ../schemas/publication.schema.json#/$defs/plainText
              x-gala-graphemeLength:
                maximum: 300
                minimum: 1
            - type: 'null'
        socialLinks:
          items:
            $ref: ../schemas/publication.schema.json#/$defs/socialLink
          maxItems: 32
          type: array
        title:
          $ref: ../schemas/publication.schema.json#/$defs/plainText
          x-gala-graphemeLength:
            maximum: 120
            minimum: 1
      type: object
    PublicationAppearanceBuilt:
      additionalProperties: false
      description: |
        From the `theme` block of `gala.lock.json`, the sole authority for the
        theme a build uses. `themeId` is `null` when the locked package is not
        in the catalog.
      properties:
        themePackage:
          maxLength: 214
          minLength: 1
          type: string
        themeId:
          oneOf:
            - $ref: '#/components/schemas/AppearanceThemeId'
            - type: 'null'
        version:
          maxLength: 256
          minLength: 1
