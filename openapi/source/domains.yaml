  /v2/organizations/{organizationId}/publications/{publicationId}/domains:check-galascribe-address:
    post:
      description: |
        Needs `publication.settings.manage`. Asks whether `label` can become this
        site's `label.galascribe.com` address, without reserving it. Always
        `200`: `available` is true, or `reason` says why not. `INVALID`: not a
        usable label (3 to 63 lowercase letters, digits and hyphens, not starting
        or ending with a hyphen). `RESERVED`: a name Galascribe keeps for itself.
        `TAKEN`: another site has it or something already exists at that name.
        `PLAN_REQUIRED`: the organization's plan has no Galascribe address.
        `NOT_CONFIGURED`: Galascribe addresses are not set up on this deployment.
        `ALREADY_HAS_DOMAIN`: the site already has a domain that is not detached.
        `hostname` is the full address when the label is well formed.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdDomainsCheckGalascribeAddress
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  label: maya
            schema:
              $ref:
                "#/components/schemas/PostOrganizationsByOrganizationIdPublicationsByPubl\
                icationIdDomainsCheckGalascribeAddressRequest"
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
