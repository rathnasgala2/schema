    post:
      description: |
        Reserves `hostname` for this publication and returns the DNS records to
        add (`OWNERSHIP_PENDING`). The hostname is lower-cased and IDNA-encoded;
        wildcards, `*.github.io` and public suffixes are refused (`422
        HOSTNAME_INVALID`). `409 HOSTNAME_RESERVED` when another publication
        holds or recently released it; `409 DOMAIN_EXISTS` when this publication
        already has a domain that is not detached or expired; `409
        PAGES_NOT_AVAILABLE` when the repository has no GitHub Pages site.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdDomains
      parameters:
