  /v2/organizations/{organizationId}/publications/{publicationId}/domains:claim-galascribe-address:
    post:
      description: |
        Needs `publication.settings.manage`. Makes `label.galascribe.com` this
        site's custom domain. Galascribe owns the DNS records, so the returned
        `DomainBinding` carries `galascribeManaged` and the person is never asked
        to add records; the binding then follows the usual domain steps (Pages
        domain, certificate, base move). `409 PLAN_REQUIRED` when the plan has no
        Galascribe address; `409 INVALID_SOURCE_STATE` when the site already has a
        domain that is not detached; `422 VALIDATION_FAILED` pointed at `/label`
        when the label is `INVALID`, `RESERVED` or `TAKEN` (the reasons of the check
        read, which tells a client which one); `503 CAPABILITY_UNAVAILABLE` when
        Galascribe addresses are not configured.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdDomainsClaimGalascribeAddress
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
