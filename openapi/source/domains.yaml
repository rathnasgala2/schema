  /v2/organizations/{organizationId}/publications/{publicationId}/domain-registrations:
    post:
      description: |
        Needs `publication.settings.manage`. Registers `domainName` for the
        organization as its one included domain and attaches it to this site.
        Galascribe re-checks the name, registers it with `registrant` as the
        domain's owner, then writes the DNS records and attaches the domain, so the
        person adds no records. The answer is `202` with a `DomainRegistration`
        that moves through its `state` while the work runs; read it again to follow
        it. `registrant` is sent to the registrar and is never stored, logged or
        returned. `409 PLAN_REQUIRED` when the plan has no included domain;
        `409 INVALID_SOURCE_STATE` when the organization already used its included
        domain; `422 VALIDATION_FAILED` for a name or registrant field that is not
        valid; `503 CAPABILITY_UNAVAILABLE` when registration is not set up.
