  /v2/organizations/{organizationId}/publications/{publicationId}/domain-registrations:check:
    post:
      description: |
        Needs `publication.settings.manage`. Asks whether `name` can be registered
        for the organization as its included domain, without registering it. Always
        `200`: `registrable` is true, or `reason` says why not. `UNAVAILABLE`:
        already registered. `EXTENSION_NOT_SUPPORTED`: Galascribe cannot register
        that ending. `PREMIUM`: a premium name, which the included domain does
        not cover. `OVER_PRICE_CAP`: its first-year price is above what the
        included domain covers. `INVALID_NAME`: not a usable domain name.
        `PLAN_REQUIRED`: the plan has no included domain. `ALREADY_USED`: the
        organization already used its included domain. `NOT_CONFIGURED`:
        registration is not set up on this deployment. The response carries no
        price: the domain is included in the plan.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdDomainRegistrationsCheck
