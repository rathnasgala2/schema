  /v2/organizations/{organizationId}/publications/{publicationId}/domains/{domainId}/dns-connections:
    post:
      description: >
        Starts a connection to the person's DNS provider so Galascribe can add
        (`ADD`) or remove (`REMOVE`) the domain's DNS records there, and returns
        the provider's consent address (`authorizationUrl`); the App navigates
        the whole page to it. The provider sends the person back to the Domain
        page, where `GET .../dns-connections/{connectionId}` says what happened.
        Only offered when `dns.providers` on the binding lists the provider and
        the intent. `409 DNS_CONNECTION_NOT_APPLICABLE` when the binding's state
        has no records to add or remove; `503 DNS_PROVIDER_NOT_CONFIGURED` when
        this environment has no connection to that provider; `429 RATE_LIMITED`
        after one start per domain per minute. The connection is valid until
        `expiresAt`.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdDomainsByDomainIdDnsConnections
