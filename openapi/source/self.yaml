        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    state: NONE
              schema:
                $ref: '#/components/schemas/PostSelfClosureCancelResponse'
          description: keep my account succeeded
