  /v2/self/closure:
    get:
      description: |
        `NONE` when no closure is pending. While `CLOSING`, `fenceAt` is when
        the account closes and `consequences` are the ones the request
        acknowledged (SCHEMA-3.3.0 shape).
      operationId: getSelfClosure
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    closureId: 018f0000-0000-7000-8000-000000000001
                    consequences:
                      - code: personal-organization-retired
                        detail:
                          Maya and its sites are retired in Galascribe; the
                          repositories and published sites stay on GitHub.
                        organizationId: 018f0000-0000-7000-8000-000000000001
                        reversible: false
                      - code: comments-anonymized
                        detail:
                          Your comments stay, attributed to "Former reader".
                        reversible: false
                    fenceAt: 2026-10-16T12:00:00.000Z
                    state: CLOSING
                    version: 0
              schema:
                $ref: '#/components/schemas/GetSelfClosureResponse'
          description: read my account closure succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          content:
            application/problem+json:
