        `destinationOrganizationSlug` for an organization where the caller is a
        member -- and returns the checks Galascribe ran and the consequences of
        the move, persisted for `POST .../transfers` to quote back. Failed
        checks are data here, not problems. `404 DESTINATION_NOT_FOUND` for an
        organization the caller cannot see (non-enumerating); `409
        TRANSFER_PENDING` when a transfer is already pending. Consequence codes:
