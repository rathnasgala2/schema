  /v2/organizations/{organizationId}/publication-transfers/{transferId}:accept:
    post:
      description: |
        The destination organization accepts a pending transfer addressed to it.
        Step-up required. Every check runs again (capacity is reserved
        atomically); `409 TRANSFER_CHECK_FAILED` with one `errors[]` entry per
        failed check (`pointer` `/checks/<code>`). On success the transfer is
        `ACCEPTED` and the move is applied in the background, then `COMPLETED`:
        the publication lists under this organization with the same address and
        history. `409 CONSEQUENCE_DIGEST_MISMATCH` when `consequenceDigest` is
        not the transfer's; `409 TRANSFER_NOT_PENDING` once settled or expired.
      operationId: postOrganizationsByOrganizationIdPublicationTransfersByTransferIdAccept
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
