  /v2/self/notifications:
    get:
      description:
        The inbox, newest first, one keyset page at a time. `unreadOnly` keeps
        only rows whose `readAt` is null. `unreadCount` is the total number of
        unread rows, not the number on the page. Rows are kept 90 days.
      operationId: getSelfNotifications
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - example: false
          in: query
          name: unreadOnly
          required: false
          schema:
            default: false
            type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    items:
                      - category: comments
                        createdAt: '2026-10-27T12:00:00.000Z'
                        excerpt: Great article.
                        id: 018f0000-0000-7000-8000-000000000001
                        kind: comment-created
                        publication:
                          id: 018f0000-0000-7000-8000-000000000001
                          title: Example Blog
                        readAt: null
                        target:
                          kind: comments
                          url: /sites/018f0000-0000-7000-8000-000000000001/018f0000-0000-7000-8000-000000000001/comments
                        title: New comment on Hello world
                      - category: following
                        createdAt: '2026-10-27T12:00:00.000Z'
                        excerpt: null
                        id: 018f0000-0000-7000-8000-000000000002
                        kind: following-post
                        publication:
                          id: 018f0000-0000-7000-8000-000000000001
                          title: Example Blog
                        readAt: null
                        target:
                          kind: site
                          url: https://blog.example.com/hello-world/
                        title: New post - Hello world
                    nextCursor: null
                    unreadCount: 2
              schema:
                $ref: '#/components/schemas/GetSelfNotificationsResponse'
          description: list the signed-in person's notifications succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
      security:
        - browserSession: []
      summary: list the signed-in person's notifications
      tags:
        - notifications
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: principal-epoch
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
