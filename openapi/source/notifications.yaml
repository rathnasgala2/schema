  /v2/self/notifications:mark-read:
    post:
      description:
        "Send exactly one of `ids` (up to 100 notification ids) or `all: true`.
        An id that is not one of the caller's own rows is ignored without an
        error, so the call cannot be used to probe other people's rows. Marking
        an already-read row changes nothing. The answer carries the unread count
        after the change."
      operationId: postSelfNotificationsMarkRead
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  ids:
                    - 018f0000-0000-7000-8000-000000000001
            schema:
              $ref: '#/components/schemas/PostSelfNotificationsMarkReadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    unreadCount: 0
              schema:
                $ref: '#/components/schemas/PostSelfNotificationsMarkReadResponse'
          description: mark notifications as read succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
