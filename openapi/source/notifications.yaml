paths:
  /v2/public/notification-unsubscribes/{token}:
    post:
      description:
        RFC 8058 one-click unsubscribe. The `token` is the capability carried in
        the `List-Unsubscribe` header of one notification email; it names one
        person and one category and needs no session. The call turns that
        category's email off (cadence `off`) and answers the category. A mail
        provider's one-click POST arrives with an
        `application/x-www-form-urlencoded` body `List-Unsubscribe=One-Click`;
        the body is ignored, so no content type is declared. Repeating the call
        changes nothing. An unknown or revoked token is `404
        RESOURCE_NOT_FOUND`.
      operationId: postPublicNotificationUnsubscribesByToken
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: examplexxxxxxxxxxxxxxxxxxxxxxxxx
          in: path
          name: token
          required: true
          schema:
            maxLength: 256
            minLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    category: following
              schema:
                $ref: '#/components/schemas/PostPublicNotificationUnsubscribesByTokenResponse'
          description:
            turn one notification category off by its email unsubscribe link
            succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '429':
          content:
            application/problem+json:
              examples:
                RATE_LIMITED:
                  summary: RATE_LIMITED
                  value:
                    code: RATE_LIMITED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: true
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 429
                    title: RATE_LIMITED
                    type: urn:gala:problem:rate-limited
              schema:
                $ref: '#/components/schemas/Problem'
          description: RATE_LIMITED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - RATE_LIMITED
      security: []
      summary: turn one notification category off by its email unsubscribe link
      tags:
        - notifications
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: none
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose:
        turn one notification category off by its email unsubscribe link
      x-gala-reachable-problems:
        - RATE_LIMITED
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
      x-gala-replay-identity: natural-idempotent-state
      x-gala-state-guards:
        - NONE
      x-gala-success-category: protocol
      x-gala-tenant-scope: NONE
  /v2/self/notification-preferences:
    get:
      description:
        Always lists all six categories. A category the person never chose reads
        with its default cadence (see `NotificationCategory`).
      operationId: getSelfNotificationPreferences
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    categories:
                      - cadence: daily
                        category: comments
                      - cadence: instant
                        category: messages
                      - cadence: instant
                        category: publishing
                      - cadence: daily
                        category: audience
                      - cadence: instant
                        category: replies
                      - cadence: daily
                        category: following
                    emailAvailable: true
                    timeZone: Europe/London
              schema:
                $ref: '#/components/schemas/GetSelfNotificationPreferencesResponse'
          description:
            read the signed-in person's notification email preferences succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
      security:
        - browserSession: []
      summary: read the signed-in person's notification email preferences
      tags:
        - notifications
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: principal-epoch
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: read the signed-in person's notification email preferences
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
      x-gala-replay-identity: safe-query
      x-gala-state-guards:
        - NONE
      x-gala-success-category: query
      x-gala-tenant-scope: NONE
    put:
      description:
        "Replaces every category's cadence and the digest time zone. Every
        notification email carries an RFC 8058 one-click unsubscribe link that
        turns one category off through `POST
        /v2/public/notification-unsubscribes/{token}`; this write is how the
        person turns it back on. Saving a cadence other than `off` while
        `emailAvailable` is false is accepted and takes effect once a contact
        email is on file. `emailAvailable` is read-only and is not a request
        member: send only `timeZone` and `categories`."
      operationId: putSelfNotificationPreferences
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  categories:
                    - cadence: daily
                      category: comments
                    - cadence: instant
                      category: messages
                    - cadence: instant
                      category: publishing
                    - cadence: daily
                      category: audience
                    - cadence: instant
                      category: replies
                    - cadence: daily
                      category: following
                  timeZone: Europe/London
            schema:
              $ref: '#/components/schemas/PutSelfNotificationPreferencesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    categories:
                      - cadence: daily
                        category: comments
                      - cadence: instant
                        category: messages
                      - cadence: instant
                        category: publishing
                      - cadence: daily
                        category: audience
                      - cadence: instant
                        category: replies
                      - cadence: daily
                        category: following
                    emailAvailable: true
                    timeZone: Europe/London
              schema:
                $ref: '#/components/schemas/PutSelfNotificationPreferencesResponse'
          description:
            replace the signed-in person's notification email preferences
            succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
      security:
        - browserSession: []
      summary: replace the signed-in person's notification email preferences
      tags:
        - notifications
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: null
      x-gala-concurrency: principal-epoch
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose:
        replace the signed-in person's notification email preferences
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - REQUEST_FIELD_UNKNOWN
        - VALIDATION_FAILED
      x-gala-replay-identity: natural-idempotent-state
