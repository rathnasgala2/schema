  /v2/platform/today-exclusions:
    get:
      description:
        Operators only. Every site an operator excluded from Today, newest
        first, with the reason on record.
      operationId: getPlatformTodayExclusions
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: list the sites excluded from Today succeeded
          headers:
            Cache-Control: *a2
            X-Correlation-Id: *a3
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    items:
                      - &a6
                        excludedAt: 2026-11-06T07:00:00.000Z
                        excludedBy: 018f0000-0000-7000-8000-000000000003
                        publicationId: 018f0000-0000-7000-8000-000000000002
                        reason: Repeated spam posts.
              schema:
                $ref: '#/components/schemas/GetPlatformTodayExclusionsResponse'
        '401':
          $ref: '#/components/responses/PlatformAuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
      security:
        - browserSession: []
      summary: list the sites excluded from Today
      tags:
        - today
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: platform.today.view
      x-gala-concurrency: none
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: list the sites excluded from Today
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - AUTHORIZATION_DENIED
        - REAUTH_REQUIRED
      x-gala-replay-identity: safe-query
      x-gala-state-guards:
        - NONE
      x-gala-success-category: query
      x-gala-tenant-scope: NONE
    post:
      description:
        Operators only. Removes the site from every drop computed from now on
        and records the reason; audited. Excluding an already excluded site
        answers the existing exclusion.
      operationId: postPlatformTodayExclusions
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal request
                value:
                  publicationId: 018f0000-0000-7000-8000-000000000002
                  reason: Repeated spam posts.
            schema:
              $ref: '#/components/schemas/PostPlatformTodayExclusionsRequest'
        required: true
      responses:
        '201':
          description: exclude a site from Today succeeded
          headers:
            Cache-Control: *a2
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-Id: *a3
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value: *a6
              schema:
                $ref: '#/components/schemas/PostPlatformTodayExclusionsResponse'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/PlatformAuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/CommandReplayConflict'
      security:
        - browserSession: []
      summary: exclude a site from Today
      tags:
        - today
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: platform.today.manage
      x-gala-concurrency: none
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: exclude a site from Today
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - AUTHORIZATION_DENIED
        - COMMAND_REPLAY_CONFLICT
        - REAUTH_REQUIRED
        - REQUEST_FIELD_UNKNOWN
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
