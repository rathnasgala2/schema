      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - &a4
          example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema: &a1
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - &a5
          example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema: *a1
      responses:
        '200':
          description: read the site's Today settings succeeded
          headers:
            Cache-Control: &a2
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id: &a3
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    included: true
                    topicIds:
                      - startups
              schema:
                $ref: '#/components/schemas/GetOrganizationsByOrganizationIdPublicationsByPublicationIdTodaySettingsResponse'
