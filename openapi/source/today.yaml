      x-gala-success-category: create
      x-gala-tenant-scope: NONE
  /v2/platform/today-exclusions/{publicationId}:
    delete:
      description:
        Operators only. Ends the exclusion; the site is eligible again from the
        next drop. Audited. `404 RESOURCE_NOT_FOUND` when the site is not
        excluded.
      operationId: deletePlatformTodayExclusionsByPublicationId
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000002
          in: path
          name: publicationId
          required: true
          schema: *a1
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: let a site back into Today succeeded
          headers:
            Cache-Control: *a2
            X-Correlation-Id: *a3
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/PlatformAuthenticationRequired'
        '403':
