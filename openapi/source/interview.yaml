  /v2/organizations/{organizationId}/publications/{publicationId}/interviews/{interviewId}/decisions:
    post:
      description: >
        Applies the author's decision on one open point of the draft: the chosen
        option in the passage's place (`APPLY`), their own words (`CUSTOM`; an
        empty text cuts the passage) or nothing (`DISMISS`). Every other open
        point whose passage is no longer in the draft becomes `STALE`. The
        author's own words are read back once by a small model, and when no
        point is left the draft gets one final read that may add up to three
        more points (at most twice per interview). Only while `DRAFT_READY`;
        `409 INTERVIEW_STATE_CONFLICT` otherwise, and for a point that is no
        longer open. An unknown point is `400 VALIDATION_FAILED` (`/pointId`).
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdInterviewsByInterviewIdDecisions
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - *a3
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    capture: *a1
                    createdAt: 2026-11-04T12:00:00.000Z
                    draft: *a9
