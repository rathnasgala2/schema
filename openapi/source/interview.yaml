                    points:
                      - id: p1
                        issue: The reader has to guess which step is meant.
                        kind: EDIT
                        options:
                          - The first step to go was the account-type step,
                            which asked new users what kind of company they
                            were.
                          - The account-type step went first.
                        quote: The first step to go was the account type.
                        reviewer: CLARITY_EDITOR
                        severity: MEDIUM
                        state: APPLIED
                    progress: *a6
                    publicationId: 018f0000-0000-7000-8000-000000000002
                    readiness:
                      finalReads: 1
                      open: 0
                      ready: true
                    review: *a10
                    startedAt: 2026-11-04T12:00:00.000Z
                    state: DRAFT_READY
                    turns: *a7
                    updatedAt: 2026-11-04T12:00:00.000Z
                    working:
                      body: |-
                        We cut onboarding from nine steps to four.

                        The account-type step went first.
                      description: How cutting onboarding steps doubled signups.
                      language: en
                      title: Nine steps to four
                      tldr: Fewer steps, twice the signups.
              schema:
