paths:
  /v2/organizations/{organizationId}/publications/{publicationId}/interview-policy:
    get:
      description: >
        Whether Interview is available to this publication (`enabled`), whether
        the plan includes it (`plan.allowed`: the plan must be `PRO`, sold as
        Basic, or above), how many interviews are left this period (the UTC week
        starting Monday) and whether the platform's optional monthly spend cap
        still has room. `enabled: false` means the feature is off; the editor
        says so and stays usable.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdInterviewPolicy
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    budget:
                      available: true
                    enabled: true
                    plan:
                      allowed: true
                      requiredTier: PRO
                    quota:
                      limit: 5
                      period: 2026-11-02
                      remaining: 2
                      renewsAt: 2026-11-09T00:00:00Z
                      used: 3
                    editorQuota:
                      limit: 2
                      period: 2026-11-02
                      remaining: 2
                      renewsAt: 2026-11-09T00:00:00Z
                      used: 0
                basic:
                  summary: A Basic site
                  value:
                    budget:
                      available: true
                    enabled: true
                    plan:
                      allowed: true
                      requiredTier: PRO
                    quota:
                      limit: 2
                      period: 2026-11-02
                      remaining: 1
                      renewsAt: 2026-11-09T00:00:00Z
                      used: 1
                    editorQuota:
                      limit: 2
                      period: 2026-11-02
                      remaining: 2
                      renewsAt: 2026-11-09T00:00:00Z
                      used: 0
              schema:
