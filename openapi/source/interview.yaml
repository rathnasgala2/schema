  /v2/organizations/{organizationId}/publications/{publicationId}/interviews/{interviewId}:start:
    post:
      description: >
        Reserves one unit of the organization's weekly allowance (the UTC week
        starting Monday; 2 on Basic, 5 on Pro by default) and asks the first
        question. Only from `CAPTURED`. `429 QUOTA_EXHAUSTED` with `Retry-After`
        when no unit is left this period; `503 BUDGET_EXHAUSTED` when the
        platform's optional monthly spend cap is reached; `503
        PROVIDER_UNAVAILABLE` when the question could not be asked (nothing is
        stored and no unit is used; retry). SCHEMA-3.49.0: an `ARTICLE` room has
        no question stage. It spends an `EDITOR` unit (the `editorQuota`
