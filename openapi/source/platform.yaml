  /v2/platform/settings/{key}:
    get:
      description: |
        Operators only. Returns the app-wide setting: the active release value, else the default. `version` is the release version: send it back in `If-Match` as `"<version>"` on `PUT`. `404 SETTING_UNKNOWN` for a key the server does not define.
      operationId: getPlatformSettingsByKey
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: youtube.monthlyImportLimit
          in: path
          name: key
          required: true
          schema:
            $ref: '#/components/schemas/PlatformSettingKey'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    defaultValue: 10
                    key: youtube.monthlyImportLimit
                    maximum: 1000
                    minimum: 0
                    updatedAt: '2026-10-16T12:00:00.000Z'
