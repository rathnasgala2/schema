                  summary: Nominal successful response
                  value:
                    claimUrl: https://app.galascribe.com/claim/abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
                    organizationId: 018f0000-0000-7000-8000-000000000001
                    publicationId: 018f0000-0000-7000-8000-000000000001
                    repositoryFullName: rathnasdemo/maya-cooks
