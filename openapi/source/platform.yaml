  /v2/platform/demo-sites:
    post:
      description: |
        Operators only. Starts the resumable set-up of a demo site: a single-person organisation owned by the operator, the publication, the repository `<installationLogin>/<slug>` from the template, bind, set-up and first publish, likes and comments on, the demo record and a creator claim. `author` is written by the set-up personalizer and is the only chance to set it, because no API edits `gala/authors/*.json` afterwards. `description` is the publication description (the site tagline in the preview notice). `202` returns the identifiers and the claim link, which appears only in this response; `GET .../demo-sites/{publicationId}` reports progress. `409 DEMO_SLUG_TAKEN` for a slug in use or ever transferred out; `409 GITHUB_LINK_UNUSABLE` when the operator's GitHub link cannot create the repository.
      operationId: postPlatformDemoSites
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  author:
                    biography: Maya cooks one pot meals and films them.
                    displayName: Maya Chen
                  channel:
                    handle: '@mayacooks'
                    id: UCaaaaaaaaaaaaaaaaaaaaaa
                    name: Maya Cooks
                    url: https://www.youtube.com/@mayacooks
                  description: Articles from Maya Cooks's YouTube videos.
                  installationLogin: rathnasdemo
                  organizationName: Maya Cooks
                  siteName: Maya Cooks
                  slug: maya-cooks
            schema:
              $ref: '#/components/schemas/PostPlatformDemoSitesRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              examples:
