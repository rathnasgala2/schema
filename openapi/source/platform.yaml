    put:
      description: |
        Operators only, with recent authentication and a browser session; a key is always refused. Replaces the setting's release value at the version in `If-Match`. The value must satisfy the key's bounds or allowlist (`400 VALIDATION_FAILED`). `reason` is a non-sensitive operator reason code recorded in the audit event. `404 SETTING_UNKNOWN` for an undefined key.
      operationId: putPlatformSettingsByKey
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: youtube.monthlyImportLimit
          in: path
          name: key
          required: true
          schema:
            $ref: '#/components/schemas/PlatformSettingKey'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCsrfToken'
