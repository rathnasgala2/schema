  /v2/platform/caches/{cacheId}:evict:
    post:
      description: |
        Operators only, with recent authentication. Advances the named cache's
        durable epoch at the exact version in `If-Match`; all serving instances
        converge on that epoch, while `localEntryCount` reports only the
        responding instance. `reason` is the non-sensitive reason code recorded
        in the audit event.
      operationId: postPlatformCachesByCacheIdEvict
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: GITHUB_INSTALLATION_TOKEN
          in: path
          name: cacheId
          required: true
          schema:
            enum:
              - GITHUB_INSTALLATION_TOKEN
              - GITHUB_REPOSITORY_METADATA
              - GITHUB_REPOSITORY_CONTENT
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  reason: CREDENTIAL_ROTATION
            schema:
              $ref: '#/components/schemas/PostPlatformCachesByCacheIdEvictRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    epoch: 4
                    localEntryCount: 0
                    name: GITHUB_INSTALLATION_TOKEN
                    ttlSeconds: 300
                    updatedAt: 2026-10-10T12:00:00.000Z
                    updatedByPersonId: 018f0000-0000-7000-8000-000000000001
                    version: 4
              schema:
                $ref: '#/components/schemas/PostPlatformCachesByCacheIdEvictResponse'
          description: evict platform cache succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/RequestInvalid'
        '401':
          $ref: '#/components/responses/PlatformAuthenticationRequired'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
        '409':
          $ref: '#/components/responses/CommandReplayConflict'
        '412':
          $ref: '#/components/responses/StaleAggregateVersion'
      security:
        - browserSession: []
      summary: evict platform cache
      tags:
        - platform
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: platform.caches.manage
      x-gala-concurrency: if-match-platform-cache-version
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: evict platform cache
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - AUTHORIZATION_DENIED
        - COMMAND_REPLAY_CONFLICT
        - REAUTH_REQUIRED
        - REQUEST_FIELD_UNKNOWN
        - RESOURCE_NOT_FOUND
        - STALE_AGGREGATE_VERSION
        - VALIDATION_FAILED
      x-gala-replay-identity: idempotency-key
      x-gala-state-guards:
        - NONE
      x-gala-success-category: update
      x-gala-tenant-scope: NONE
