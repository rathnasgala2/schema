  /v2/platform/audit-events:
    get:
      description: |
        Operators only (a configured platform operator with recent
        authentication). Audit events across every organization, newest first,
        filtered by any combination of organization, publication, actor, action
        and time window (`from` inclusive, `to` exclusive).
      operationId: getPlatformAuditEvents
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - description: Only events of this organization.
          example: 018f0000-0000-7000-8000-000000000001
          in: query
          name: organizationId
          required: false
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - description: Only events of this publication.
          example: 018f0000-0000-7000-8000-000000000001
          in: query
          name: publicationId
          required: false
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - description: Only events by this actor.
          example: 018f0000-0000-7000-8000-000000000001
          in: query
          name: actorId
          required: false
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - description: Only events with this action.
          example: publication.publish
          in: query
          name: action
          required: false
          schema:
            maxLength: 120
            minLength: 1
            type: string
        - description: Only events at or after this instant.
          example: 2026-10-09T12:00:00.000Z
          in: query
          name: from
          required: false
          schema:
            format: date-time
            pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z$
            type: string
        - description: Only events before this instant.
          example: 2026-10-09T12:00:00.000Z
          in: query
          name: to
          required: false
          schema:
            format: date-time
            pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z$
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    hasMore: false
                    items:
                      - action: publication.publish
                        actorId: 018f0000-0000-7000-8000-000000000002
                        actorType: PRINCIPAL
                        correlationId: 018f0000-0000-7000-8000-000000000001
                        eventId: 018f0000-0000-7000-8000-000000000001
                        occurredAt: 2026-10-09T12:00:00.000Z
                        organizationId: 018f0000-0000-7000-8000-000000000001
                        outcomeCode: SUCCEEDED
                        targetId: 018f0000-0000-7000-8000-000000000001
                        targetType: publication
              schema:
                $ref: '#/components/schemas/GetPlatformAuditEventsResponse'
          description: list audit events across the platform succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    code: VALIDATION_FAILED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: VALIDATION_FAILED
                    type: urn:gala:problem:validation-failed
              schema:
                $ref: '#/components/schemas/Problem'
          description: VALIDATION_FAILED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - VALIDATION_FAILED
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
                REAUTH_REQUIRED:
                  summary: REAUTH_REQUIRED
                  value:
                    code: REAUTH_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: REAUTH_REQUIRED
                    type: urn:gala:problem:reauth-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED, REAUTH_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
            - REAUTH_REQUIRED
        '403':
          content:
            application/problem+json:
              examples:
                AUTHORIZATION_DENIED:
                  summary: AUTHORIZATION_DENIED
                  value:
                    code: AUTHORIZATION_DENIED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 403
                    title: AUTHORIZATION_DENIED
                    type: urn:gala:problem:authorization-denied
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHORIZATION_DENIED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHORIZATION_DENIED
      security:
        - browserSession: []
      summary: list audit events across the platform
      tags:
        - platform
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: platform.audit.view
      x-gala-concurrency: none
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: list audit events across the platform
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - AUTHORIZATION_DENIED
        - REAUTH_REQUIRED
