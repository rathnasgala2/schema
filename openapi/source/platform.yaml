  /v2/platform/users/{personId}:contact:
    post:
      description: |
        Operators only, with recent authentication. Queues one message to the
        person's contact email, which they agreed to at sign-in. The address is
        never returned; the message carries the fixed Galascribe wrapper and
        the operator's text. `category` is `ACCOUNT`, `SECURITY` or `SERVICE`.
        `reason` is a non-sensitive operator reason code recorded in the audit
        event. `Idempotency-Key` is the queued-message identity. `202` means the
        message is queued, not delivered. `404 RESOURCE_NOT_FOUND` for an
        unknown person; `409 CONTACT_EMAIL_ABSENT` when no contact email is on
        file or it was withdrawn.
      operationId: postPlatformUsersByPersonIdContact
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
