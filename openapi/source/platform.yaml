            $ref: '#/components/schemas/PlatformWebhookEventType'
        - description: Only events in this processing state.
          example: PROCESSED
          in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/PlatformWebhookProcessingStatus'
        - description: Only events first seen at or after this instant.
          example: 2026-10-03T12:00:00.000Z
          in: query
          name: from
          required: false
          schema:
            format: date-time
            pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\.[0-9]{3}Z$
