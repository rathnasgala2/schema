  /v2/organizations/{organizationId}/publications/{publicationId}/repository-changes/{changeId}:bring-up-to-date:
    post:
      description: |
        A file-level three-way merge of `changeId` onto the repository's
        current main branch head, computed from blob ids only. The server
        never merges text and never writes conflict markers into a person's
        repository: when every path merges cleanly (no path was changed on
        both sides to different content, and no path was edited on one side
        and deleted on the other), a new `RepositoryChange` is planned from
        the merged blob set and returned `201`. When any path conflicts,
        nothing is written and no change is created; `409
        INVALID_SOURCE_STATE` names each conflicting path in `errors[]`
        (`code: CONTENT_CONFLICT`, `pointer: /documents/<path>` or
        `/assets/<path>`, each path one RFC 6901-escaped JSON Pointer token)
        and carries the live main head on `X-Gala-Current-Head`. The App
        then reads three versions of each conflicting document through the
        document read -- Before (`changeId`'s `baseRevision`), Yours
        (`changeId`'s `proposedRevision`), Theirs (the head named by
        `X-Gala-Current-Head`) -- merges in the browser, and submits a new
        `content-changes:plan` with `baseRevision` set to that head (journey
        state P4). `changeId` itself is untouched either way.
