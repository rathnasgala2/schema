  /v2/organizations/{organizationId}/publications/{publicationId}/repository:set-up:
    post:
      description: |
        Computes the user template repository's files that are missing from the linked
        repository's main branch and commits only those, so that nothing already
        present is changed. A path that exists with different content is a
        conflict: nothing is written, and `GET .../repository/setup` reports it
        under `conflicts`. On a GitHub Pages destination this also enables
        Pages with the workflow build type; a `403 AUTHORIZATION_DENIED` names
        that the installation has not accepted the `pages: write` permission.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdRepositorySetUp
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
