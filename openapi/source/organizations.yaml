  /v2/organizations/{organizationId}/owner-transfers:preview:
    post:
      description: |
        Computes and persists the consequences of handing this organization to
        the named successor, so the owner can read them before confirming. Name
        the successor exactly once, as `POST .../owner-transfers` will. `409
        SUCCESSOR_NOT_MEMBER` when a COLLABORATIVE organization names someone
        who is not an ACTIVE member; `409 TRANSFER_EXISTS` while another
        transfer is pending. Nothing changes until the transfer is created and
        accepted.
      operationId: postOrganizationsByOrganizationIdOwnerTransfersPreview
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
