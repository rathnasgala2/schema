  /v2/organizations/{organizationId}/publications/{publicationId}/changes:publish:
    post:
      description: |
        Publishes the named repository changes together. For each change, in order:

        1. If the change is behind the main branch head it is brought up to date automatically when that is clean (the same file-level merge as `:bring-up-to-date`). When it is not clean nothing is written for any change and the response is `409 INVALID_SOURCE_STATE` with one error per conflicting path (`code: CONTENT_CONFLICT`, `pointer: /documents/<path>` or `/assets/<path>`) and the live head on `X-Gala-Current-Head`.
        2. If the publication's `publishingPolicy.requireReview` is true and the change has no approval, `409 INVALID_SOURCE_STATE` with `errors[].code REVIEW_REQUIRED` pointed at `/changeIds/<index>`.
        3. If `publishingPolicy.galascribeMerges` is true (the default) the server opens and merges the pull request itself through the GitHub App. Otherwise each change must already be merged on GitHub; one that is not is `409 INVALID_SOURCE_STATE` with `errors[].code SOURCE_NOT_MERGED` pointed at `/changeIds/<index>`.

        Then ONE deploy of the resulting main head is started. Success is `202` with the accepted operation (kind `publish`; `publishId` names it, and the operation's `subject.generationId` names the generation once it exists). `scheduledFor` schedules the deploy instead of starting it now and additionally needs `publication.schedule`; it is cancelled with `:cancel` on the publish. `Idempotency-Key` replays the same acceptance. Whole-request validation happens before any change is merged: a refused request merges nothing.

        SCHEMA-3.3.0 scheduling: with `scheduledFor` the request is validated
        exactly as an immediate publish (changes publishable, review state,
        repository set up, binding active, no publish in flight) and nothing is
        merged now; the named changes are merged and deployed at `scheduledFor`,
        after the same checks run again. `scheduledFor` must be at least 5
        minutes and at most 366 days ahead, else `422 VALIDATION_FAILED` pointed
        at `/scheduledFor`. One schedule per publication: `409 SCHEDULE_EXISTS`
        while another is pending (its `publishId` is in the problem `detail` and
        in the site read's `schedule`). `409 CANONICAL_BASE_MISMATCH` when the
        merged head's `gala/publication.json` `canonicalBase` is not the address
        the site is served at (the active custom domain, else the github.io
        address); the problem `detail` names the expected value.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdChangesPublish
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
