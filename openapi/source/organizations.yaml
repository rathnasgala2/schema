  /v2/organizations/{organizationId}/publications/{publicationId}/publishes/{publishId}:update-default-branch:
    post:
      description: |
        The site stays live independently of this: a verified publish
        fast-forwards the repository's default branch to the published
        revision, and if GitHub refuses because the branch is protected
        (`BLOCKED_BY_PROTECTION`) or the branch moved since
        (`DIVERGED`), this retries the same fast-forward after the person has
        resolved it on GitHub. Never a forced update, never a delete, never any
        branch but the default.
