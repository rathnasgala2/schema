  /v2/organizations/{organizationId}/publications/{publicationId}/appearance:
    get:
      description: |
        Reads this publication's theme selection at the linked repository's
        current main branch head: `selected` from `gala/appearance.json`
        (`theme`, `colorMode.default`), `built` from the `theme` block of
        `gala.lock.json`, and the closed five-theme `catalog` the server can
        write. `selected.themeId` and `built.themeId` are `null` when that
        file names a package outside the catalog ("Custom theme").
        `consistent` is true when `selected` and `built` name the same
        package. `setUp` matches `GET .../repository/setup`'s `state`.
        `openChange` names an existing not-yet-published repository change
        of this publication that touches appearance, or is `null`, so a
        client links to it instead of planning a second one. The browser
        never reads or edits `gala/appearance.json` or `gala.lock.json` as
        text; `GET .../content/documents` still refuses both paths.
