            type: string
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  adapterId: do-spaces
                  providerBinding:
                    basePath: /
                    region: nyc3
                    servedBucket: served-example
                    stagingBucket: staging-example
            schema:
              $ref: '#/components/schemas/PutOrganizationsByOrganizationIdPublicationsByPublicationIdDestinationRequest'
        required: true
      description: |
        Sets or replaces the publication's deployment destination (LOCAL-63).
        `If-Match` is required and is the CAS precondition against `version`;
        `"0"` means create (no destination row exists yet). While `state` is
        `UNSET` or `SET` a new `PUT` replaces the chosen adapter and, for
        `do-spaces`, its provider coordinates. Once `state` is `LOCKED` (the
        first accepted publish fixed the destination) every `PUT` is refused
        `409 INVALID_SOURCE_STATE`; a different destination requires a new
        publication. For `do-spaces`, `providerBinding.region` must be one row
        of the accepted region catalog and `servedBucket`/`stagingBucket` must
        differ, refused `422 VALIDATION_FAILED` with pointer
        `/providerBinding/stagingBucket` (this inequality cannot be expressed
        as a JSON Schema pattern); DigitalOcean bucket names are globally
        unique, so a bucket
        already bound to another Gala destination is refused
        `409 INVALID_SOURCE_STATE` with a pointer to the conflicting member --
        this reveals only what DigitalOcean itself already reveals (the name is
        taken). `github-pages` and `local-directory` forbid `providerBinding`
        entirely; Pages coordinates are always derived from the live repository
        binding, never proposed here. There is no `DELETE`: unsetting is a
        `PUT` of a different adapter while the destination is not yet locked.
