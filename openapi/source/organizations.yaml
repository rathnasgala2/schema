  /v2/organizations/{organizationId}/publications/{publicationId}/content/assets:
    get:
      description: |
        Bytes of one image under a declared asset root, with the same
        `revision` rule as the document read. `Content-Type` is exactly one of
        the six closed values below, sniffed from the asset's own bytes rather
        than trusted from what was written at plan time, with
        `X-Content-Type-Options: nosniff` and `Content-Disposition: inline` so
        a browser renders it and never executes it. An asset over 5 MiB is
        `422 VALIDATION_FAILED` pointed at `/path`.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdContentAssets
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: assets/example.png
          in: query
          name: path
          required: true
          schema:
            maxLength: 512
            minLength: 1
            pattern: ^(?!/)(?!.*(?:^|/)\.)(?!gala(?:/|$))(?!gala\.lock\.json$)[^\x00-\x1f\x7f\\]+$
            type: string
        - example: sha1:0000000000000000000000000000000000000000
          in: query
          name: revision
          required: false
          schema:
            pattern: ^(?:sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$
            type: string
      responses:
        '200':
          content:
            image/png:
              schema:
                format: binary
                type: string
            image/jpeg:
              schema:
                format: binary
