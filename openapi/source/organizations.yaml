  /v2/organizations/{organizationId}/publications/{publicationId}/destination:
    get:
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdDestination
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
      description: |
        The publication's chosen deployment destination (LOCAL-63). The
        sub-resource exists for every publication whether or not it has been
        set: `state: UNSET` with `version: 0` is the honest representation of
        "no destination chosen yet", so `PUT` can use the required `If-Match`
        header uniformly ("0" means create) with no `If-None-Match` special
        case and no separate create operation. `state: SET` means the author
        has chosen a destination that has not yet been fixed by a publish;
        `state: LOCKED` means the first accepted publish fixed it permanently
        (a new destination requires a new publication). `adapterId`,
        `environment` and `providerBinding` are present exactly when `state`
        is `SET` or `LOCKED`. For `github-pages`, `providerBinding` is derived
        from the live repository binding and is absent when the publication is
        currently unbound. For `do-spaces`, `providerBinding` carries the
        complete DEC-097 provider binding, including the two pre-authorized
        control-plane digests the workload deployment intent must reproduce.
        For `local-directory`, `providerBinding` is absent (nothing to
        configure). `admittedRegions` is the exact accepted DigitalOcean Spaces
        region catalog, present regardless of the chosen adapter, so a client
        never hard-codes provider facts.
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    adapterId: do-spaces
                    admittedRegions:
                      - nyc3
                      - sfo3
                    environment: do-spaces
                    providerBinding:
                      basePath: /
                      controlPlaneBindingDigest: sha256:1111111111111111111111111111111111111111111111111111111111111111
                      mutationKeyDigest: sha256:2222222222222222222222222222222222222222222222222222222222222222
                      region: nyc3
                      regionCatalogDigest: sha256:3333333333333333333333333333333333333333333333333333333333333333
                      servedApiOrigin: https://served-example.nyc3.digitaloceanspaces.com
                      servedBucket: served-example
                      stagingApiOrigin: https://staging-example.nyc3.digitaloceanspaces.com
                      stagingBucket: staging-example
                      targetDigest: sha256:4444444444444444444444444444444444444444444444444444444444444444
                      websiteConfigurationDigest: sha256:5555555555555555555555555555555555555555555555555555555555555555
                      websiteOrigin: https://served-example.nyc3-static.digitaloceanspaces.com
                    publicationId: 018f0000-0000-7000-8000-000000000001
                    state: SET
                    version: 1
              schema:
                $ref: '#/components/schemas/GetOrganizationsByOrganizationIdPublicationsByPublicationIdDestinationResponse'
          description: inspect publication destination succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
