  /v2/organizations/{organizationId}/publications/{publicationId}/content/documents:
    get:
      description: |
        `revision` omitted reads `path` at the linked repository's current main
        branch head. A caller-supplied `revision` is checked against the
        database, never accepted on assertion alone: it must be the current
        main head, the `proposedRevision` or the `baseRevision` of a
        `RepositoryChange` this publication owns, or a revision this
        publication has published -- the `baseRevision` clause is what keeps
        a bring-up-to-date conflict's Before version readable even after the
        main branch has moved again. Any other value is `404
        RESOURCE_NOT_FOUND`, exactly as an unknown path is, so the read never
        discloses which revisions exist elsewhere. `frontmatter` is the
        header block validated against `content-frontmatter.schema.json`;
        `unknownFrontmatter` carries every header member the schema does not
        name, byte-preserved for a later write. A file whose header block does
        not parse, or whose size exceeds 1 MiB, is `422 VALIDATION_FAILED`
        pointed at `/path`.
