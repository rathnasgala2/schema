  /v2/organizations/{organizationId}/publications/{publicationId}/reviews:
    get:
      description: |
        Every review this publication has, newest first, on a stable keyset
        cursor, optionally narrowed to one lifecycle state. Without it a
        Reviews screen can only show reviews whose ids the reader already
        holds, and the approved review that `publishes` consumes cannot be
        offered as a choice (LOCAL-51).
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdReviews
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
