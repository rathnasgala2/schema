  /v2/organizations/{organizationId}/publications/{publicationId}:previewRetirement:
    post:
      description: 'Computes and persists the exact consequences of retiring
        this publication

        and returns the identifier and digest that the retirement command must

        quote back. The client never fabricates `consequencePreviewId` or

        `consequenceDigest`: it shows the returned consequences to the person,
        and

        sends back what the server issued, so the acknowledgement is an

        acknowledgement of what was actually displayed (LOCAL-36 G-17). Preview
        is

        gated by the same capability as retirement, so preparing to retire is
        never

        a way to learn more than retiring would.

        '
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdPreviewRetirement
