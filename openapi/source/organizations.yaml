  /v2/organizations/{organizationId}/publications/{publicationId}/content/assets:
    get:
      description: |
        Bytes of one image, sound or video file under a declared asset root
        (an article's cover image, or a file referenced from its body,
        copied through unchanged: no resizing, no derived formats), with the
        same `revision` rule as the document read. `Content-Type` is
        sniffed from the asset's own bytes rather than trusted from what was
        written at plan time, with `X-Content-Type-Options: nosniff` and
        `Content-Disposition: inline` so a browser renders it and never
        executes it. This operation serves eleven types. `image/svg+xml`
        remains in the `200` response's declared content-type list only
        because it was published there since SCHEMA-2.14.0, and removing it
        would not be additive; no server version has ever answered with it.
        A stored SVG is refused with the declared `422` on read exactly as
        on write (`content-changes:plan`'s `ContentChangeAssetEntry` never
        accepts it either): an SVG can carry script, and this operation
        answers `Content-Disposition: inline` from the application's own
        origin, so serving one would let a file in a repository run script
        in a signed-in person's session. Every response declares
        `Accept-Ranges: bytes` and honours a single-range `Range` request
        header for sound and video, so a player can seek: a satisfiable
        range is `206` with `Content-Range`; an unsatisfiable one is `416`
        with the unsatisfied-range `Content-Range` (`bytes`, an asterisk,
        then `/<total>`). An asset over its
        per-category bound (image 5 MiB, sound 20 MiB, video 50 MiB), or
        whose sniffed type is not one of the eleven served types, is
        `422 VALIDATION_FAILED` pointed at `/path`.
