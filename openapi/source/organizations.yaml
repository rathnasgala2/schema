  /v2/organizations/{organizationId}/publications/{publicationId}/repository-changes:
    get:
      description: |
        Every `repository_change` this publication has -- content edits and
        managed-file changes alike -- newest first, on a stable keyset cursor,
        optionally narrowed to one lifecycle state. This is what a Content
        screen's "Proposed changes" section reads to show a change's stage
        without the reader ever holding a commit id.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdRepositoryChanges
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - description: |
            Which repository-change lifecycle state to list. Absent lists every
            state.
          example: PLANNED
          in: query
          name: state
          required: false
          schema:
            enum:
              - REQUESTED
              - PLANNED
              - AWAITING_CONFIRMATION
              - COMMIT_REQUESTED
              - COMMITTING
              - COMMITTED
              - UNKNOWN_RECONCILING
              - FAILED_NO_CHANGE
              - CANCELLED
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    hasMore: false
                    items: []
