  /v2/organizations/{organizationId}/publications/{publicationId}/reviews:
    get:
      description: |
        Every review this publication has, newest first, on a stable keyset
        cursor, optionally narrowed to one lifecycle state. Without it a
        Reviews screen can only show reviews whose ids the reader already
        holds, and the approved review that `publishes` consumes cannot be
        offered as a choice (LOCAL-51).
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdReviews
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - description: |
            Which review lifecycle state to list. Absent lists every state,
            because a Reviews screen shows the publication's review history
            and not only what is outstanding; a client that wants only the
            approved reviews a publish can consume asks for APPROVED.
          example: APPROVED
          in: query
          name: state
          required: false
          schema:
            enum:
              - REQUESTED
              - APPROVED
              - REJECTED
              - INVALIDATED
            type: string
