  /v2/organizations/{organizationId}/publications/{publicationId}/content:
    get:
      description: |
        One git-trees read per declared content root at the linked repository's
        current main branch head, bounded at 2,000 entries. For each listed
        path the server additionally reads that file's header block (bounded,
        from the person's repository, nothing stored) to fill `summary`.
        Exactly one of `summary` or `unreadable` is present on every item this
        operation returns from schema 2.15.0 on: `summary` when the header
        parses, `unreadable` (with a closed `reason`) when it does not or the
        file exceeds the read bound. `kind` comes from the header's own
        `kind` when `summary` is present, and from which declared content
        root the path is under (ARTICLE for `content/articles/`, PAGE for
        `content/pages/`) when it is not. `limit` defaults to 50 here (the
        shared default is 25) because a content list row needs more per
        round trip than most lists; the server may return fewer items than
        `limit` even when more are available. `setUp` reports whether
        `gala/repository.json` is present on main, matching
        `GET .../repository/setup`'s `state`. `publication` is read from the
        settings files
        (`gala/repository.json`, `gala/appearance.json`, `gala/authors/`) at
        this same main-branch head, and is returned on every page of the
        inventory, not only the first, so the editor has these facts
        regardless of which page it opened; it carries no personal data
        beyond what each author file itself already publishes.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdContent
