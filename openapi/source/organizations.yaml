  /v2/organizations/{organizationId}/publications/{publicationId}/repository/setup:
    get:
      description: |
        Whether the linked repository already carries the user template files
        `POST .../repository:set-up` adds. `missing` names the user template
        files not yet present; `conflicts` names ones present with different
        content, populated only while `state` is `CONFLICT`. Computing this
        reads the linked repository through the same configured GitHub App
        identity `POST .../repository:set-up` depends on, so the two
        operations answer the same `503` the same way.
