  /v2/claims/{token}/google:start:
    post:
      description: |
        Needs a signed-in session. Returns the Google authorize URL for one single-use, PKCE-protected transaction bound to this session; the callback is `GET /v2/callbacks/google/claim`. `404 CLAIM_NOT_FOUND`, `410 CLAIM_EXPIRED`, `409 CLAIM_ALREADY_CLAIMED` when the site was taken. A `LINK_ONLY` claim has no channel to prove, so this answers `400 VALIDATION_FAILED` for one. Rate limited (`429 RATE_LIMITED`). The first person to complete acceptance owns the site. Until a claim is `CLAIMED`, anyone who proves the channel may verify it, and a later proof replaces an earlier one.
      operationId: postClaimsByTokenGoogleStart
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
          in: path
          name: token
          required: true
          schema:
            description: 'Claim token: 32 random bytes as unpadded base64url.'
            maxLength: 43
            minLength: 43
            pattern: ^[A-Za-z0-9_-]{43}$
            type: string
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    authorizeUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=example&state=example
              schema:
