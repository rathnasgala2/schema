paths:
  /v2/claims/{token}:
    get:
      description: |
        Needs a signed-in session; signed out is `401 AUTHENTICATION_REQUIRED` and reveals nothing. Returns the site the link offers, what the claimant must show (`proof`) and the ways to show it. For `proof.kind` `YOUTUBE_CHANNEL` the response carries the `channel` and the `methods` that prove it is the caller's. For `LINK_ONLY` there is no channel and `methods` is empty: the caller goes straight to `POST /v2/claims/{token}:accept` after signing in. A response without `proof` is a `YOUTUBE_CHANNEL` claim. `organizationId` and `publicationId` are also returned to the person who issued the link (the site owner reading their own link), who owns the site; accepting it is refused with `409 INVALID_SOURCE_STATE`. `404 CLAIM_NOT_FOUND` for an unknown or revoked link, `410 CLAIM_EXPIRED` once the claim is past its expiry (a demo site's archive date, or the `expiresAt` the site owner chose). Rate limited per caller (`429 RATE_LIMITED`).
      operationId: getClaimsByToken
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
          in: path
          name: token
          required: true
          schema:
            description: 'Claim token: 32 random bytes as unpadded base64url.'
            maxLength: 43
            minLength: 43
            pattern: ^[A-Za-z0-9_-]{43}$
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    channel:
                      handle: '@mayacooks'
                      name: Maya Cooks
                    claimId: 018f0000-0000-7000-8000-000000000001
                    methods:
                      - GOOGLE
                      - DESCRIPTION_CODE
                    proof:
                      channelId: UCabcdefghijklmnopqrstuv
                      handle: '@mayacooks'
                      kind: YOUTUBE_CHANNEL
                    site:
                      name: Maya Cooks
                      url: https://rathnasdemo.github.io/maya-cooks/
                    state: OPEN
              schema:
                $ref: '#/components/schemas/GetClaimsByTokenResponse'
          description: read what a claim link offers succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: VALIDATION_FAILED
                  value:
                    code: VALIDATION_FAILED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 400
                    title: VALIDATION_FAILED
                    type: urn:gala:problem:validation-failed
              schema:
                $ref: '#/components/schemas/Problem'
          description: VALIDATION_FAILED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - VALIDATION_FAILED
        '401':
