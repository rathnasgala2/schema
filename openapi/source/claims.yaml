  /v2/claims/{token}/description-code:
    post:
      description: |
        Needs a signed-in session. Issues a one-time code to put in the YouTube channel description, valid 24 hours; a new request replaces an unexpired code issued to the same person. `404 CLAIM_NOT_FOUND`, `410 CLAIM_EXPIRED`, `409 CLAIM_ALREADY_CLAIMED`, and `409 CLAIM_CODE_PENDING` when a description code issued to another person for this claim is still pending: it expires at the time in the problem detail, so verify with Google instead, or try again after it expires. A `LINK_ONLY` claim has no channel to prove, so this answers `400 VALIDATION_FAILED` for one. Rate limited (`429 RATE_LIMITED`). The first person to complete acceptance owns the site. Until a claim is `CLAIMED`, anyone who proves the channel may verify it, and a later proof replaces an earlier one.
      operationId: postClaimsByTokenDescriptionCode
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
          in: path
          name: token
          required: true
          schema:
            description: 'Claim token: 32 random bytes as unpadded base64url.'
            maxLength: 43
            minLength: 43
            pattern: ^[A-Za-z0-9_-]{43}$
            type: string
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    code: galascribe-7K3M9Q2XAB
                    expiresAt: '2026-10-17T12:00:00.000Z'
              schema:
                $ref: '#/components/schemas/PostClaimsByTokenDescriptionCodeResponse'
          description: issue channel description code succeeded
