  /v2/claims/{token}:accept:
    post:
      description: |
        Needs recent authentication. For a `YOUTUBE_CHANNEL` claim it requires the claim to be verified by this same person (`409 CLAIM_NOT_VERIFIED` otherwise); a `LINK_ONLY` claim has nothing to verify and is accepted from `OPEN`. Then it makes the caller the owner of the site's organisation, which hands the site over. Repeating the call after success returns the same organisation. `409 INVALID_SOURCE_STATE` when the caller is the person who issued the claim or already owns the site: nobody can claim their own site. `409 CLAIM_ALREADY_CLAIMED` when another person claimed it; `410 CLAIM_EXPIRED`. An API key is always refused. The first person to complete acceptance owns the site. Until a claim is `CLAIMED`, anyone who proves the channel may verify it, and a later proof replaces an earlier one.
      operationId: postClaimsByTokenAccept
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
          in: path
          name: token
          required: true
          schema:
            description: 'Claim token: 32 random bytes as unpadded base64url.'
            maxLength: 43
            minLength: 43
            pattern: ^[A-Za-z0-9_-]{43}$
            type: string
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    organizationId: 018f0000-0000-7000-8000-000000000001
                    publicationId: 018f0000-0000-7000-8000-000000000001
              schema:
                $ref: '#/components/schemas/PostClaimsByTokenAcceptResponse'
          description: accept claim and take ownership succeeded
