  /v2/claims/{token}/description-code:check:
    post:
      description: |
        Needs a signed-in session. Reads the channel description through the YouTube Data API and, when it contains the issued code, marks the claim verified for this person and spends the code. A code that is not there yet is `200` with `verified: false` and a `reason`, not a problem. `503 DEPENDENCY_UNAVAILABLE` when YouTube cannot be reached. A `LINK_ONLY` claim has no channel to prove, so this answers `400 VALIDATION_FAILED` for one. Rate limited (`429 RATE_LIMITED`). The first person to complete acceptance owns the site. Until a claim is `CLAIMED`, anyone who proves the channel may verify it, and a later proof replaces an earlier one.
      operationId: postClaimsByTokenDescriptionCodeCheck
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQ
          in: path
          name: token
          required: true
          schema:
            description: 'Claim token: 32 random bytes as unpadded base64url.'
            maxLength: 43
            minLength: 43
            pattern: ^[A-Za-z0-9_-]{43}$
            type: string
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    reason: CODE_NOT_FOUND_IN_DESCRIPTION
                    verified: false
              schema:
