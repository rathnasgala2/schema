              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - CAPABILITY_UNAVAILABLE
      description: |
        The intersection of what the signed-in user can see and what this
        installation grants, so that a client can offer a repository picker and
        derive the owner id, repository id and default branch from the chosen
        row. Nobody is ever asked to type a numeric GitHub identifier
        (LOCAL-33). An installation the caller cannot see is reported as
        RESOURCE_NOT_FOUND, exactly as an unknown one is, so the read never
        discloses the existence of installations belonging to other people. As
        with the installations list, a stale or revoked GitHub user access token
        is answered `401 REAUTH_REQUIRED` while the Gala session stays valid.
      security:
        - browserSession: []
      summary: repositories this installation grants to the signed-in user
      tags:
        - github
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - Configured GitHub App identity for this deployment
      x-gala-capability-key: null
      x-gala-concurrency: installation-epoch
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose:
        repositories this installation grants to the signed-in user
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - CAPABILITY_UNAVAILABLE
        - REAUTH_REQUIRED
        - RESOURCE_NOT_FOUND
        - VALIDATION_FAILED
      x-gala-replay-identity: safe-query
      x-gala-state-guards:
        - NONE
      x-gala-success-category: query
      x-gala-tenant-scope: NONE
    post:
      description: |
        With `startFrom: USER_TEMPLATE` (the default), the created
        repository generates from the `rathnasgala2/user-template` GitHub
        template; if that template is unreachable, this is `503
        DEPENDENCY_UNAVAILABLE`, retryable, exactly the same declared
        failure an unreachable GitHub for the create itself already answers.
        A repository name already taken on the resolved account is `409
        INVALID_SOURCE_STATE` pointed at `/name`, as already declared.
      operationId: postGithubInstallationsByInstallationIdRepositories
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: '1'
          in: path
          name: installationId
          required: true
          schema:
            pattern: ^[1-9][0-9]{0,19}$
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        content:
          application/json:
            examples:
              nominal:
                summary: Nominal valid request
                value:
                  description: example description
                  name: example
                  visibility: PRIVATE
            schema:
              $ref: '#/components/schemas/PostGithubInstallationsByInstallationIdRepositoriesRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    defaultBranch: main
                    fullName: example/example
                    installationAccess: GRANTED
                    name: example
                    ownerId: '1'
                    ownerLogin: example
                    private: true
                    repositoryId: '1'
              schema:
                $ref: '#/components/schemas/PostGithubInstallationsByInstallationIdRepositoriesResponse'
          description:
            create a repository on this installation's account succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-Id:
