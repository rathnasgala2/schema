paths:
  /v2/github/app:
    get:
      operationId: getGithubApp
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    installUrl: https://github.com/apps/galascribe/installations/new
                    slug: galascribe
              schema:
                $ref: '#/components/schemas/GetGithubAppResponse'
          description: public identity of the Galascribe GitHub App succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
        '503':
          content:
            application/problem+json:
              examples:
                CAPABILITY_UNAVAILABLE:
                  summary: CAPABILITY_UNAVAILABLE
                  value:
                    code: CAPABILITY_UNAVAILABLE
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 503
                    title: CAPABILITY_UNAVAILABLE
                    type: urn:gala:problem:capability-unavailable
              schema:
                $ref: '#/components/schemas/Problem'
          description: CAPABILITY_UNAVAILABLE
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - CAPABILITY_UNAVAILABLE
      description: |
        The App's Connections screen and the unbound Source state need somewhere
        to send an owner who has not installed the GitHub App yet. The slug and
        installation URL are deployment configuration, not a person's data, so
        this is a safe, replayable read; the client links to `installUrl`
        verbatim rather than assembling a GitHub URL of its own (LOCAL-36 G-05).
        A deployment that has not been told which GitHub App it fronts answers
        `503 CAPABILITY_UNAVAILABLE` rather than inventing a slug, so a client
        must treat the install link as an optionally available affordance.
      security:
        - browserSession: []
      summary: public identity of the Galascribe GitHub App
      tags:
        - github
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - Configured GitHub App identity for this deployment
      x-gala-capability-key: null
      x-gala-concurrency: github-app-identity
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose: public identity of the Galascribe GitHub App
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - CAPABILITY_UNAVAILABLE
      x-gala-replay-identity: safe-query
      x-gala-state-guards:
        - NONE
      x-gala-success-category: query
      x-gala-tenant-scope: NONE
  /v2/github/installations:
    get:
      operationId: getGithubInstallations
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    hasMore: false
                    items: []
              schema:
                $ref: '#/components/schemas/GetGithubInstallationsResponse'
          description:
            installations visible through user and GitHub App intersection
            succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
                REAUTH_REQUIRED:
                  summary: REAUTH_REQUIRED
                  value:
                    code: REAUTH_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: REAUTH_REQUIRED
                    type: urn:gala:problem:reauth-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED, REAUTH_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
            - REAUTH_REQUIRED
        '503':
          content:
            application/problem+json:
              examples:
                CAPABILITY_UNAVAILABLE:
                  summary: CAPABILITY_UNAVAILABLE
                  value:
                    code: CAPABILITY_UNAVAILABLE
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 503
                    title: CAPABILITY_UNAVAILABLE
                    type: urn:gala:problem:capability-unavailable
              schema:
                $ref: '#/components/schemas/Problem'
          description: CAPABILITY_UNAVAILABLE
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - CAPABILITY_UNAVAILABLE
      description: |
        Listing installations is a safe, replayable query that also records a
        first observation of each reported installation as a global provider fact
        (App-JWT re-verified, never trusting the user token or any callback), so
        that a subsequent repository binding can reference it; provider
        unavailability during that observation never fails the listing (LOCAL-24).
        A session whose stored GitHub user access token no longer satisfies this
        read is answered `401 REAUTH_REQUIRED`, not `AUTHENTICATION_REQUIRED`:
        the Gala session is intact and only the provider grant must be renewed.
      security:
        - browserSession: []
      summary: installations visible through user and GitHub App intersection
      tags:
        - github
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - Configured GitHub App identity for this deployment
      x-gala-capability-key: null
      x-gala-concurrency: installation-epoch
      x-gala-conditional-capabilities: []
      x-gala-example-profile: NOMINAL_SUCCESS_AND_EACH_REACHABLE_PROBLEM
      x-gala-nullability: required-and-nullable-are-explicit
      x-gala-purpose:
        installations visible through user and GitHub App intersection
      x-gala-reachable-problems:
        - AUTHENTICATION_REQUIRED
        - CAPABILITY_UNAVAILABLE
        - REAUTH_REQUIRED
        - VALIDATION_FAILED
      x-gala-replay-identity: safe-query
      x-gala-state-guards:
        - NONE
      x-gala-success-category: query
      x-gala-tenant-scope: NONE
