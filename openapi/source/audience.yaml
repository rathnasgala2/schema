  /v2/organizations/{organizationId}/publications/{publicationId}/overview:
    get:
      description: |
        Needs `publication.view`. The Home page's at-a-glance numbers for one
        site as a `PublicationOverview`. The body is a snapshot cached for at
        least 24 hours per site: `computedAt` says when it was taken and
        `expiresAt` when it may be recomputed. `lastPublish` and
        `reviewsWaitingOnYou` are live and read at request time, not from the
        snapshot. `posts.complete` is false when the scan was truncated, and
        the post counts are then a lower bound. The response carries an `ETag`
        and honours `If-None-Match` with `304` and no body. `POST
        .../overview:refresh` recomputes the snapshot on demand.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdOverview
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - description: A previously returned `ETag`; a match answers `304`.
          example: '"a1b2c3d4"'
          in: header
          name: If-None-Match
          required: false
          schema:
            maxLength: 256
            type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    computedAt: '2026-10-31T06:00:00.000Z'
                    expiresAt: '2026-11-01T06:00:00.000Z'
                    followers: 12
                    interactions:
                      commentsAwaitingModeration: 1
                      comments: 8
                      reactions: 41
                    lastPublish:
                      at: '2026-10-30T18:30:00.000Z'
                      outcome: SUCCEEDED
                    newsletterSubscribers:
                      confirmed: 120
                      pending: 4
                    posts:
                      complete: true
                      draft: 3
                      published: 25
                      scheduled: 2
                    reviewsWaitingOnYou: 0
                    unreadContactMessages: 2
              schema:
                $ref: '#/components/schemas/GetOrganizationsByOrganizationIdPublicationsByPublicationIdOverviewResponse'
          description: read a site's overview succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            ETag:
              description: Validator of this snapshot and the live fields.
              required: true
              schema:
                maxLength: 256
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '304':
          description: the caller's `If-None-Match` still matches; no body
          headers:
            ETag:
              description: Validator of this snapshot and the live fields.
              required: true
              schema:
                maxLength: 256
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
