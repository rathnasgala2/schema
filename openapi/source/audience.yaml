        "Public, from the contact form on the site. `trap` is a honeypot and
        `elapsedMs` the time the form was open: a non-empty `trap`, or fewer
        than 3 seconds, is answered with the same `202` and the message is
        dropped. More than 2 links in the message is `400 VALIDATION_FAILED`
        pointed at `/message`; `website` and `phone` are accepted only while the
        form asks for them. `409 CONTACT_FORM_UNAVAILABLE` when the site has no
        contact form on. The sender's address is stored sealed; the owners are
        notified in the `messages` category and reply by email."
