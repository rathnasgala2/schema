  /v2/organizations/{organizationId}/publications/{publicationId}/newsletter-sequences/{sequenceId}:activate:
    post:
      description:
        'SCHEMA-3.53.0. Turns a `DRAFT` or `PAUSED` sequence `ACTIVE`: from now
        on subscribers who meet the trigger are enrolled (people already
        confirmed or tagged are not back-filled) and due steps are queued.
        Activating an active sequence changes nothing. `409
        NEWSLETTER_SEQUENCE_EMPTY` when it has no step. Needs
        `publication.settings.manage`. A site on a plan without audience
        automation (Free) gets `409 PLAN_REQUIRED` on a write; reads still work,
        with `planAllows` false, so the App can show the upgrade nudge.'
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdNewsletterSequencesBySequenceIdActivate
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
