paths:
  /v2/organizations/{organizationId}/publications/{publicationId}/followers:
    get:
      description:
        Needs `publication.audience.read`. `total` is every follow of the site,
        `authors` the count per author, and `items` the followers newest first
        as display names, one keyset page at a time. There is no public follower
        count; this list is for the site's owners and admins.
      operationId: getOrganizationsByOrganizationIdPublicationsByPublicationIdFollowers
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: organizationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - example: 018f0000-0000-7000-8000-000000000001
          in: path
          name: publicationId
          required: true
          schema:
            format: uuid
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            type: string
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    authors:
                      - authorId: 018f0000-0000-7000-8000-000000000002
                        displayName: Ada Writer
                        followers: 1
                    items:
                      - authorId: 018f0000-0000-7000-8000-000000000002
                        displayName: Ada Reader
                        followedAt: '2026-10-27T12:00:00.000Z'
                        id: 018f0000-0000-7000-8000-000000000001
                    nextCursor: null
                    total: 1
              schema:
                $ref: '#/components/schemas/GetOrganizationsByOrganizationIdPublicationsByPublicationIdFollowersResponse'
          description: list the followers of a site's authors succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          content:
            application/problem+json:
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    code: AUTHENTICATION_REQUIRED
                    correlationId: 018f0000-0000-7000-8000-000000000001
                    detail: See the operation contract.
                    errors: []
                    retryable: false
                    schemaId: urn:gala:schema:problem:2.0.0
                    schemaVersion: 2.0.0
                    status: 401
                    title: AUTHENTICATION_REQUIRED
                    type: urn:gala:problem:authentication-required
              schema:
                $ref: '#/components/schemas/Problem'
          description: AUTHENTICATION_REQUIRED
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            X-Correlation-Id:
              $ref: '#/components/headers/XCorrelationId'
          x-gala-problem-codes:
            - AUTHENTICATION_REQUIRED
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
      security:
        - browserSession: []
      summary: list the followers of a site's authors
      tags:
        - audience
      x-gala-activation-gate: MVP
      x-gala-activation-guards:
        - NONE
      x-gala-capability-key: publication.audience.read
