  /v2/organizations/{organizationId}/publications/{publicationId}/contact-messages:export:
    post:
      description:
        Needs `publication.audience.export` and recent authentication (`401
        REAUTH_REQUIRED` when the session is stale). The answer is a UTF-8 CSV
        file with a header row
        (`id,name,email,website,phone,message,state,createdAt,handledAt`) that
        the App saves as a download. A cell that starts with `=`, `+`, `-`, `@`,
        a tab or a carriage return is prefixed with an apostrophe so a
        spreadsheet does not run it as a formula.
      operationId: postOrganizationsByOrganizationIdPublicationsByPublicationIdContactMessagesExport
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - example: 018f0000-0000-7000-8000-000000000001
