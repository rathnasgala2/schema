        - example: new
          in: query
          name: state
          required: false
          schema:
            $ref: '#/components/schemas/ContactMessageState'
      responses:
        '200':
          content:
            application/json:
              examples:
                nominal:
                  summary: Nominal successful response
                  value:
                    counts:
                      handled: 0
                      new: 1
                    items:
                      - createdAt: '2026-10-27T12:00:00.000Z'
                        email: reader@example.com
                        handledAt: null
                        id: 018f0000-0000-7000-8000-000000000001
