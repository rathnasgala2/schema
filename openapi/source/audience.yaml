              schema:
                format: binary
                type: string
          description: export a site's contact-form messages as CSV succeeded
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionAttachment'
            X-Content-Type-Options:
