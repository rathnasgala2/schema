        used to find out who subscribes. A confirmation email follows (double
        opt-in; unconfirmed requests expire after 7 days; at most 3 confirmation
        emails per address per day). `trap` is a honeypot: a person leaves it
        empty, and a non-empty value is answered with the same `202` and nothing
        is sent. `409 NEWSLETTER_UNAVAILABLE` when the site is not in Galascribe
        newsletter mode or sends are paused; `409 NEWSLETTER_FULL` when the
