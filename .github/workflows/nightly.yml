name: Nightly

on:
  schedule:
    # 03:17 UTC daily: outside US and EU business hours, and off the top of
    # the hour to avoid GitHub Actions' scheduled-workflow congestion window.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Complete repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the Java 21 parity toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Java parity harness build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key:
            gradle-${{ runner.os }}-${{ hashFiles('parity/java/gradle.lockfile',
            'parity/java/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      # This is the complete gate: everything that ci.yml runs on every push
      # (format, lint, typecheck, architecture, the quick build/codegen
      # checks and the fast unit tests), plus the checks that are too slow
      # for a per-push budget: parity-expectations regeneration, the full
      # fixture-corpus test, cross-language parity, the Java supply-chain
      # check, duplication, license inventory, SBOM and npm audit.
      - name: Run the complete repository gates
        run: npm run verify

      - name: Report a loud failure for the scheduled run
        if: failure()
        run: |
          echo "::error::Nightly verify failed at $(date -u +%FT%TZ). See the job logs above for the failing gate." >&2

      # An annotation on the run log is not a notification -- nothing looks
      # at it unless someone already suspects a problem and opens the
      # Actions tab (SCH-M16). File or update one tracking issue instead, so
      # a nightly-only failure (parity-expectations, the full fixture
      # corpus, cross-language parity, duplication, licenses, SBOM, audit)
      # surfaces the same way a human-authored bug report would.
      - name: File or update a tracking issue for the failed run
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = 'Nightly verify is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled nightly run failed at ${new Date().toISOString()}.\n\nSee the job log: ${runUrl}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure',
            });
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['nightly-failure'],
              });
            }
