name: Nightly

on:
  schedule:
    # 03:17 UTC daily: outside US and EU business hours, and off the top of
    # the hour to avoid GitHub Actions' scheduled-workflow congestion window.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Complete repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the Java 21 parity toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Java parity harness build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key:
            gradle-${{ runner.os }}-${{ hashFiles('parity/java/gradle.lockfile',
            'parity/java/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      # This is the complete gate: everything that ci.yml runs on every push
      # (format, lint, typecheck, architecture, the quick build/codegen
      # checks and the fast unit tests), plus the checks that are too slow
      # for a per-push budget: parity-expectations regeneration, the full
      # fixture-corpus test, cross-language parity, the Java supply-chain
      # check, duplication, license inventory, SBOM and npm audit.
      - name: Run the complete repository gates
        run: npm run verify

      - name: Report a loud failure for the scheduled run
        if: failure()
        run: |
          echo "::error::Nightly verify failed at $(date -u +%FT%TZ). See the job logs above for the failing gate." >&2
          exit 1
