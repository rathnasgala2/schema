name: Release

on:
  push:
    branches:
      - main
    paths:
      - diagnostics/diagnostic-map.json
      - docs/catalogs/schema-inventory.json
      - examples/**
      - fixtures/**
      - generated/**
      - LICENSE
      - NOTICE
      - openapi/**
      - package-lock.json
      - package.json
      - README.md
      - sbom.cdx.json
      - schemas/**
      - src/**
      - THIRD_PARTY_LICENSES.json
      - types/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish the declared package version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install the Java 21 generated-contract toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete release gate
        run: npm run verify

      - name: Verify the package payload
        run: npm pack --dry-run

      - name: Reject version reuse
        id: version-check
        shell: bash
        run: |
          package_name="$(node --input-type=module -e "import definition from './package.json' with {type: 'json'}; process.stdout.write(definition.name)")"
          package_version="$(node --input-type=module -e "import definition from './package.json' with {type: 'json'}; process.stdout.write(definition.version)")"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "::notice::${package_name}@${package_version} is already published; skipping publish (bump package.json's version to release new content)."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the CHANGELOG has an entry for this version
        if: steps.version-check.outputs.should_publish == 'true'
        shell: bash
        run: |
          version="${{ steps.version-check.outputs.package_version }}"
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section; add one before publishing." >&2
            exit 1
          fi

      - name: Publish with trusted provenance
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      - name: Tag the release
        if: steps.version-check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version-check.outputs.package_version }}"
          tag="v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "refs/tags/${tag}"
