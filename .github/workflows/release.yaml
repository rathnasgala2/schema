name: Release

on:
  push:
    branches:
      - main
    paths:
      - compatibility/compatibility.json
      - diagnostics/diagnostic-map.json
      - docs/catalogs/schema-inventory.json
      - examples/**
      - fixtures/**
      - generated/**
      - LICENSE
      - NOTICE
      - openapi/**
      - package-lock.json
      - package.json
      - README.md
      - sbom.cdx.json
      - schemas/**
      - src/**
      - THIRD_PARTY_LICENSES.json
      - types/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish the declared package version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install the Java 21 generated-contract toolchain
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete release gate
        run: npm run verify

      - name: Verify the package payload
        run: npm pack --dry-run

      - name: Reject version reuse
        shell: bash
        run: |
          package_name="$(node --input-type=module -e "import definition from './package.json' with {type: 'json'}; process.stdout.write(definition.name)")"
          package_version="$(node --input-type=module -e "import definition from './package.json' with {type: 'json'}; process.stdout.write(definition.version)")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already immutable" >&2
            exit 1
          fi

      - name: Publish with trusted provenance
        run: npm publish --access public --provenance
