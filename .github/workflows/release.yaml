name: Release

on:
  push:
    branches:
      - main
    paths:
      - diagnostics/diagnostic-map.json
      - docs/catalogs/schema-inventory.json
      - examples/**
      - fixtures/**
      - generated/**
      - LICENSE
      - NOTICE
      - openapi/**
      - package-lock.json
      - package.json
      - README.md
      - sbom.cdx.json
      - schemas/**
      - src/**
      - THIRD_PARTY_LICENSES.json
      - types/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package the declared version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the Java 21 generated-contract toolchain
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete release gate
        run: npm run verify

      - name: Build the package artifact
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Upload the package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-package-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 90
