name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Format, lint, typecheck, architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check architecture boundaries
        run: npm run architecture

      - name: Check workflow pins
        run: npm run workflows:check

  generated-artifacts:
    name: Generated artifacts are current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      # npm run build also runs parity-expectations:check, which drives the
      # cross-language parity harness and takes minutes, not seconds. That
      # check stays out of the fast gate; it runs nightly as part of the
      # complete `npm run verify`.
      - name: Check pinned source data, tables, schemas and fixtures
        run: |
          npm run source-data:check
          npm run tables:check
          npm run schemas:check
          npm run fixtures:check
          npm run diagnostics:check

      - name: Check declarations, codegen and generated catalogs
        run: |
          npm run declarations:check
          npm run openapi:check
          npm run events:check
          npm run codegen:check
          npm run app-catalogs:check
          npm run browser-safety:check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      # test/t04-fixture-corpus.test.js regenerates and re-verifies the full
      # 833-file fixture corpus; it alone takes over two minutes locally,
      # more than the rest of the suite combined. It stays out of this fast
      # job and runs in its own parallel job below, so it still gates every
      # pull request without lengthening this job's critical path.
      - name: Run the fast unit test suite
        shell: bash
        run: |
          mapfile -t files < <(find test -maxdepth 1 -name '*.test.js' ! -name 't04-fixture-corpus.test.js' | sort)
          node --test "${files[@]}"

  fixture-corpus:
    name: Per-schema fixture coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      # The only test file that walks the manifest and asserts every schema
      # has its valid / boundary / invalid-with-code / unknown-field /
      # adversarial fixture families. It must gate merges, not run
      # post-merge only -- a PR adding a schema root with no fixtures must
      # fail here, not the following night.
      - name: Run the fixture-corpus coverage test
        run: node --test test/t04-fixture-corpus.test.js

  quality:
    name: Package payload and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify the package payload
        run: npm pack --dry-run

      - name: Install the checksum-pinned Gitleaks binary
        shell: bash
        run: |
          install -d "${RUNNER_TEMP}/gitleaks"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "${RUNNER_TEMP}/gitleaks/gitleaks.tar.gz"
          cd "${RUNNER_TEMP}/gitleaks"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            'gitleaks.tar.gz' | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan repository history for secrets
        run: >-
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --redact --no-banner
          --log-opts="--all" .

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned Node.js distribution
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify toolchain pins
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

  # Runs on both the pull-request path and push to main, and only when
  # parity-relevant paths changed, because the cross-language parity harness
  # (Java 21) takes ~5 minutes -- far more than the rest of this fast gate
  # combined. This is schema's core guarantee (LOCAL-67 adversarial review:
  # it must not be nightly-only, and must not be post-merge-only either --
  # a parity break must be caught on the branch that caused it, not fixed
  # forward on main after everyone else has pulled it). nightly.yml's
  # `npm run verify` still exercises it daily regardless of which paths
  # changed.
  parity:
    name: Cross-language parity check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether parity-relevant paths changed
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          # diagnostics/ carries diagnostic-map.json, the artifact both
          # engines normalise their keyword output through -- it IS the
          # parity contract, not incidental to it. examples/, openapi/ and
          # package-lock.json can also change what parity exercises or
          # which Ajv/Networknt versions run.
          pattern='^(schemas/|codegen/|parity/|src/|generated/|fixtures/|diagnostics/|examples/|openapi/|package-lock\.json)'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            base="${{ github.event.pull_request.base.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -z "${before}" ] || [ "${before}" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "${before}" 2>/dev/null; then
              # No usable previous state (first push of a branch, force-push
              # history rewrite, merge queue) -- treat every path as
              # relevant rather than risk a silent false negative.
              echo "relevant=true" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            base="${before}"
          fi
          merge_base="$(git merge-base "${base}" "${{ github.sha }}")"
          if git diff --name-only "${merge_base}" "${{ github.sha }}" | grep -qE "${pattern}"; then
            echo "relevant=true" >>"${GITHUB_OUTPUT}"
          else
            echo "relevant=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Install the pinned Node.js distribution
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the Java 21 parity toolchain
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Java parity harness build
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key:
            gradle-${{ runner.os }}-${{ hashFiles('parity/java/gradle.lockfile',
            'parity/java/build.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify toolchain pins
        if: steps.changed.outputs.relevant == 'true'
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Install locked dependencies
        if: steps.changed.outputs.relevant == 'true'
        run: npm ci

      - name: Run the cross-language parity check
        if: steps.changed.outputs.relevant == 'true'
        run: npm run parity:check
